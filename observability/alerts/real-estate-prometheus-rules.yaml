# yaml-language-server: $schema=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: real-estate-data-platform
  namespace: monitoring

  labels:
    release: monitoring

spec:
  groups:
    - name: real-estate-data-quality
      rules:

        # -----------------------------------------------------
        # Data Quality layer failure
        # -----------------------------------------------------

        - alert: RealEstateDataQualityLayerFailed

          expr: |
            real_estate_dq_layer_status{
              exported_job="real_estate_data_quality"
            } == 0

          for: 2m

          labels:
            severity: critical
            project: real-estate
            component: data-quality

          annotations:
            summary: "Real Estate data quality failure"

            description: >-
              Data Quality validation failed for layer
              {{ $labels.layer }}
              ({{ $labels.medallion }}).

        # -----------------------------------------------------
        # Data Quality metrics are stale
        # -----------------------------------------------------

        - alert: RealEstateDataQualityStale

          expr: |
            (
              time()
              -
              real_estate_dq_layer_last_run_timestamp{
                exported_job="real_estate_data_quality"
              }
            ) > 172800

          for: 10m

          labels:
            severity: warning
            project: real-estate
            component: data-quality

          annotations:
            summary: "Real Estate data quality checks are stale"

            description: >-
              No recent Data Quality execution has been observed for
              layer {{ $labels.layer }}
              ({{ $labels.medallion }})
              for more than 48 hours.

    - name: real-estate-data-platform
      rules:

        # -----------------------------------------------------
        # Metrics collector reported failure
        # -----------------------------------------------------

        - alert: RealEstateMetricsCollectionFailed

          expr: |
            real_estate_pipeline_run_status{
              exported_job="real_estate_data_platform"
            } == 0

          for: 5m

          labels:
            severity: warning
            project: real-estate
            component: observability

          annotations:
            summary: "Real Estate metrics collection failed"

            description: >-
              The Real Estate observability metrics collector
              is reporting a failed execution.

        # -----------------------------------------------------
        # Metrics collector has not succeeded recently
        # -----------------------------------------------------

        - alert: RealEstateMetricsCollectionStale

          expr: |
            (
              time()
              -
              real_estate_pipeline_last_success_timestamp{
                exported_job="real_estate_data_platform"
              }
            ) > 172800

          for: 10m

          labels:
            severity: warning
            project: real-estate
            component: observability

          annotations:
            summary: "Real Estate metrics collection is stale"

            description: >-
              No successful Real Estate platform metrics collection
              has been observed for more than 48 hours.