# yaml-language-server: $schema=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: real-estate-data-platform
  namespace: monitoring

  labels:
    release: monitoring

spec:
  groups:
    - name: real-estate-data-quality
      rules:

        # -----------------------------------------------------
        # Data Quality layer failure
        # -----------------------------------------------------

        - alert: RealEstateDataQualityLayerFailed

          expr: |
            real_estate_dq_layer_status{
              exported_job="real_estate_data_quality"
            } == 0

          for: 2m

          labels:
            severity: critical
            project: real-estate
            component: data-quality

          annotations:
            summary: "Real Estate data quality failure"

            description: >-
              Data Quality validation failed for layer
              {{ $labels.layer }}
              ({{ $labels.medallion }}).

        # -----------------------------------------------------
        # Data Quality metrics are stale
        # -----------------------------------------------------

        - alert: RealEstateDataQualityStale

          expr: |
            (
              time()
              -
              real_estate_dq_layer_last_run_timestamp{
                exported_job="real_estate_data_quality"
              }
            ) > 172800

          for: 10m

          labels:
            severity: warning
            project: real-estate
            component: data-quality

          annotations:
            summary: "Real Estate data quality checks are stale"

            description: >-
              No recent Data Quality execution has been observed for
              layer {{ $labels.layer }}
              ({{ $labels.medallion }})
              for more than 48 hours.

    - name: real-estate-data-platform
      rules:

        # -----------------------------------------------------
        # Metrics collector reported failure
        # -----------------------------------------------------

        - alert: RealEstateMetricsCollectionFailed

          expr: |
            real_estate_pipeline_run_status{
              exported_job="real_estate_data_platform"
            } == 0

          for: 5m

          labels:
            severity: warning
            project: real-estate
            component: observability

          annotations:
            summary: "Real Estate metrics collection failed"

            description: >-
              The Real Estate observability metrics collector
              is reporting a failed execution.

        # -----------------------------------------------------
        # Metrics collector has not succeeded recently
        # -----------------------------------------------------

        - alert: RealEstateMetricsCollectionStale

          expr: |
            (
              time()
              -
              real_estate_pipeline_last_success_timestamp{
                exported_job="real_estate_data_platform"
              }
            ) > 172800

          for: 10m

          labels:
            severity: warning
            project: real-estate
            component: observability

          annotations:
            summary: "Real Estate metrics collection is stale"

            description: >-
              No successful Real Estate platform metrics collection
              has been observed for more than 48 hours.

    - name: real-estate-backend-api
      rules:

        # -----------------------------------------------------
        # Backend API unavailable
        # -----------------------------------------------------

        - alert: RealEstateBackendDown

          expr: |
            up{
              job="real-estate-backend"
            } == 0

          for: 2m

          labels:
            severity: critical
            project: real-estate
            component: backend-api

          annotations:
            summary: "Real Estate Backend API is unavailable"

            description: >-
              Prometheus has been unable to scrape the Real Estate
              Backend API for more than 2 minutes.

        # -----------------------------------------------------
        # Backend API elevated error rate
        # -----------------------------------------------------

        - alert: RealEstateBackendHighErrorRate

          expr: |
            (
              sum(
                rate(
                  real_estate_api_requests_total{
                    job="real-estate-backend",
                    status_code=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    real_estate_api_requests_total{
                      job="real-estate-backend"
                    }[5m]
                  )
                ),
                0.001
              )
            ) > 0.05

          for: 5m

          labels:
            severity: warning
            project: real-estate
            component: backend-api

          annotations:
            summary: "Real Estate Backend API error rate is high"

            description: >-
              More than 5 percent of Backend API requests have returned
              HTTP 5xx responses during the last 5 minutes.

        # -----------------------------------------------------
        # Backend API high latency
        # -----------------------------------------------------

        - alert: RealEstateBackendHighLatency

          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  real_estate_api_request_duration_seconds_bucket{
                    job="real-estate-backend"
                  }[5m]
                )
              )
            ) > 1

          for: 5m

          labels:
            severity: warning
            project: real-estate
            component: backend-api

          annotations:
            summary: "Real Estate Backend API latency is high"

            description: >-
              The Backend API 95th percentile request latency
              has exceeded 1 second for more than 5 minutes.