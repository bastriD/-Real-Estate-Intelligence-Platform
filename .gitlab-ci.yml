workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - database
  - build
  - deploy

include:
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/pipeline-checks.yml
  - local: .gitlab/ci/database.yml
  - local: .gitlab/ci/database-hunter-invoice.yml
  - local: .gitlab/ci/database-search.yml
  - local: .gitlab/ci/airflow.yml
  - local: .gitlab/ci/data-pipeline-image.yml
  - local: .gitlab/ci/warehouse.yml
  - local: .gitlab/ci/governance.yml
  - local: .gitlab/ci/openmetadata.yml
  - local: .gitlab/ci/observability.yml
  - local: .gitlab/ci/backend-tests.yml
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/ai.yml
  - local: .gitlab/ci/ai-mlops.yml
  - local: .gitlab/ci/ai-model-comparison.yml
  - local: .gitlab/ci/pra.yml
