apiVersion: batch/v1
kind: Job
metadata:
  name: real-estate-matching-model-training
  namespace: real-estate
  labels:
    app.kubernetes.io/name: real-estate-matching-model-training
    app.kubernetes.io/part-of: chasse-immobiliere
    app.kubernetes.io/component: ai-mlops
    app.kubernetes.io/managed-by: gitlab-ci
spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: real-estate-matching-model-training
        app.kubernetes.io/part-of: chasse-immobiliere
        app.kubernetes.io/component: ai-mlops

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry-auth

      containers:
        - name: model-trainer

          image: __AI_MLOPS_IMAGE__

          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - src.ai.matching.run_model_training

          env:
            - name: POSTGRES_HOST
              value: real-estate-postgresql.real-estate.svc.cluster.local

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: real_estate

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_PASSWORD

            - name: CI_COMMIT_SHA
              value: "__CI_COMMIT_SHA__"

            - name: CI_COMMIT_SHORT_SHA
              value: "__CI_COMMIT_SHORT_SHA__"

            - name: CI_COMMIT_BRANCH
              value: "__CI_COMMIT_BRANCH__"

            - name: CI_COMMIT_REF_NAME
              value: "__CI_COMMIT_REF_NAME__"

            - name: CI_PROJECT_URL
              value: "__CI_PROJECT_URL__"

            - name: CI_PROJECT_PATH
              value: "__CI_PROJECT_PATH__"

            - name: CI_PIPELINE_ID
              value: "__CI_PIPELINE_ID__"

            - name: CI_PIPELINE_URL
              value: "__CI_PIPELINE_URL__"

            - name: CI_JOB_ID
              value: "__CI_JOB_ID__"

            - name: CI_JOB_NAME
              value: "__CI_JOB_NAME__"

            - name: CI_JOB_URL
              value: "__CI_JOB_URL__"

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi