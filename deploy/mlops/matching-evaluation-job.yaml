apiVersion: batch/v1
kind: Job

metadata:
  name: real-estate-matching-evaluation
  namespace: real-estate

  labels:
    app.kubernetes.io/name: real-estate-matching-evaluation
    app.kubernetes.io/part-of: chasse-immobiliere

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: real-estate-matching-evaluation
        app.kubernetes.io/part-of: chasse-immobiliere

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry-auth

      containers:
        - name: evaluator

          image: __AI_MLOPS_IMAGE__
          imagePullPolicy: IfNotPresent

          env:
            # -----------------------------------------------------------------
            # MLflow
            # -----------------------------------------------------------------

            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"

            - name: MLFLOW_EXPERIMENT_NAME
              value: "real-estate-deterministic-matching"

            # -----------------------------------------------------------------
            # Matching evaluation
            # -----------------------------------------------------------------

            - name: MATCHING_DEMANDE_VERSION_ID
              value: "55"
            # -----------------------------------------------------------------
            # GitLab CI traceability
            #
            # Values are injected by ai-mlops:evaluate before the Job is
            # submitted to Kubernetes.
            # -----------------------------------------------------------------

            - name: CI_COMMIT_SHA
              value: "__CI_COMMIT_SHA__"

            - name: CI_COMMIT_SHORT_SHA
              value: "__CI_COMMIT_SHORT_SHA__"

            - name: CI_COMMIT_BRANCH
              value: "__CI_COMMIT_BRANCH__"

            - name: CI_COMMIT_REF_NAME
              value: "__CI_COMMIT_REF_NAME__"

            - name: CI_PROJECT_URL
              value: "__CI_PROJECT_URL__"

            - name: CI_PROJECT_PATH
              value: "__CI_PROJECT_PATH__"

            - name: CI_PIPELINE_ID
              value: "__CI_PIPELINE_ID__"

            - name: CI_PIPELINE_URL
              value: "__CI_PIPELINE_URL__"

            - name: CI_JOB_ID
              value: "__CI_JOB_ID__"

            - name: CI_JOB_NAME
              value: "__CI_JOB_NAME__"

            - name: CI_JOB_URL
              value: "__CI_JOB_URL__"
            
            # -----------------------------------------------------------------
            # PostgreSQL
            #
            # Values are loaded from the existing Kubernetes Secret.
            # No database credentials are hardcoded in this manifest.
            # -----------------------------------------------------------------

            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"