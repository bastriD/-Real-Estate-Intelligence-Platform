apiVersion: batch/v1
kind: Job

metadata:
  name: real-estate-matching-training-dataset-validation
  namespace: real-estate

  labels:
    app.kubernetes.io/name: real-estate-matching-training-dataset-validation
    app.kubernetes.io/part-of: chasse-immobiliere

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: real-estate-matching-training-dataset-validation
        app.kubernetes.io/part-of: chasse-immobiliere

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry-auth

      containers:
        - name: dataset-validator

          image: __AI_MLOPS_IMAGE__
          imagePullPolicy: IfNotPresent

          # -----------------------------------------------------------------
          # Dataset validation entrypoint
          #
          # The AI/MLOps image has run_evaluation as its default CMD.
          # This Job deliberately overrides it because dataset validation
          # is a separate workload from deterministic ranking evaluation.
          #
          # No model is trained by this Job.
          # -----------------------------------------------------------------

          command:
            - python
            - -m
            - src.ai.matching.run_training_dataset_validation

          env:
            # -----------------------------------------------------------------
            # GitLab CI traceability
            #
            # Values are injected by the dedicated GitLab CI job before
            # this Kubernetes Job is submitted.
            # -----------------------------------------------------------------

            - name: CI_COMMIT_SHA
              value: "__CI_COMMIT_SHA__"

            - name: CI_COMMIT_SHORT_SHA
              value: "__CI_COMMIT_SHORT_SHA__"

            - name: CI_COMMIT_BRANCH
              value: "__CI_COMMIT_BRANCH__"

            - name: CI_COMMIT_REF_NAME
              value: "__CI_COMMIT_REF_NAME__"

            - name: CI_PROJECT_URL
              value: "__CI_PROJECT_URL__"

            - name: CI_PROJECT_PATH
              value: "__CI_PROJECT_PATH__"

            - name: CI_PIPELINE_ID
              value: "__CI_PIPELINE_ID__"

            - name: CI_PIPELINE_URL
              value: "__CI_PIPELINE_URL__"

            - name: CI_JOB_ID
              value: "__CI_JOB_ID__"

            - name: CI_JOB_NAME
              value: "__CI_JOB_NAME__"

            - name: CI_JOB_URL
              value: "__CI_JOB_URL__"

            # -----------------------------------------------------------------
            # PostgreSQL
            #
            # Dataset reconstruction reads the canonical runtime data from
            # PostgreSQL.
            #
            # Credentials and connection information are loaded from the
            # existing Kubernetes Secret. Nothing sensitive is stored here.
            # -----------------------------------------------------------------

            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: real-estate-postgresql-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"