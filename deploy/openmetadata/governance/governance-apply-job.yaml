apiVersion: batch/v1
kind: Job

metadata:
  # GitLab CI replaces the placeholder with the immutable governance image SHA.
  # A unique Job name allows every governance revision to execute without
  # manually deleting the previous Kubernetes Job.
  name: real-estate-governance-apply-__GOVERNANCE_IMAGE_TAG__
  namespace: openmetadata

  labels:
    app: real-estate-governance-apply
    component: governance
    project: real-estate

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: real-estate-governance-apply
        component: governance
        project: real-estate

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry-auth

      containers:
        - name: governance-apply

          # GitLab CI replaces this placeholder with the immutable image SHA.
          image: gitlab.local:4567/root/chasse_immobiliere/real-estate-governance:__GOVERNANCE_IMAGE_TAG__

          # Immutable SHA tags never change after publication.
          imagePullPolicy: IfNotPresent

          env:
            - name: OM_URL
              value: "http://openmetadata:8585/api"

            - name: OM_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: om-admin-token
                  key: jwtToken