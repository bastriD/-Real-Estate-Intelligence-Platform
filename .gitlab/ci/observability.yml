observability:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  script:
    - echo "Validating observability configuration..."

    - test -f deploy/observability/application.yaml
    - test -f deploy/observability/grafana-datasource.yaml.template

    - test -f observability/grafana/dashboards/real-estate-business-platform.json
    - test -f observability/grafana/dashboards/real-estate-data-quality.json

    - |
      python - <<'PY'
      import json
      from pathlib import Path

      dashboards = {
          "observability/grafana/dashboards/real-estate-business-platform.json": {
              "uid": "real-estate-platform",
              "title": "Real Estate — Business KPIs & Platform",
          },
          "observability/grafana/dashboards/real-estate-data-quality.json": {
              "uid": "real-estate-data-quality",
              "title": "Real Estate — Data Quality",
          },
      }

      for path_str, expected in dashboards.items():
          path = Path(path_str)

          with path.open("r", encoding="utf-8") as f:
              dashboard = json.load(f)

          if dashboard.get("uid") != expected["uid"]:
              raise SystemExit(
                  f"{path}: unexpected uid "
                  f"{dashboard.get('uid')!r}, expected {expected['uid']!r}"
              )

          if dashboard.get("title") != expected["title"]:
              raise SystemExit(
                  f"{path}: unexpected title "
                  f"{dashboard.get('title')!r}, expected {expected['title']!r}"
              )

          panels = dashboard.get("panels")

          if not isinstance(panels, list) or not panels:
              raise SystemExit(f"{path}: dashboard has no panels")

          print(
              f"Validated {path}: "
              f"title={dashboard['title']!r}, "
              f"uid={dashboard['uid']!r}, "
              f"panels={len(panels)}"
          )

      print("All Grafana dashboards are valid.")
      PY

    - python -m py_compile observability/metrics/collect_metrics.py
    - python -m py_compile observability/metrics/dq_runner.py
    - python -m py_compile observability/metrics/metrics_exporter.py

    - echo "Observability validation completed successfully."

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml


observability:provision-grafana-datasource:
  stage: deploy

  tags:
    - shell

  needs:
    - observability:validate

  script:
    - set -euo pipefail

    - echo "Provisioning Real Estate PostgreSQL Grafana datasource..."

    - command -v kubectl >/dev/null
    - command -v envsubst >/dev/null

    - test -f deploy/observability/grafana-datasource.yaml.template

    - |
      export POSTGRES_DB="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_DB}' | base64 -d
      )"

      export POSTGRES_HOST="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_HOST}' | base64 -d
      )"

      export POSTGRES_PORT="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_PORT}' | base64 -d
      )"

      export POSTGRES_USER="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_USER}' | base64 -d
      )"

      export POSTGRES_PASSWORD="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
      )"

    - test -n "${POSTGRES_DB}"
    - test -n "${POSTGRES_HOST}"
    - test -n "${POSTGRES_PORT}"
    - test -n "${POSTGRES_USER}"
    - test -n "${POSTGRES_PASSWORD}"

    - |
      envsubst \
        < deploy/observability/grafana-datasource.yaml.template \
        > /tmp/real-estate-grafana-datasource.yaml

    - |
      kubectl -n monitoring create secret generic real-estate-grafana-datasource \
        --from-file=real-estate-postgresql.yaml=/tmp/real-estate-grafana-datasource.yaml \
        --dry-run=client \
        -o yaml \
        | kubectl apply -f -

    - |
      kubectl -n monitoring label secret real-estate-grafana-datasource \
        grafana_datasource=1 \
        --overwrite

    - |
      kubectl -n monitoring get secret real-estate-grafana-datasource \
        -o custom-columns='NAME:.metadata.name,NAMESPACE:.metadata.namespace,GRAFANA_DATASOURCE:.metadata.labels.grafana_datasource'

    - echo "Grafana PostgreSQL datasource provisioning completed."

  after_script:
    - rm -f /tmp/real-estate-grafana-datasource.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml


observability:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - observability:validate

  script:
    - set -euo pipefail

    - echo "Publishing Real Estate observability configuration to GitOps..."

    - command -v git >/dev/null
    - command -v kubectl >/dev/null

    - test -f deploy/observability/application.yaml

    - test -f observability/grafana/dashboards/real-estate-business-platform.json
    - test -f observability/grafana/dashboards/real-estate-data-quality.json

    - export GITOPS_DIR="/tmp/chasse-observability-gitops"
    - export NETRC_FILE="/tmp/chasse-observability-netrc"
    - export DASHBOARD_CONFIGMAP="/tmp/real-estate-grafana-dashboard.yaml"
    - export DASHBOARD_CONFIGMAP_LABELED="/tmp/real-estate-grafana-dashboard-labeled.yaml"
    - export KUSTOMIZATION_FILE="/tmp/real-estate-kustomization.yaml"
    - export RENDERED_FILE="/tmp/real-estate-observability-rendered.yaml"

    - rm -rf "${GITOPS_DIR}"
    - rm -f "${NETRC_FILE}"
    - rm -f "${DASHBOARD_CONFIGMAP}"
    - rm -f "${DASHBOARD_CONFIGMAP_LABELED}"
    - rm -f "${KUSTOMIZATION_FILE}"
    - rm -f "${RENDERED_FILE}"

    - |
      export GITOPS_USERNAME="$(
        kubectl -n openmetadata get secret lab-gitops-git-credentials \
          -o jsonpath='{.data.username}' | base64 -d
      )"

      export GITOPS_PASSWORD="$(
        kubectl -n openmetadata get secret lab-gitops-git-credentials \
          -o jsonpath='{.data.password}' | base64 -d
      )"

    - test -n "${GITOPS_USERNAME}"
    - test -n "${GITOPS_PASSWORD}"

    - |
      cat > "${NETRC_FILE}" <<EOF
      machine gitlab.local
      login ${GITOPS_USERNAME}
      password ${GITOPS_PASSWORD}
      EOF

    - chmod 600 "${NETRC_FILE}"

    - |
      HOME=/tmp \
      NETRC="${NETRC_FILE}" \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        https://gitlab.local/root/lab-gitops.git \
        "${GITOPS_DIR}"

    - |
      kubectl create configmap \
        real-estate-grafana-dashboard \
        --namespace monitoring \
        --from-file=real-estate-platform.json=observability/grafana/dashboards/real-estate-business-platform.json \
        --from-file=real-estate-data-quality.json=observability/grafana/dashboards/real-estate-data-quality.json \
        --dry-run=client \
        -o yaml \
        > "${DASHBOARD_CONFIGMAP}"

    - |
      kubectl label \
        --local \
        -f "${DASHBOARD_CONFIGMAP}" \
        grafana_dashboard=1 \
        --overwrite \
        -o yaml \
        > "${DASHBOARD_CONFIGMAP_LABELED}"

    - |
      cat > "${KUSTOMIZATION_FILE}" <<'EOF'
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization

      resources:
        - grafana-dashboard-configmap.yaml
      EOF

    - mkdir -p "${GITOPS_DIR}/workloads/monitoring/real-estate"
    - mkdir -p "${GITOPS_DIR}/apps/real-estate-observability"

    - |
      cp \
        "${DASHBOARD_CONFIGMAP_LABELED}" \
        "${GITOPS_DIR}/workloads/monitoring/real-estate/grafana-dashboard-configmap.yaml"

    - |
      cp \
        "${KUSTOMIZATION_FILE}" \
        "${GITOPS_DIR}/workloads/monitoring/real-estate/kustomization.yaml"

    - |
      cp \
        deploy/observability/application.yaml \
        "${GITOPS_DIR}/apps/real-estate-observability/application.yaml"

    - cd "${GITOPS_DIR}"

    - echo "Generated observability workload:"
    - find workloads/monitoring/real-estate -maxdepth 2 -type f -print
    - find apps/real-estate-observability -maxdepth 2 -type f -print

    - echo "Generated Grafana dashboard ConfigMap:"
    - cat workloads/monitoring/real-estate/grafana-dashboard-configmap.yaml

    - echo "Generated Kustomization:"
    - cat workloads/monitoring/real-estate/kustomization.yaml

    - |
      kubectl apply \
        --dry-run=client \
        -f workloads/monitoring/real-estate/grafana-dashboard-configmap.yaml \
        >/dev/null

    - |
      kubectl kustomize \
        workloads/monitoring/real-estate \
        > "${RENDERED_FILE}"

    - test -s "${RENDERED_FILE}"

    - echo "Kustomize rendering completed successfully."

    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@lab.local"

    - git add workloads/monitoring/real-estate
    - git add apps/real-estate-observability

    - |
      if git diff --cached --quiet; then
        echo "No observability GitOps changes to publish."
        exit 0
      fi

    - git status --short

    - |
      git commit \
        -m "deploy: publish real-estate observability configuration"

    - |
      HOME=/tmp \
      NETRC="${NETRC_FILE}" \
      GIT_SSL_NO_VERIFY=true \
      git push origin main

    - echo "Real Estate observability GitOps publication completed."

  after_script:
    - rm -f /tmp/chasse-observability-netrc
    - rm -f /tmp/real-estate-grafana-dashboard.yaml
    - rm -f /tmp/real-estate-grafana-dashboard-labeled.yaml
    - rm -f /tmp/real-estate-kustomization.yaml
    - rm -f /tmp/real-estate-observability-rendered.yaml
    - rm -rf /tmp/chasse-observability-gitops

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml