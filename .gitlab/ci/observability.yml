# Job configuration only; implementation lives in scripts/ci/.
observability:validate:
  stage: validate
  tags:
    - docker
  image: python:3.12-slim
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/observability/validate.sh"
  rules:
    - changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - scripts/ci/**/*
        - .gitlab-ci.yml

observability:provision-grafana-datasource:
  resource_group: real-estate-grafana-datasource
  stage: deploy
  tags:
    - shell
  needs:
    - job: observability:validate
    - job: pipeline:validate
      artifacts: false
      optional: true
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/observability/provision-grafana-datasource.sh"
  after_script:
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-grafana-datasource.yaml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - scripts/ci/**/*
        - .gitlab-ci.yml

observability:publish-gitops:
  resource_group: lab-gitops-main
  stage: deploy
  tags:
    - shell
  needs:
    - job: observability:validate
    - job: pipeline:validate
      artifacts: false
      optional: true
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/observability/publish-gitops.sh"
  after_script:
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-grafana-dashboard.yaml
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-grafana-dashboard-labeled.yaml
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-kustomization.yaml
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-observability-rendered.yaml
    - rm -rf ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-observability-gitops
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - scripts/ci/**/*
        - .gitlab-ci.yml
