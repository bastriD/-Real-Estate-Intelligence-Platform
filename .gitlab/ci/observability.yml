observability:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  script:
    - python --version

    # ---------------------------------------------------------
    # Validate deployment manifests
    # ---------------------------------------------------------

    - test -f deploy/observability/application.yaml
    - test -f deploy/observability/grafana-dashboard-configmap.yaml
    - test -f deploy/observability/kustomization.yaml

    # ---------------------------------------------------------
    # Validate embedded Grafana JSON
    # ---------------------------------------------------------

    - |
      python - <<'PY'
      import json
      from pathlib import Path

      path = Path(
          "deploy/observability/grafana-dashboard-configmap.yaml"
      )

      content = path.read_text(encoding="utf-8")

      marker = "real-estate-platform.json: |"

      if marker not in content:
          raise SystemExit(
              "Embedded Grafana JSON block not found"
          )

      raw_json = content.split(marker, 1)[1]
      lines = raw_json.splitlines()

      non_empty = [
          line
          for line in lines
          if line.strip()
      ]

      if not non_empty:
          raise SystemExit(
              "Embedded Grafana JSON is empty"
          )

      min_indent = min(
          len(line) - len(line.lstrip())
          for line in non_empty
      )

      json_text = "\n".join(
          line[min_indent:]
          if line.strip()
          else ""
          for line in lines
      )

      dashboard = json.loads(json_text)

      required = [
          "title",
          "uid",
          "panels",
      ]

      for key in required:
          if key not in dashboard:
              raise SystemExit(
                  f"Missing Grafana dashboard field: {key}"
              )

      print(
          "Grafana dashboard JSON validation passed"
      )

      print(
          f"Title: {dashboard['title']}"
      )

      print(
          f"UID: {dashboard['uid']}"
      )

      print(
          f"Panels: {len(dashboard['panels'])}"
      )
      PY

  rules:
    - changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - .gitlab-ci.yml

observability:provision-grafana-datasource:
  stage: deploy

  tags:
    - shell

  needs:
    - job: observability:validate

  script:
    - "kubectl version --client"
    - "test -f deploy/observability/grafana-datasource.yaml.template"

       # ---------------------------------------------------------
      # Read PostgreSQL Secret and render Grafana datasource
      # ---------------------------------------------------------

    - |
      export POSTGRES_DB="$(
        kubectl -n real-estate get secret \
          real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_DB}' \
        | base64 -d
      )"

      export POSTGRES_HOST="$(
        kubectl -n real-estate get secret \
          real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_HOST}' \
        | base64 -d
      )"

      export POSTGRES_PORT="$(
        kubectl -n real-estate get secret \
          real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_PORT}' \
        | base64 -d
      )"

      export POSTGRES_USER="$(
        kubectl -n real-estate get secret \
          real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_USER}' \
        | base64 -d
      )"

      export POSTGRES_PASSWORD="$(
        kubectl -n real-estate get secret \
          real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_PASSWORD}' \
        | base64 -d
      )"

      test -n "${POSTGRES_DB}"
      test -n "${POSTGRES_HOST}"
      test -n "${POSTGRES_PORT}"
      test -n "${POSTGRES_USER}"
      test -n "${POSTGRES_PASSWORD}"

      python - <<'PY'
      import os
      from pathlib import Path

      src = Path(
          "deploy/observability/grafana-datasource.yaml.template"
      )

      dst = Path(
          "/tmp/real-estate-grafana-datasource.yaml"
      )

      content = src.read_text(encoding="utf-8")

      replacements = {
          "${POSTGRES_DB}": os.environ["POSTGRES_DB"],
          "${POSTGRES_HOST}": os.environ["POSTGRES_HOST"],
          "${POSTGRES_PORT}": os.environ["POSTGRES_PORT"],
          "${POSTGRES_USER}": os.environ["POSTGRES_USER"],
          "${POSTGRES_PASSWORD}": os.environ["POSTGRES_PASSWORD"],
      }

      for old, new in replacements.items():
          content = content.replace(old, new)

      dst.write_text(content, encoding="utf-8")

      print("Grafana datasource template rendered successfully.")
      PY

    # ---------------------------------------------------------
    # Render Grafana datasource provisioning file
    # ---------------------------------------------------------

    - |
      python - <<'PY'
      import os
      from pathlib import Path

      src = Path(
          "deploy/observability/grafana-datasource.yaml.template"
      )

      dst = Path(
          "/tmp/real-estate-grafana-datasource.yaml"
      )

      content = src.read_text(encoding="utf-8")

      replacements = {
          "${POSTGRES_DB}": os.environ["POSTGRES_DB"],
          "${POSTGRES_HOST}": os.environ["POSTGRES_HOST"],
          "${POSTGRES_PORT}": os.environ["POSTGRES_PORT"],
          "${POSTGRES_USER}": os.environ["POSTGRES_USER"],
          "${POSTGRES_PASSWORD}": os.environ["POSTGRES_PASSWORD"],
      }

      for old, new in replacements.items():
          content = content.replace(old, new)

      dst.write_text(content, encoding="utf-8")

      print("Grafana datasource template rendered.")
      PY

    # ---------------------------------------------------------
    # Create/update Kubernetes Secret consumed by Grafana sidecar
    # ---------------------------------------------------------

    - |
      kubectl -n monitoring create secret generic \
        real-estate-grafana-datasource \
        --from-file=datasource.yaml=/tmp/real-estate-grafana-datasource.yaml \
        --dry-run=client \
        -o yaml \
      | kubectl apply -f -

    - |
      kubectl -n monitoring label secret \
        real-estate-grafana-datasource \
        grafana_datasource=1 \
        --overwrite

    # ---------------------------------------------------------
    # Verify without exposing password
    # ---------------------------------------------------------

    - |
      kubectl -n monitoring get secret \
        real-estate-grafana-datasource \
        -o custom-columns='NAME:.metadata.name,LABEL:.metadata.labels.grafana_datasource,TYPE:.type'

  after_script:
    - "rm -f /tmp/real-estate-grafana-datasource.yaml"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - .gitlab-ci.yml



observability:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: observability:validate

  script:
    # ---------------------------------------------------------
    # 1. Validate required tools
    # ---------------------------------------------------------

    - "git --version"
    - "kubectl version --client"

    # ---------------------------------------------------------
    # 2. Validate source manifests
    # ---------------------------------------------------------

    - "test -f deploy/observability/application.yaml"
    - "test -f deploy/observability/grafana-dashboard-configmap.yaml"
    - "test -f deploy/observability/kustomization.yaml"

    # ---------------------------------------------------------
    # 3. Verify GitOps credentials
    # ---------------------------------------------------------

    - |
      kubectl -n openmetadata get secret \
        lab-gitops-git-credentials

    # ---------------------------------------------------------
    # 4. Prepare workspace
    # ---------------------------------------------------------

    - "rm -rf /tmp/chasse-observability-gitops"
    - "rm -f /tmp/.netrc"

    # ---------------------------------------------------------
    # 5. Load GitLab PAT from Kubernetes Secret
    # ---------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' \
        | base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' \
        | base64 -d
      )"

      test -n "${LAB_GITOPS_GIT_USER}"
      test -n "${LAB_GITOPS_GIT_TOKEN}"

      cat > /tmp/.netrc <<EOF
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF

      chmod 600 /tmp/.netrc

    # ---------------------------------------------------------
    # 6. Clone lab-gitops repository
    # ---------------------------------------------------------

    - |
      echo "Cloning lab-gitops repository..."

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        "https://gitlab.local/root/lab-gitops.git" \
        /tmp/chasse-observability-gitops

    # ---------------------------------------------------------
    # 7. Publish Real Estate observability workload
    # ---------------------------------------------------------

    - |
      echo "Publishing Real Estate observability workload..."

      mkdir -p \
        /tmp/chasse-observability-gitops/workloads/monitoring/real-estate

      cp \
        deploy/observability/grafana-dashboard-configmap.yaml \
        /tmp/chasse-observability-gitops/workloads/monitoring/real-estate/grafana-dashboard-configmap.yaml

      cp \
        deploy/observability/kustomization.yaml \
        /tmp/chasse-observability-gitops/workloads/monitoring/real-estate/kustomization.yaml

    # ---------------------------------------------------------
    # 8. Publish Argo CD Application
    # ---------------------------------------------------------

    - |
      echo "Publishing Real Estate observability Argo CD Application..."

      mkdir -p \
        /tmp/chasse-observability-gitops/apps/real-estate-observability

      cp \
        deploy/observability/application.yaml \
        /tmp/chasse-observability-gitops/apps/real-estate-observability/application.yaml

    # ---------------------------------------------------------
    # 9. Enter GitOps repository
    # ---------------------------------------------------------

    - "cd /tmp/chasse-observability-gitops"

    # ---------------------------------------------------------
    # 10. Show resulting GitOps structure
    # ---------------------------------------------------------

    - |
      echo "Real Estate observability workload:"

      find workloads/monitoring/real-estate \
        -maxdepth 2 \
        -type f \
        | sort

    - |
      echo "Real Estate observability Argo Application:"

      find apps/real-estate-observability \
        -maxdepth 2 \
        -type f \
        | sort

    - |
      echo "Real Estate observability kustomization:"

      cat \
        workloads/monitoring/real-estate/kustomization.yaml

    - |
      echo "Real Estate observability Application:"

      cat \
        apps/real-estate-observability/application.yaml

    # ---------------------------------------------------------
    # 11. Configure Git
    # ---------------------------------------------------------

    - 'git config user.name "chasse-immobiliere-ci"'
    - 'git config user.email "gitlab-ci@lab.local"'

    # ---------------------------------------------------------
    # 12. Stage GitOps changes
    # ---------------------------------------------------------

    - |
      git add \
        workloads/monitoring/real-estate \
        apps/real-estate-observability

    - |
      echo "Git status:"
      git status --short

    # ---------------------------------------------------------
    # 13. Skip when nothing changed
    # ---------------------------------------------------------

    - |
      if git diff --cached --quiet; then
        echo "No observability GitOps changes to publish."
        exit 0
      fi

    # ---------------------------------------------------------
    # 14. Commit
    # ---------------------------------------------------------

    - |
      git commit \
        -m "deploy: publish real-estate observability configuration"

    # ---------------------------------------------------------
    # 15. Push GitOps repository
    # ---------------------------------------------------------

    - |
      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git push origin main

  after_script:
    # ---------------------------------------------------------
    # Cleanup credentials and temporary repository
    # ---------------------------------------------------------

    - "rm -f /tmp/.netrc"
    - "rm -rf /tmp/chasse-observability-gitops"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - observability/**/*
        - deploy/observability/**/*
        - .gitlab/ci/observability.yml
        - .gitlab-ci.yml