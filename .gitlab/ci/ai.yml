# Job configuration only; implementation lives in scripts/ci/.
ai:validate:
  stage: validate
  tags:
    - docker
  image: python:3.12-slim
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-ai-mlops.txt
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai/validate.sh"
  artifacts:
    when: always
    reports:
      junit: ai-tests.xml
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - src/**/*
        - tests/ai/**/*
        - requirements-backend.txt
        - requirements-ai.txt
        - requirements-ai-training.txt
        - requirements-ai-mlops.txt
        - deploy/docker/Dockerfile.ai-mlops
        - deploy/mlops/**/*
        - .gitlab/ci/ai*.yml
        - .gitlab/ci/rules.yml
        - .gitlab-ci.yml
        - scripts/ci/ai/**/*
