# Job configuration only; implementation lives in scripts/ci/.
ai-model-comparison:compare:
  resource_group: ai-model-comparison-compare
  extends: .ai-release
  stage: deploy
  tags:
    - shell
  needs:
    - job: ai-mlops:build-image
      artifacts: false
  variables:
    KUBERNETES_NAMESPACE: real-estate
    COMPARISON_JOB_NAME: real-estate-matching-model-comparison
    COMPARISON_MANIFEST: deploy/mlops/matching-model-comparison-job.yaml
    AI_MLOPS_IMAGE: $CI_REGISTRY_IMAGE/ai-mlops:$CI_COMMIT_SHORT_SHA
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
    - kubectl version --client
    - kubectl config current-context
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai-model-comparison/compare.sh"
  after_script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai-model-comparison/compare-after.sh"
