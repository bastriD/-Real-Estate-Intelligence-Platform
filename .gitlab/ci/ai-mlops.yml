# =============================================================================
# REAL ESTATE AI / MLOPS BASELINE EVALUATION
# =============================================================================
#
# PURPOSE
#
#   - Build a dedicated deterministic matching + MLflow runtime image.
#   - Publish the image to GitLab Container Registry.
#   - Trigger an ephemeral Kubernetes Job from GitLab CI.
#   - Evaluate demande_versions against generated project data.
#   - Log metrics, parameters, tags and artifacts to MLflow.
#   - Validate that supervised matching dataset components are packaged
#     correctly inside the same reusable AI / MLOps image.
#
# EXECUTION FLOW
#
#   ai:validate
#        |
#        v
#   ai-mlops:build-image
#        |
#        v
#   GitLab Container Registry
#        |
#        v
#   ai-mlops:evaluate
#        |
#        v
#   shell runner + kubectl
#        |
#        v
#   Kubernetes Job
#   real-estate-matching-evaluation
#        |
#        +--> PostgreSQL real_estate
#        |
#        +--> MLflow Tracking
#        |
#        v
#   Job Complete
#
#
# IMPORTANT
#
# - This is NOT a permanent application workload.
# - No Deployment is required.
# - No Service is required.
# - No Argo CD Application is required.
# - No GitOps publication is required for execution.
# - GitLab CI explicitly triggers the ephemeral Kubernetes Job.
# - The Job uses the immutable commit image tag.
# - The same immutable image also contains the supervised dataset
#   reconstruction and validation code.
# - Model training is NOT performed by this pipeline yet.
#
# =============================================================================


# =============================================================================
# 1. BUILD AND PUBLISH AI / MLOPS IMAGE
# =============================================================================

ai-mlops:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: ai:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/ai-mlops"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    # -------------------------------------------------------------------------
    # Validate Docker runner
    # -------------------------------------------------------------------------

    - docker version

    # -------------------------------------------------------------------------
    # Authenticate against GitLab Container Registry
    # -------------------------------------------------------------------------

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # Validate required dependency and Docker files
    # -------------------------------------------------------------------------

    - test -f requirements-backend.txt
    - test -f requirements-ai.txt
    - test -f requirements-ai-mlops.txt

    - test -f deploy/docker/Dockerfile.ai-mlops

    # -------------------------------------------------------------------------
    # Validate canonical AI matching implementation
    # -------------------------------------------------------------------------

    - test -f src/ai/matching/features.py
    - test -f src/ai/matching/repository.py
    - test -f src/ai/matching/evaluate.py
    - test -f src/ai/matching/mlflow_tracking.py
    - test -f src/ai/matching/run_evaluation.py

    # -------------------------------------------------------------------------
    # Validate supervised matching dataset implementation
    # -------------------------------------------------------------------------

    - test -f src/ai/matching/training_dataset.py
    - test -f src/ai/matching/run_training_dataset_validation.py

    # -------------------------------------------------------------------------
    # Validate Kubernetes Job manifests
    # -------------------------------------------------------------------------

    - test -f deploy/mlops/matching-evaluation-job.yaml

    # -------------------------------------------------------------------------
    # Build dedicated AI / MLOps image
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BUILDING REAL ESTATE AI / MLOPS IMAGE"
      echo "============================================================"

      echo
      echo "Immutable image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker build \
        -f deploy/docker/Dockerfile.ai-mlops \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # Validate Python runtime inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # Validate MLOps dependencies inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "import numpy; import pandas; import psycopg; import mlflow; print('NumPy:', numpy.__version__); print('Pandas:', pandas.__version__); print('psycopg:', psycopg.__version__); print('MLflow:', mlflow.__version__)"

    # -------------------------------------------------------------------------
    # Validate canonical matching modules inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.ai.matching.features import MatchingWeights; from src.ai.matching.repository import load_matching_input; from src.ai.matching.evaluate import evaluate_demande_version; print('Matching modules imported successfully'); print(MatchingWeights())"

    # -------------------------------------------------------------------------
    # Validate supervised training dataset module inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.ai.matching.training_dataset import build_training_dataset, build_training_group, dataset_summary; print('Training dataset module imported successfully')"

    # -------------------------------------------------------------------------
    # Validate MLflow tracking module inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.ai.matching.mlflow_tracking import configure_mlflow, log_deterministic_evaluation; print('MLflow tracking module imported successfully')"

    # -------------------------------------------------------------------------
    # Validate deterministic evaluation entrypoint inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "import src.ai.matching.run_evaluation; print('run_evaluation module imported successfully')"

    # -------------------------------------------------------------------------
    # Validate training dataset validation entrypoint inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "import src.ai.matching.run_training_dataset_validation; print('run_training_dataset_validation module imported successfully')"

    # -------------------------------------------------------------------------
    # Push immutable image
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Publishing immutable AI / MLOps image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # Push latest convenience tag
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    # -------------------------------------------------------------------------
    # Build summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS IMAGE PUBLISHED"
      echo "============================================================"

      echo
      echo "Immutable image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      echo
      echo "Latest image:"
      echo "$IMAGE_NAME:latest"

      echo
      echo "Runtime capabilities:"
      echo "- deterministic matching evaluation"
      echo "- MLflow tracking"
      echo "- supervised dataset reconstruction"
      echo "- supervised dataset validation"

      echo
      echo "Model training:"
      echo "NOT performed"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/ai/**/*
        - tests/ai/**/*
        - requirements-ai.txt
        - requirements-ai-mlops.txt
        - deploy/docker/Dockerfile.ai-mlops
        - deploy/mlops/**/*
        - .gitlab/ci/ai.yml
        - .gitlab/ci/ai-mlops.yml
        - .gitlab-ci.yml


# =============================================================================
# 2. EXECUTE DETERMINISTIC MATCHING EVALUATION IN KUBERNETES
# =============================================================================

ai-mlops:evaluate:
  stage: deploy

  tags:
    - shell

  needs:
    - job: ai-mlops:build-image
      artifacts: false

  variables:
    K8S_NAMESPACE: "real-estate"

    MATCHING_EVALUATION_JOB_NAME: "real-estate-matching-evaluation"

    MATCHING_EVALUATION_SOURCE_PATH: "$CI_PROJECT_DIR/deploy/mlops/matching-evaluation-job.yaml"

    MATCHING_EVALUATION_RENDERED_PATH: "/tmp/real-estate-matching-evaluation.yaml"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/ai-mlops"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

    POSTGRES_SECRET: "real-estate-postgresql-secret"

    MLFLOW_NAMESPACE: "mlflow"
    MLFLOW_SERVICE: "mlflow-tracking"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate shell runner tooling
    # -------------------------------------------------------------------------

    - kubectl version --client

    # -------------------------------------------------------------------------
    # 2. Validate required source manifest
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS KUBERNETES SOURCE VALIDATION"
      echo "============================================================"

      echo
      echo "Job source:"
      echo "$MATCHING_EVALUATION_SOURCE_PATH"

      test -f "$MATCHING_EVALUATION_SOURCE_PATH"

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes namespace
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        "$K8S_NAMESPACE"

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$POSTGRES_SECRET"

    # -------------------------------------------------------------------------
    # 5. Validate Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$REGISTRY_PULL_SECRET"

    # -------------------------------------------------------------------------
    # 6. Validate MLflow namespace and service
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        "$MLFLOW_NAMESPACE"

    - |
      kubectl \
        -n "$MLFLOW_NAMESPACE" \
        get service \
        "$MLFLOW_SERVICE"

    # -------------------------------------------------------------------------
    # 7. Clean previous temporary rendered manifest
    # -------------------------------------------------------------------------

    - rm -f "$MATCHING_EVALUATION_RENDERED_PATH"

    # -------------------------------------------------------------------------
    # 8. Render immutable image and CI traceability into Kubernetes Job
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "RENDERING AI / MLOPS EVALUATION JOB"
      echo "============================================================"

      EXPECTED_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

      echo
      echo "Expected image:"
      echo "$EXPECTED_IMAGE"

      echo
      echo "Expected Kubernetes Job:"
      echo "$MATCHING_EVALUATION_JOB_NAME"

      grep \
        "__AI_MLOPS_IMAGE__" \
        "$MATCHING_EVALUATION_SOURCE_PATH"

      sed \
        -e "s|__AI_MLOPS_IMAGE__|${EXPECTED_IMAGE}|g" \
        -e "s|__CI_COMMIT_SHA__|${CI_COMMIT_SHA}|g" \
        -e "s|__CI_COMMIT_SHORT_SHA__|${CI_COMMIT_SHORT_SHA}|g" \
        -e "s|__CI_COMMIT_BRANCH__|${CI_COMMIT_BRANCH}|g" \
        -e "s|__CI_COMMIT_REF_NAME__|${CI_COMMIT_REF_NAME}|g" \
        -e "s|__CI_PROJECT_URL__|${CI_PROJECT_URL}|g" \
        -e "s|__CI_PROJECT_PATH__|${CI_PROJECT_PATH}|g" \
        -e "s|__CI_PIPELINE_ID__|${CI_PIPELINE_ID}|g" \
        -e "s|__CI_PIPELINE_URL__|${CI_PIPELINE_URL}|g" \
        -e "s|__CI_JOB_ID__|${CI_JOB_ID}|g" \
        -e "s|__CI_JOB_NAME__|${CI_JOB_NAME}|g" \
        -e "s|__CI_JOB_URL__|${CI_JOB_URL}|g" \
        "$MATCHING_EVALUATION_SOURCE_PATH" \
        > "$MATCHING_EVALUATION_RENDERED_PATH"

      test -s \
        "$MATCHING_EVALUATION_RENDERED_PATH"

    # -------------------------------------------------------------------------
    # 9. Verify all rendering placeholders disappeared
    # -------------------------------------------------------------------------

    - |
      if grep -E -q \
        "__AI_MLOPS_IMAGE__|__CI_[A-Z0-9_]+__" \
        "$MATCHING_EVALUATION_RENDERED_PATH"; then

        echo
        echo "ERROR:"
        echo "Unresolved placeholder remains in rendered Kubernetes Job:"
        echo

        grep -E \
          "__AI_MLOPS_IMAGE__|__CI_[A-Z0-9_]+__" \
          "$MATCHING_EVALUATION_RENDERED_PATH" || true

        exit 1

      fi

      echo "All Kubernetes Job placeholders replaced successfully."

    # -------------------------------------------------------------------------
    # 10. Validate immutable image reference
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

      echo
      echo "Validating rendered immutable image..."

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "$MATCHING_EVALUATION_RENDERED_PATH"

      echo "Immutable image validated successfully."

    # -------------------------------------------------------------------------
    # 11. Validate expected Kubernetes Job name
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Expected Kubernetes Job:"
      echo "$MATCHING_EVALUATION_JOB_NAME"

      echo
      echo "Rendered Kubernetes names:"
      grep \
        "name:" \
        "$MATCHING_EVALUATION_RENDERED_PATH" || true

      grep \
        "name: ${MATCHING_EVALUATION_JOB_NAME}" \
        "$MATCHING_EVALUATION_RENDERED_PATH"

      echo "Kubernetes Job name validated successfully."

    # -------------------------------------------------------------------------
    # 12. Validate expected Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Validating Registry pull Secret reference..."

      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$MATCHING_EVALUATION_RENDERED_PATH"

      echo "Registry pull Secret reference validated successfully."

    # -------------------------------------------------------------------------
    # 13. Client-side Kubernetes validation
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$MATCHING_EVALUATION_RENDERED_PATH" \
        > /dev/null

      echo
      echo "Kubernetes Job manifest validation successful."

    # -------------------------------------------------------------------------
    # 14. Remove previous evaluation Job
    #
    # Kubernetes Jobs contain immutable pod-template fields.
    # The previous execution is removed before the new immutable image
    # execution is created.
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CLEANING PREVIOUS AI / MLOPS EVALUATION"
      echo "============================================================"

      kubectl \
        -n "$K8S_NAMESPACE" \
        delete job \
        "$MATCHING_EVALUATION_JOB_NAME" \
        --ignore-not-found=true \
        --wait=true

    # -------------------------------------------------------------------------
    # 15. Create new evaluation Job
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CREATING AI / MLOPS EVALUATION JOB"
      echo "============================================================"

      kubectl \
        -n "$K8S_NAMESPACE" \
        apply \
        -f "$MATCHING_EVALUATION_RENDERED_PATH"

    # -------------------------------------------------------------------------
    # 16. Display created Job
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n "$K8S_NAMESPACE" \
        get job \
        "$MATCHING_EVALUATION_JOB_NAME" \
        -o wide

    # -------------------------------------------------------------------------
    # 17. Wait for Pod creation
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Waiting for evaluation Pod..."

      POD_NAME=""

      for i in $(seq 1 60); do

        POD_NAME="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get pods \
            -l app.kubernetes.io/name="$MATCHING_EVALUATION_JOB_NAME" \
            -o jsonpath='{.items[0].metadata.name}' \
            2>/dev/null || true
        )"

        if [ -n "$POD_NAME" ]; then
          echo "Evaluation Pod:"
          echo "$POD_NAME"
          break
        fi

        sleep 2

      done

      if [ -z "${POD_NAME:-}" ]; then
        echo
        echo "ERROR:"
        echo "Evaluation Pod was not created."

        kubectl \
          -n "$K8S_NAMESPACE" \
          get job \
          "$MATCHING_EVALUATION_JOB_NAME" \
          -o wide || true

        exit 1
      fi

    # -------------------------------------------------------------------------
    # 18. Wait for Job completion
    #
    # The loop explicitly detects both success and failure.
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "WAITING FOR AI / MLOPS EVALUATION"
      echo "============================================================"

      SUCCESS="false"

      for i in $(seq 1 150); do

        COMPLETE="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get job \
            "$MATCHING_EVALUATION_JOB_NAME" \
            -o jsonpath='{.status.succeeded}' \
            2>/dev/null || true
        )"

        FAILED="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get job \
            "$MATCHING_EVALUATION_JOB_NAME" \
            -o jsonpath='{.status.failed}' \
            2>/dev/null || true
        )"

        if [ "${COMPLETE:-0}" -ge 1 ] 2>/dev/null; then
          SUCCESS="true"
          echo "Evaluation Job completed successfully."
          break
        fi

        if [ "${FAILED:-0}" -ge 1 ] 2>/dev/null; then
          echo "Evaluation Job reported a failed Pod."
          break
        fi

        echo "Evaluation still running..."
        sleep 2

      done

      if [ "$SUCCESS" != "true" ]; then

        echo
        echo "ERROR:"
        echo "AI / MLOps evaluation did not complete successfully."

        echo
        echo "Job status:"
        kubectl \
          -n "$K8S_NAMESPACE" \
          get job \
          "$MATCHING_EVALUATION_JOB_NAME" \
          -o wide || true

        echo
        echo "Pod status:"
        kubectl \
          -n "$K8S_NAMESPACE" \
          get pods \
          -l app.kubernetes.io/name="$MATCHING_EVALUATION_JOB_NAME" \
          -o wide || true

        echo
        echo "Evaluation logs:"
        kubectl \
          -n "$K8S_NAMESPACE" \
          logs \
          job/"$MATCHING_EVALUATION_JOB_NAME" \
          --all-containers=true || true

        exit 1

      fi

    # -------------------------------------------------------------------------
    # 19. Print successful evaluation logs
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS EVALUATION LOGS"
      echo "============================================================"

      kubectl \
        -n "$K8S_NAMESPACE" \
        logs \
        job/"$MATCHING_EVALUATION_JOB_NAME" \
        --all-containers=true

    # -------------------------------------------------------------------------
    # 20. Display final Job status
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS FINAL KUBERNETES STATUS"
      echo "============================================================"

      kubectl \
        -n "$K8S_NAMESPACE" \
        get job \
        "$MATCHING_EVALUATION_JOB_NAME" \
        -o wide

      kubectl \
        -n "$K8S_NAMESPACE" \
        get pods \
        -l app.kubernetes.io/name="$MATCHING_EVALUATION_JOB_NAME" \
        -o wide

    # -------------------------------------------------------------------------
    # 21. Final execution summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS EVALUATION COMPLETED"
      echo "============================================================"

      echo
      echo "Image:"
      echo "${IMAGE_NAME}:${IMAGE_TAG}"

      echo
      echo "Namespace:"
      echo "$K8S_NAMESPACE"

      echo
      echo "Kubernetes Job:"
      echo "$MATCHING_EVALUATION_JOB_NAME"

      echo
      echo "MLflow:"
      echo "http://mlflow-tracking.mlflow.svc.cluster.local:5000"

      echo
      echo "Execution type:"
      echo "GitLab-triggered ephemeral Kubernetes Job"

      echo
      echo "Deployment:"
      echo "None"

      echo
      echo "Service:"
      echo "None"

      echo
      echo "Argo CD:"
      echo "Not used for this execution workload"

  after_script:
    # -------------------------------------------------------------------------
    # Preserve useful diagnostics in GitLab logs.
    #
    # Completed Kubernetes Job is intentionally retained temporarily
    # as runtime/certification evidence.
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "AI / MLOPS AFTER-SCRIPT DIAGNOSTICS"
      echo "============================================================"

      kubectl \
        -n real-estate \
        get job \
        real-estate-matching-evaluation \
        -o wide || true

      kubectl \
        -n real-estate \
        get pods \
        -l app.kubernetes.io/name=real-estate-matching-evaluation \
        -o wide || true

    - rm -f /tmp/real-estate-matching-evaluation.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/ai/**/*
        - tests/ai/**/*
        - requirements-ai.txt
        - requirements-ai-mlops.txt
        - deploy/docker/Dockerfile.ai-mlops
        - deploy/mlops/**/*
        - .gitlab/ci/ai.yml
        - .gitlab/ci/ai-mlops.yml
        - .gitlab-ci.yml