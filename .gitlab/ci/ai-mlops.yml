# Job configuration only; implementation lives in scripts/ci/.
ai-mlops:build-image:
  resource_group: ai-mlops-build-image
  extends: .ai-release
  stage: build
  tags:
    - docker
  needs:
    - job: ai:validate
      artifacts: false
    - job: pipeline:validate
      artifacts: false
      optional: true
  image: docker:27.5.1
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    IMAGE_NAME: $CI_REGISTRY_IMAGE/ai-mlops
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - docker version
    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai-mlops/build-image.sh"

ai-mlops:evaluate:
  resource_group: ai-mlops-evaluate
  extends: .ai-release
  stage: deploy
  tags:
    - shell
  needs:
    - job: ai-mlops:build-image
      artifacts: false
  variables:
    K8S_NAMESPACE: real-estate
    MATCHING_EVALUATION_JOB_NAME: real-estate-matching-evaluation
    MATCHING_EVALUATION_SOURCE_PATH: $CI_PROJECT_DIR/deploy/mlops/matching-evaluation-job.yaml
    MATCHING_EVALUATION_RENDERED_PATH: ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-matching-evaluation.yaml
    IMAGE_NAME: $CI_REGISTRY_IMAGE/ai-mlops
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    REGISTRY_PULL_SECRET: gitlab-registry-auth
    POSTGRES_SECRET: real-estate-postgresql-secret
    MLFLOW_NAMESPACE: mlflow
    MLFLOW_SERVICE: mlflow-tracking
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai-mlops/evaluate.sh"
  after_script:
    - . "$CI_PROJECT_DIR/scripts/ci/ai-mlops/evaluate-after.sh"

