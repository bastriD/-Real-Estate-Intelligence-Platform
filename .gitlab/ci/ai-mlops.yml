    DATASET_VALIDATION_RENDERED_PATH: ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-matching-training-dataset-validation.yaml
    IMAGE_NAME: $CI_REGISTRY_IMAGE/ai-mlops
