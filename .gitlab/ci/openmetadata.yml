# Job configuration only; implementation lives in scripts/ci/.
openmetadata:publish-gitops:
  resource_group: lab-gitops-main
  extends: .governance-release
  stage: deploy
  tags:
    - shell
  needs:
    - job: database:validate
      artifacts: false
    - job: governance:build-image
      artifacts: true
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/openmetadata/publish-gitops.sh"
  after_script:
    - rm -rf ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-lab-gitops
