    - database:validate

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/oltp/004_staging_schema.sql

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false