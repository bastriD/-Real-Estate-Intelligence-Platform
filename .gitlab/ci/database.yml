database:validate:
  stage: validate
  tags:
    - docker
  image: postgres:16

  script:
    - test -f database/migrations/001_initial_schema.sql
    - test -f database/migrations/002_migrate_legacy_data.sql
    - test -f database/tests/001_schema_structure.sql
    - test -f database/tests/002_legacy_migration.sql
    - test -f database/tests/003_oltp_constraints.sql
    - test -f database/legacy/PgSQL.sql
    - test -f database/oltp/001_operational_queries.sql
    - test -f database/oltp/002_explain_analyze.sql

    - grep -q "CREATE SCHEMA IF NOT EXISTS real_estate;" database/migrations/001_initial_schema.sql
    - grep -q "CREATE TABLE real_estate.client" database/migrations/001_initial_schema.sql
    - grep -q "CREATE TABLE real_estate.paiement" database/migrations/001_initial_schema.sql

    - grep -q "CREATE SCHEMA IF NOT EXISTS migration_control;" database/migrations/002_migrate_legacy_data.sql
    - grep -q "Migration 002" database/migrations/002_migrate_legacy_data.sql

    - grep -q '^DROP SCHEMA IF EXISTS "Fil_Rouge_Depart" CASCADE;' database/legacy/PgSQL.sql
    - grep -q "^COMMIT;" database/migrations/001_initial_schema.sql
    - grep -q "^COMMIT;" database/migrations/002_migrate_legacy_data.sql
    - grep -q "OLTP constraints enforced successfully" database/tests/003_oltp_constraints.sql
    - grep -q "Current workload by chasseur" database/oltp/001_operational_queries.sql
    - grep -q "EXPLAIN (" database/oltp/002_explain_analyze.sql
  rules:
    - changes:
        - database/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/database.yml


database:migrate-001:
  stage: database
  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl version --client
    - kubectl get namespace real-estate
    - kubectl -n real-estate get deploy real-estate-postgresql

    - |
      ALREADY_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN to_regclass('real_estate.client') IS NOT NULL
               THEN 'yes'
               ELSE 'no'
             END;"
      )"

      if [ "$ALREADY_APPLIED" = "yes" ]; then
        echo "Migration 001 already applied - skipping safely."
        exit 0
      fi

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/001_initial_schema.sql

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


database:load-legacy:
  stage: database
  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql

    - |
      LEGACY_EXISTS="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM information_schema.schemata
                 WHERE schema_name = 'Fil_Rouge_Depart'
               )
               THEN 'yes'
               ELSE 'no'
             END;"
      )"

      if [ "$LEGACY_EXISTS" = "yes" ]; then
        echo "Legacy schema Fil_Rouge_Depart already exists - skipping import."
        exit 0
      fi

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/legacy/PgSQL.sql

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


database:migrate-002:
  stage: database
  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql

    - |
      MIGRATION_002_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '002'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_002_APPLIED" = "yes" ]; then
        echo "Migration 002 already applied - skipping safely."
        exit 0
      fi

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/002_migrate_legacy_data.sql

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


