        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify migration registry
    # -------------------------------------------------------------------------

    - |
      echo "Verifying migration registry..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '006';
          "

    # -------------------------------------------------------------------------
    # Final state
    # -------------------------------------------------------------------------

    - |
      echo "============================================================"
      echo "MIGRATION 006 SUCCESSFULLY APPLIED"
      echo "============================================================"

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
