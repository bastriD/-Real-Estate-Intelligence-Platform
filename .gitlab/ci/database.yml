# =============================================================================
# MIGRATION 004 - VISITE + AUDIT LOG
# =============================================================================

database:migrate-004:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql

    # -------------------------------------------------------------------------
    # Check migration registry
    # -------------------------------------------------------------------------

    - |
      MIGRATION_004_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '004'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_004_APPLIED" = "yes" ]; then
        echo "Migration 004 already applied - skipping safely."
        exit 0
      fi

    # -------------------------------------------------------------------------
    # Apply migration
    #
    # The migration is idempotent:
    #   CREATE TABLE IF NOT EXISTS
    #   CREATE INDEX IF NOT EXISTS
    #
    # This also repairs an installation where visite/audit_log exist
    # physically but migration version 004 is not yet registered.
    # -------------------------------------------------------------------------

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/004_add_visite_audit.sql

    # -------------------------------------------------------------------------
    # Verify physical objects
    # -------------------------------------------------------------------------

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.visite') AS visite,
              to_regclass('real_estate.audit_log') AS audit_log;
          "

    # -------------------------------------------------------------------------
    # Verify migration registry
    # -------------------------------------------------------------------------

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '004';
          "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


