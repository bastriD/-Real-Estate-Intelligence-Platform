# =============================================================================
# LOAD GENERATED RAW DATA
# =============================================================================

database:load-raw-generated:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  before_script:
    - python3 --version
    - python3 -m pip install --user -r requirements.txt

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql
    - kubectl -n real-estate get secret real-estate-postgresql-secret

    - |
      export POSTGRES_DB="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_DB}' | base64 -d
      )"

      export POSTGRES_USER="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_USER}' | base64 -d
      )"

      export POSTGRES_PASSWORD="$(
        kubectl -n real-estate get secret real-estate-postgresql-secret \
          -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
      )"

      export POSTGRES_HOST="127.0.0.1"
      export POSTGRES_PORT="15432"
      export INGESTION_BATCH="generated-1000-v1"

      kubectl -n real-estate port-forward \
        service/real-estate-postgresql \
        15432:5432 \
        > /tmp/real-estate-postgresql-port-forward.log 2>&1 &

      PORT_FORWARD_PID=$!

      cleanup() {
        kill "$PORT_FORWARD_PID" 2>/dev/null || true
      }

      trap cleanup EXIT

      for i in $(seq 1 20); do
        if python3 -c "
      import socket
      s = socket.socket()
      s.settimeout(1)
      s.connect(('127.0.0.1', 15432))
      s.close()
      " 2>/dev/null; then
          echo "PostgreSQL tunnel ready."
          break
        fi

        if [ "$i" -eq 20 ]; then
          echo "ERROR: PostgreSQL port-forward did not become ready."
          cat /tmp/real-estate-postgresql-port-forward.log
          exit 1
        fi

        sleep 1
      done

      python3 database/seeds/load_raw_generated_data.py

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


