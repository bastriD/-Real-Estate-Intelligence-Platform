      allow_failure: false


# =============================================================================
# MIGRATION 004 - VISITE + AUDIT LOG
# =============================================================================

database:migrate-004:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl -n real-estate get deploy real-estate-postgresql

    - |
      MIGRATION_004_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '004'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_004_APPLIED" = "yes" ]; then
        echo "Migration 004 already applied - skipping safely."
        exit 0
      fi

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/004_add_visite_audit.sql

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.visite') AS visite,
              to_regclass('real_estate.audit_log') AS audit_log;
          "

    - |
      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '004';
          "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


# =============================================================================
# MIGRATION 005 - PRE-MANDATE DEMANDES
#
# Official business chronology:
#
#   DEMANDE
#      -> hunter assignment / acceptance
#      -> initial matching
#      -> meeting / criteria refinement
#      -> MANDAT
#
# Therefore a DEMANDE must be allowed to exist without an attached mandate.
# This migration also introduces lineage between generated searches and
# DEMANDE_VERSION.
# =============================================================================

database:migrate-005:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl version --client
    - kubectl -n real-estate get deploy real-estate-postgresql

    # -------------------------------------------------------------------------
    # Migration prerequisites
    # -------------------------------------------------------------------------

    - |
      echo "Checking migration 005 prerequisites..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.demande') AS demande,
              to_regclass('real_estate.demande_version') AS demande_version,
              to_regclass('migration_control.schema_version') AS schema_version;
          "

    # -------------------------------------------------------------------------
    # Check migration registry
    # -------------------------------------------------------------------------

    - |
      MIGRATION_005_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '005'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_005_APPLIED" = "yes" ]; then
        echo "Migration 005 already applied - skipping safely."
        exit 0
      fi

    # -------------------------------------------------------------------------
    # Apply migration
    # -------------------------------------------------------------------------

    - |
      echo "Applying migration 005..."

      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/005_demande_pre_mandat.sql

    # -------------------------------------------------------------------------
    # Verify demande.id_mandat is nullable
    # -------------------------------------------------------------------------

    - |
      echo "Verifying pre-mandate DEMANDE support..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              table_schema,
              table_name,
              column_name,
              is_nullable
            FROM information_schema.columns
            WHERE table_schema = 'real_estate'
              AND table_name = 'demande'
              AND column_name = 'id_mandat';
          "

    # -------------------------------------------------------------------------
    # Verify new columns
    # -------------------------------------------------------------------------

    - |
      echo "Verifying migration 005 columns..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              table_name,
              column_name,
              data_type,
              is_nullable
            FROM information_schema.columns
            WHERE table_schema = 'real_estate'
              AND (
                (
                  table_name = 'demande'
                  AND column_name = 'origine'
                )
                OR
                (
                  table_name = 'demande_version'
                  AND column_name IN (
                    'source_recherche_ref',
                    'ingestion_batch'
                  )
                )
              )
            ORDER BY table_name, column_name;
          "

    # -------------------------------------------------------------------------
    # Verify legacy integrity
    # -------------------------------------------------------------------------

    - |
      echo "Checking legacy demande integrity..."

      LEGACY_WITHOUT_MANDATE="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT COUNT(*)
             FROM real_estate.demande
             WHERE origine = 'LEGACY'
               AND id_mandat IS NULL;"
      )"

      echo "Legacy demandes without mandate: ${LEGACY_WITHOUT_MANDATE}"

      if [ "${LEGACY_WITHOUT_MANDATE}" != "0" ]; then
        echo "ERROR: legacy demandes lost their mandate relationship."
        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify migration registry
    # -------------------------------------------------------------------------

    - |
      echo "Verifying migration registry..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '005';
          "

    # -------------------------------------------------------------------------
    # Final schema state
    # -------------------------------------------------------------------------

    - |
      echo "============================================================"
      echo "MIGRATION 005 SUCCESSFULLY APPLIED"
      echo "============================================================"

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              COUNT(*) AS demandes_total,
              COUNT(*) FILTER (
                WHERE origine = 'LEGACY'
              ) AS legacy_demandes,
              COUNT(*) FILTER (
                WHERE origine = 'GENERATED'
              ) AS generated_demandes,
              COUNT(*) FILTER (
                WHERE id_mandat IS NULL
              ) AS pre_mandate_demandes
            FROM real_estate.demande;
          "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


# =============================================================================
# MIGRATION 006 - AUTHENTICATION IDENTITY
#
# Adds a dedicated authentication identity model.
#
# Important:
#   - existing client/chasseur business tables remain unchanged;
#   - no default credentials are created;
#   - API behavior remains unchanged;
#   - JWT/authentication is NOT enabled by this migration;
#   - migration remains manually triggered.
# =============================================================================

database:migrate-006:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl version --client
    - kubectl -n real-estate get deploy real-estate-postgresql

    # -------------------------------------------------------------------------
    # Migration prerequisites
    # -------------------------------------------------------------------------

    - |
      echo "Checking migration 006 prerequisites..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.client') AS client,
              to_regclass('real_estate.chasseur') AS chasseur,
              to_regclass('migration_control.schema_version') AS schema_version;
          "

    # -------------------------------------------------------------------------
    # Check migration registry
    # -------------------------------------------------------------------------

    - |
      MIGRATION_006_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '006'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_006_APPLIED" = "yes" ]; then
        echo "Migration 006 already applied - skipping safely."
        exit 0
      fi

    # -------------------------------------------------------------------------
    # Apply migration
    # -------------------------------------------------------------------------

    - |
      echo "Applying migration 006..."

      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/006_auth_identity.sql

    # -------------------------------------------------------------------------
    # Verify utilisateur table
    # -------------------------------------------------------------------------

    - |
      echo "Verifying authentication identity table..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.utilisateur') AS utilisateur;
