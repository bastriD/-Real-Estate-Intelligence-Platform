      allow_failure: false


# =============================================================================
# MIGRATION 007 - DEMANDE / CHASSEUR ASSIGNMENT
#
# Persists the hunter assignment / acceptance lifecycle required between:
#
#   DEMANDE
#      -> hunter assignment
#      -> hunter acceptance / refusal
#      -> matching / refinement
#      -> MANDAT
#
# Historical legacy demandes already linked to a mandate are backfilled with
# one accepted assignment derived from MANDAT.id_chasseur.
#
# This migration remains manually triggered.
# =============================================================================

database:migrate-007:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl version --client
    - kubectl -n real-estate get deploy real-estate-postgresql

    # -------------------------------------------------------------------------
    # Migration prerequisites
    # -------------------------------------------------------------------------

    - |
      echo "Checking migration 007 prerequisites..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.demande') AS demande,
              to_regclass('real_estate.chasseur') AS chasseur,
              to_regclass('real_estate.utilisateur') AS utilisateur,
              to_regclass('migration_control.schema_version') AS schema_version;
          "

    # -------------------------------------------------------------------------
    # Check migration registry
    # -------------------------------------------------------------------------

    - |
      MIGRATION_007_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '007'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_007_APPLIED" = "yes" ]; then
        echo "Migration 007 already applied - skipping safely."
        exit 0
      fi

    # -------------------------------------------------------------------------
    # Apply migration
    # -------------------------------------------------------------------------

    - |
      echo "Applying migration 007..."

      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/007_demande_chasseur_affectation.sql

    # -------------------------------------------------------------------------
    # Verify table and current-state index
    # -------------------------------------------------------------------------

    - |
      echo "Verifying demande assignment schema..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.demande_affectation') AS demande_affectation,
              to_regclass('real_estate.uq_demande_affectation_current') AS current_assignment_index;
          "

    # -------------------------------------------------------------------------
    # Verify legacy backfill
    # -------------------------------------------------------------------------

    - |
      echo "Checking legacy assignment reconciliation..."

      LEGACY_MISMATCH_COUNT="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT COUNT(*)
             FROM real_estate.demande d
             LEFT JOIN real_estate.demande_affectation da
               ON da.id_demande = d.id_demande
              AND da.statut = 'ACCEPTEE'
             LEFT JOIN real_estate.mandat m
               ON m.id_mandat = d.id_mandat
             WHERE d.origine = 'LEGACY'
               AND (
                 da.id_affectation IS NULL
                 OR da.id_chasseur <> m.id_chasseur
               );"
      )"

      echo "Legacy assignment mismatches: ${LEGACY_MISMATCH_COUNT}"

      if [ "${LEGACY_MISMATCH_COUNT}" != "0" ]; then
        echo "ERROR: legacy assignment reconciliation failed."
        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify current-state uniqueness
    # -------------------------------------------------------------------------

    - |
      echo "Checking current assignment uniqueness..."

      CURRENT_DUPLICATES="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT COUNT(*)
             FROM (
               SELECT id_demande
               FROM real_estate.demande_affectation
               WHERE statut IN ('ASSIGNEE', 'ACCEPTEE')
               GROUP BY id_demande
               HAVING COUNT(*) > 1
             ) duplicate_rows;"
      )"

      echo "Demandes with multiple current assignments: ${CURRENT_DUPLICATES}"

      if [ "${CURRENT_DUPLICATES}" != "0" ]; then
        echo "ERROR: multiple current assignments detected."
        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify migration registry and final state
    # -------------------------------------------------------------------------

    - |
      echo "Verifying migration registry..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '007';

            SELECT
              statut,
              COUNT(*) AS affectations
            FROM real_estate.demande_affectation
            GROUP BY statut
            ORDER BY statut;
          "

    - |
      echo "============================================================"
      echo "MIGRATION 007 SUCCESSFULLY APPLIED"
      echo "============================================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


# =============================================================================
# MIGRATION 008 - MANDAT CONTRACTUAL LIFECYCLE
#
# Adds contractual period history for Mandats:
#
#   MANDAT
#      -> INITIAL
#      -> RENOUVELLEMENT
#      -> RENOUVELLEMENT
#
# Existing Mandat dates are backfilled as legacy historical periods without
# rewriting historical business facts. New periods are constrained to six
# calendar months.
#
# This migration remains manually triggered.
# =============================================================================

database:migrate-008:
  stage: database

  tags:
    - shell

  needs:
    - database:validate

  script:
    - kubectl version --client
    - kubectl -n real-estate get deploy real-estate-postgresql

    # -------------------------------------------------------------------------
    # Migration prerequisites
    # -------------------------------------------------------------------------

    - |
      echo "Checking migration 008 prerequisites..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.mandat') AS mandat,
              to_regclass('migration_control.schema_version') AS schema_version;
          "

    # -------------------------------------------------------------------------
    # Check migration registry
    # -------------------------------------------------------------------------

    - |
      MIGRATION_008_APPLIED="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT CASE
               WHEN EXISTS (
                 SELECT 1
                 FROM migration_control.schema_version
                 WHERE version = '008'
               )
               THEN 'yes'
               ELSE 'no'
             END;" 2>/dev/null || true
      )"

      if [ "$MIGRATION_008_APPLIED" = "yes" ]; then
        echo "Migration 008 already applied - skipping safely."
        exit 0
      fi

    # -------------------------------------------------------------------------
    # Apply migration
    # -------------------------------------------------------------------------

    - |
      echo "Applying migration 008..."

      kubectl -n real-estate exec deploy/real-estate-postgresql \
        -i -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          < database/migrations/008_mandat_lifecycle.sql

    # -------------------------------------------------------------------------
    # Verify table and lifecycle objects
    # -------------------------------------------------------------------------

    - |
      echo "Verifying Mandat lifecycle schema..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              to_regclass('real_estate.mandat_periode') AS mandat_periode,
              to_regclass('real_estate.uq_mandat_periode_initial') AS initial_period_index;

            SELECT
              tgname AS trigger_name
            FROM pg_trigger
            WHERE tgrelid = 'real_estate.mandat_periode'::regclass
              AND NOT tgisinternal
            ORDER BY tgname;
          "

    # -------------------------------------------------------------------------
    # Verify historical backfill
    # -------------------------------------------------------------------------

    - |
      echo "Checking Mandat period backfill..."

      BACKFILL_MISMATCH_COUNT="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT COUNT(*)
             FROM real_estate.mandat m
             LEFT JOIN real_estate.mandat_periode mp
               ON mp.id_mandat = m.id_mandat
              AND mp.numero_periode = 1
              AND mp.type_periode = 'INITIAL'
             WHERE mp.id_mandat_periode IS NULL
                OR mp.date_debut <> m.date_debut
                OR mp.date_fin <> m.date_fin;"
      )"

      echo "Mandat lifecycle backfill mismatches: ${BACKFILL_MISMATCH_COUNT}"

      if [ "${BACKFILL_MISMATCH_COUNT}" != "0" ]; then
        echo "ERROR: Mandat lifecycle backfill verification failed."
        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify one INITIAL period per existing Mandat
    # -------------------------------------------------------------------------

    - |
      echo "Checking INITIAL period cardinality..."

      INITIAL_CARDINALITY_ERRORS="$(
        kubectl -n real-estate exec deploy/real-estate-postgresql -- \
          psql \
            -U real_estate_user \
            -d real_estate \
            -tAc \
            "SELECT COUNT(*)
             FROM (
               SELECT
                 m.id_mandat,
                 COUNT(mp.id_mandat_periode) AS initial_count
               FROM real_estate.mandat m
               LEFT JOIN real_estate.mandat_periode mp
                 ON mp.id_mandat = m.id_mandat
                AND mp.type_periode = 'INITIAL'
               GROUP BY m.id_mandat
               HAVING COUNT(mp.id_mandat_periode) <> 1
             ) invalid_mandats;"
      )"

      echo "Mandats with invalid INITIAL period count: ${INITIAL_CARDINALITY_ERRORS}"

      if [ "${INITIAL_CARDINALITY_ERRORS}" != "0" ]; then
        echo "ERROR: invalid INITIAL period cardinality detected."
        exit 1
      fi

    # -------------------------------------------------------------------------
    # Verify migration registry and final state
    # -------------------------------------------------------------------------

    - |
      echo "Verifying migration registry..."

      kubectl -n real-estate exec deploy/real-estate-postgresql -- \
        psql \
          -U real_estate_user \
          -d real_estate \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT
              version,
              description,
              applied_at
            FROM migration_control.schema_version
            WHERE version = '008';

            SELECT
              type_periode,
              est_historique_legacy,
              COUNT(*) AS periodes
            FROM real_estate.mandat_periode
            GROUP BY
              type_periode,
              est_historique_legacy
            ORDER BY
              type_periode,
              est_historique_legacy;
          "

    - |
      echo "============================================================"
      echo "MIGRATION 008 SUCCESSFULLY APPLIED"
      echo "============================================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false


