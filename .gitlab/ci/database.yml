# Job configuration only; implementation lives in scripts/ci/.
.database-operation:
  resource_group: real-estate-database
  stage: database
  tags:
    - shell
  needs:
    - database:validate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

database:validate:
  stage: validate
  tags:
    - docker
  image: postgres:16
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/database/validate.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - database/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/database.yml
        - .gitlab/ci/database-hunter-invoice.yml
        - scripts/ci/database/**/*

database:migrate-001:
  extends: .database-operation
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/database/migrate-001.sh"

