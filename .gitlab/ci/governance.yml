# Job configuration only; implementation lives in scripts/ci/.
governance:validate:
  extends: .governance-validation
  stage: validate
  tags:
    - docker
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --no-cache-dir -r governance/requirements.txt
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/governance/validate.sh"

governance:build-image:
  resource_group: governance-build-image
  extends: .governance-release
  stage: build
  tags:
    - docker
  image: docker:27.5.1
  needs:
    - job: governance:validate
      artifacts: false
    - job: pipeline:validate
      artifacts: false
      optional: true
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/real-estate-governance
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/governance/build-image.sh"
  artifacts:
    reports:
      dotenv: governance-image.env
