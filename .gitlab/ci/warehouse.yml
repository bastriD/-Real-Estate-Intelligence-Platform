# Job configuration only; implementation lives in scripts/ci/.
warehouse:validate:
  stage: validate
  tags:
    - docker
  image: postgres:16
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/warehouse/validate.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - database/migrations/003_warehouse_schema.sql
        - database/olap/**/*
        - pipelines/dbt/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/warehouse.yml
        - scripts/ci/warehouse/**/*

warehouse:migrate-003:
  resource_group: real-estate-database
  stage: database
  tags:
    - shell
  needs:
    - warehouse:validate
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/warehouse/migrate-003.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
