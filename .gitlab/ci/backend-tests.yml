# Job configuration only; implementation lives in scripts/ci/.
backend:tests:
  stage: validate
  tags:
    - docker
  image: python:3.12-slim
  variables:
    POSTGRES_PASSWORD: ci-test-only
    JWT_SECRET_KEY: ci-test-jwt-secret-only
  before_script:
    - python --version
    - pip --version
    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend-test.txt
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/backend/tests.sh"
  artifacts:
    when: always
    reports:
      junit: backend-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - src/**/*
        - tests/backend/**/*
        - tests/data/**/*
        - tests/ai/**/*
        - database/seeds/**/*
        - requirements-backend.txt
        - requirements-backend-test.txt
        - requirements-ai.txt
        - deploy/docker/Dockerfile.backend
        - .gitlab/ci/backend*.yml
        - .gitlab/ci/rules.yml
        - .gitlab-ci.yml
        - scripts/ci/backend/**/*
