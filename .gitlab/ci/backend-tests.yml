# =============================================================================
# REAL ESTATE BACKEND / API AUTOMATED TESTS
# =============================================================================
#
# RESPONSIBILITY
#
# This job is the mandatory behavioral regression gate for the Backend/API.
#
# It validates:
#
# - Backend/API behavior
# - Authentication
# - Role-based access control
# - Mandat ownership
# - Demande assignment lifecycle
# - Demande ownership
# - Presentation ownership
# - Visite ownership
# - Vente transaction lifecycle
# - Vente ownership / RBAC
# - Presentation -> DemandeVersion -> Demande -> Mandat integrity
# - Vente beneficiary / remuneration entitlement foundation
# - Remuneration persistence layer
# - Remuneration business service
# - Remuneration API / RBAC
# - Deterministic remuneration calculation
# - Audit actor propagation
# - Existing data tests
# - Candidate availability integration logic
# - API code coverage >= 80 %
#
#
# CI/CD RELATIONSHIP
#
#   backend:validate
#          |
#          +--------------------+
#                               |
#   backend:tests --------------+
#                               |
#                               v
#                      backend:build-image
#
#
# IMPORTANT
#
# - This job is defined separately from backend.yml.
# - backend.yml MUST NOT redefine backend:tests.
# - backend:build-image declares backend:tests as a dependency.
# - The job uses rules:changes and is created whenever Backend/API,
#   ownership, audit, transaction, remuneration, data or relevant
#   matching repository code changes.
#
# =============================================================================


backend:tests:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    POSTGRES_PASSWORD: "ci-test-only"
    JWT_SECRET_KEY: "ci-test-jwt-secret-only"

  before_script:

    # -------------------------------------------------------------------------
    # 1. Runtime diagnostics
    # -------------------------------------------------------------------------

    - python --version
    - pip --version


    # -------------------------------------------------------------------------
    # 2. Install Backend test dependencies
    #
    # requirements-backend-test.txt remains the authoritative dependency
    # definition for Backend/API tests.
    # -------------------------------------------------------------------------

    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend-test.txt


  script:

    # -------------------------------------------------------------------------
    # 1. Validate key Backend / ownership / transaction / remuneration files
    # -------------------------------------------------------------------------

    - test -f src/api/core/authorization.py


    # -------------------------------------------------------------------------
    # Models
    # -------------------------------------------------------------------------

    - test -f src/api/db/models/demande_affectation.py
    - test -f src/api/db/models/presentation.py
    - test -f src/api/db/models/visite.py
    - test -f src/api/db/models/vente.py

    - test -f src/api/db/models/paiement.py
    - test -f src/api/db/models/bareme_commission.py
    - test -f src/api/db/models/parametres_honoraires.py
    - test -f src/api/db/models/parametres_remuneration.py
    - test -f src/api/db/models/palier_performance.py


    # -------------------------------------------------------------------------
    # Repositories
    # -------------------------------------------------------------------------

    - test -f src/api/repositories/demande.py
    - test -f src/api/repositories/demande_affectation.py
    - test -f src/api/repositories/presentation.py
    - test -f src/api/repositories/visite.py
    - test -f src/api/repositories/vente.py

    - test -f src/api/repositories/paiement.py
    - test -f src/api/repositories/bareme_commission.py
    - test -f src/api/repositories/parametres_honoraires.py
    - test -f src/api/repositories/parametres_remuneration.py
    - test -f src/api/repositories/palier_performance.py


    # -------------------------------------------------------------------------
    # Services
    # -------------------------------------------------------------------------

    - test -f src/api/services/demande.py
    - test -f src/api/services/demande_affectation.py
    - test -f src/api/services/presentation.py
    - test -f src/api/services/visite.py
    - test -f src/api/services/vente.py

    - test -f src/api/services/remuneration_calculator.py
    - test -f src/api/services/remuneration.py


    # -------------------------------------------------------------------------
    # Schemas
    # -------------------------------------------------------------------------

    - test -f src/api/schemas/demande_affectation.py
    - test -f src/api/schemas/vente.py
    - test -f src/api/schemas/paiement.py


    # -------------------------------------------------------------------------
    # API endpoints
    # -------------------------------------------------------------------------

    - test -f src/api/api/v1/endpoints/mandats.py
    - test -f src/api/api/v1/endpoints/demandes.py
    - test -f src/api/api/v1/endpoints/presentations.py
    - test -f src/api/api/v1/endpoints/visites.py
    - test -f src/api/api/v1/endpoints/ventes.py
    - test -f src/api/api/v1/endpoints/remunerations.py


    # -------------------------------------------------------------------------
    # 2. Validate ownership / assignment / transaction / remuneration tests
    # -------------------------------------------------------------------------

    - test -f tests/backend/test_demande_affectation_api.py
    - test -f tests/backend/test_demande_affectation_service.py
    - test -f tests/backend/test_demande_ownership_api.py

    - test -f tests/backend/test_presentation_ownership_api.py

    - test -f tests/backend/test_visite_ownership_api.py
    - test -f tests/backend/test_visite_audit_api.py

    - test -f tests/backend/test_vente_service.py
    - test -f tests/backend/test_vente_api.py

    - test -f tests/backend/test_remuneration_calculator.py
    - test -f tests/backend/test_remuneration_service.py
    - test -f tests/backend/test_remuneration_api.py


    # -------------------------------------------------------------------------
    # 3. Validate Vente / remuneration imports before test execution
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.schemas.vente import (
          VenteCreate,
          VenteOrigine,
          VenteRead,
      )

      from src.api.schemas.paiement import (
          PaiementRead,
      )

      from src.api.services.vente import (
          VenteAlreadyExistsError,
          VenteNotFoundError,
          VenteService,
          VenteValidationError,
      )

      from src.api.services.remuneration_calculator import (
          PerformanceScores,
          PerformanceWeights,
          RemunerationCalculationInput,
          RemunerationCalculationResult,
          calculate_company_fees,
          calculate_final_rate,
          calculate_performance_modulation,
          calculate_performance_score,
          calculate_remuneration,
          calculate_seniority_bonus,
      )

      from src.api.services.remuneration import (
          RemunerationAlreadyCalculatedError,
          RemunerationConfigurationError,
          RemunerationDataError,
          RemunerationNotFoundError,
          RemunerationService,
      )

      from src.api.db.models.paiement import Paiement
      from src.api.db.models.bareme_commission import BaremeCommission
      from src.api.db.models.parametres_honoraires import ParametresHonoraires
      from src.api.db.models.parametres_remuneration import ParametresRemuneration
      from src.api.db.models.palier_performance import PalierPerformance

      from src.api.repositories.paiement import PaiementRepository
      from src.api.repositories.bareme_commission import BaremeCommissionRepository
      from src.api.repositories.parametres_honoraires import (
          ParametresHonorairesRepository,
      )
      from src.api.repositories.parametres_remuneration import (
          ParametresRemunerationRepository,
      )
      from src.api.repositories.palier_performance import (
          PalierPerformanceRepository,
      )

      print(
          "Vente service/schema imports successful."
      )

      print(
          "Remuneration calculator imports successful."
      )

      print(
          "Remuneration persistence/service/schema imports successful."
      )
      PY


    # -------------------------------------------------------------------------
    # 4. Validate Vente and remuneration routes are registered in FastAPI
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      paths = set(
          app.openapi()
          .get(
              "paths",
              {},
          )
          .keys()
      )

      required_paths = {
          "/api/v1/ventes",
          "/api/v1/remunerations/ventes/{vente_id}/calcul",
          "/api/v1/remunerations/ventes/{vente_id}",
          "/api/v1/remunerations/{paiement_id}",
      }

      missing_paths = (
          required_paths - paths
      )

      assert not missing_paths, (
          "Missing required API routes: "
          + ", ".join(
              sorted(
                  missing_paths
              )
          )
      )

      print(
          "Required Vente and remuneration OpenAPI routes registered."
      )
      PY


    # -------------------------------------------------------------------------
    # 5. Run complete Backend + selected Data/AI regression suite
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "RUNNING BACKEND / DATA / OWNERSHIP / TRANSACTION REGRESSION"
      echo "============================================================"

      python -m pytest \
        tests/backend \
        tests/data \
        tests/ai/test_candidate_availability.py \
        -v \
        --cov=src/api \
        --cov-report=term-missing \
        --cov-report=xml \
        --cov-fail-under=80


    # -------------------------------------------------------------------------
    # 6. CI evidence summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND AUTOMATED TEST GATE PASSED"
      echo "============================================================"

      echo
      echo "Validated:"
      echo "- Backend/API regression suite"
      echo "- Authentication"
      echo "- Role-based authorization"
      echo "- Mandat ownership"
      echo "- Demande assignment lifecycle"
      echo "- Demande ownership"
      echo "- Presentation ownership"
      echo "- Visite ownership"
      echo "- Vente transaction lifecycle"
      echo "- Vente ownership / RBAC"
      echo "- Presentation-to-Mandat integrity"
      echo "- Contractual period resolution"
      echo "- Exclusive / non-exclusive beneficiary rules"
      echo "- Expired Mandat remuneration entitlement behavior"
      echo "- Duplicate Presentation sale protection"

      echo "- Remuneration persistence models"
      echo "- Remuneration repositories"
      echo "- Remuneration business service"
      echo "- Remuneration API endpoints"
      echo "- Remuneration ownership / RBAC"
      echo "- Duplicate remuneration calculation protection"
      echo "- Missing remuneration configuration handling"

      echo "- Deterministic remuneration calculator"
      echo "- Company fee calculation"
      echo "- Performance score calculation"
      echo "- Seniority modulation"
      echo "- Performance modulation"
      echo "- Final remuneration rate calculation"
      echo "- Frozen remuneration calculation snapshot"
      echo "- Reference calculation:"
      echo "  420000 EUR purchase"
      echo "  13500 EUR company fees"
      echo "  73.5 performance score"
      echo "  46.16 percent hunter rate"
      echo "  6231.60 EUR hunter remuneration"

      echo "- Audit actor propagation"
      echo "- Existing data validation tests"
      echo "- Candidate availability"
      echo "- src/api coverage >= 80 percent"


  artifacts:
    when: always

    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

    paths:
      - coverage.xml

    expire_in: 30 days


  rules:

    # -------------------------------------------------------------------------
    # Backend / API implementation
    # -------------------------------------------------------------------------

    - changes:
        - src/api/**/*


    # -------------------------------------------------------------------------
    # Backend regression tests
    # -------------------------------------------------------------------------

    - changes:
        - tests/backend/**/*


    # -------------------------------------------------------------------------
    # Data tests used by this job
    # -------------------------------------------------------------------------

    - changes:
        - tests/data/**/*


    # -------------------------------------------------------------------------
    # Candidate availability test and implementation
    # -------------------------------------------------------------------------

    - changes:
        - tests/ai/test_candidate_availability.py
        - src/ai/matching/repository.py


    # -------------------------------------------------------------------------
    # Data staging dependency used by the selected tests
    # -------------------------------------------------------------------------

    - changes:
        - database/seeds/transform_raw_to_staging.py


    # -------------------------------------------------------------------------
    # Dependency definitions
    # -------------------------------------------------------------------------

    - changes:
        - requirements-backend.txt
        - requirements-backend-test.txt


    # -------------------------------------------------------------------------
    # CI definition itself
    # -------------------------------------------------------------------------

    - changes:
        - .gitlab/ci/backend-tests.yml
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml