backend:tests:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    POSTGRES_PASSWORD: "ci-test-only"
    JWT_SECRET_KEY: "ci-test-jwt-secret-only"

  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements-backend-test.txt

  script:
    - python -m pytest tests/backend tests/data tests/ai/test_candidate_availability.py -v --cov=src/api --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 30 days

  rules:
    - changes:
        - src/api/**/*
        - tests/backend/**/*
        - tests/data/**/*
        - tests/ai/test_candidate_availability.py
        - src/ai/matching/repository.py
        - database/seeds/transform_raw_to_staging.py
        - requirements-backend.txt
        - requirements-backend-test.txt
        - .gitlab/ci/backend-tests.yml
