# Job configuration only; implementation lives in scripts/ci/.
data-pipeline:build-image:
  resource_group: data-pipeline-build-image
  stage: build
  tags:
    - docker
  needs:
    - job: database:validate
      artifacts: false
    - job: warehouse:validate
      artifacts: false
    - job: backend:tests
      artifacts: false
    - job: pipeline:validate
      artifacts: false
      optional: true
  image: docker:27.5.1
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/data-pipeline
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - apk add --no-cache python3
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/data-pipeline/build-image.sh"
  artifacts:
    paths:
      - airflow-dags/
    reports:
      dotenv: data-pipeline-image.env
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
