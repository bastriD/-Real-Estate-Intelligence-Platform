# =============================================================================
# REAL ESTATE BACKEND / API
# =============================================================================
#
# CI/CD FLOW
#
#   backend:validate
#          |
#          v
#   backend:build-image
#          |
#          v
#   GitLab Container Registry
#          |
#          v
#   backend:publish-gitops
#          |
#          +--> real-estate/gitlab-registry-auth
#          |
#          +--> lab-gitops/workloads/real-estate/backend
#          |
#          +--> lab-gitops/apps/real-estate-backend/application.yaml
#          |
#          v
#   Argo CD root-app
#     repo: https://gitlab.local/root/lab-gitops.git
#     branch: main
#     path: apps
#     directory.recurse: true
#          |
#          v
#   Argo CD Application real-estate-backend
#          |
#          v
#   Kubernetes namespace real-estate
#
# IMPORTANT:
#
# - apps/ is NOT managed through a kustomization.yaml.
# - root-app recursively discovers apps/*/application.yaml.
# - workload manifests under workloads/real-estate/backend DO use Kustomize.
# - permanent workload deployment is GitOps-driven.
# - kubectl is used only for validation and Secret bootstrap here.
#
# =============================================================================


# =============================================================================
# 1. VALIDATE BACKEND
# =============================================================================

backend:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    POSTGRES_PASSWORD: "ci-validation-only"

  before_script:
    - python --version
    - pip --version

    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend.txt

  script:
    # -------------------------------------------------------------------------
    # Validate expected Backend source files
    # -------------------------------------------------------------------------

    - test -f requirements-backend.txt

    - test -f src/api/main.py
    - test -f src/api/core/config.py
    - test -f src/api/db/session.py
    - test -f src/api/api/v1/router.py
    - test -f src/api/api/v1/endpoints/health.py

    - test -f deploy/docker/Dockerfile.backend

    - test -f deploy/kubernetes/backend/deployment.yaml
    - test -f deploy/kubernetes/backend/service.yaml
    - test -f deploy/kubernetes/backend/kustomization.yaml
    - test -f deploy/kubernetes/backend/application.yaml

    # -------------------------------------------------------------------------
    # Python syntax validation
    # -------------------------------------------------------------------------

    - |
      python -m py_compile \
        src/api/main.py \
        src/api/core/config.py \
        src/api/db/session.py \
        src/api/api/v1/router.py \
        src/api/api/v1/endpoints/health.py

    # -------------------------------------------------------------------------
    # Validate FastAPI/OpenAPI
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      schema = app.openapi()
      paths = sorted(schema.get("paths", {}).keys())

      print("OpenAPI routes:")

      for path in paths:
          print(f" - {path}")

      required_routes = {
          "/health",
          "/ready",
          "/api/v1/health",
          "/api/v1/ready",
      }

      missing_routes = required_routes.difference(paths)

      if missing_routes:
          raise RuntimeError(
              f"Missing required API routes: {sorted(missing_routes)}"
          )

      print("Backend OpenAPI validation successful.")
      PY

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'


# =============================================================================
# 2. BUILD AND PUBLISH BACKEND IMAGE
# =============================================================================

backend:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: backend:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    # -------------------------------------------------------------------------
    # Validate Docker runner
    # -------------------------------------------------------------------------

    - docker version

    # -------------------------------------------------------------------------
    # Authenticate against GitLab Container Registry
    # -------------------------------------------------------------------------

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # Build Backend image
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BUILDING REAL ESTATE BACKEND"
      echo "============================================================"

      echo
      echo "Image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker build \
        -f deploy/docker/Dockerfile.backend \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # Validate Python inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # Validate FastAPI import inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; print('Application:', app.title); print('Version:', app.version)"

    # -------------------------------------------------------------------------
    # Validate required OpenAPI routes inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; paths=set(app.openapi().get('paths', {}).keys()); required={'/health','/ready','/api/v1/health','/api/v1/ready'}; missing=required-paths; print('OpenAPI paths:', sorted(paths)); assert not missing, f'Missing routes: {sorted(missing)}'"

    # -------------------------------------------------------------------------
    # Push immutable commit tag
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Publishing immutable Backend image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # Push latest convenience tag
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    # -------------------------------------------------------------------------
    # Build summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND IMAGE PUBLISHED"
      echo "============================================================"

      echo
      echo "Immutable image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      echo
      echo "Latest image:"
      echo "$IMAGE_NAME:latest"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =============================================================================
# 3. PUBLISH BACKEND DESIRED STATE TO LAB-GITOPS
# =============================================================================

backend:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: backend:build-image
      artifacts: false

  variables:
    # -------------------------------------------------------------------------
    # GitOps repository used by Argo CD root-app
    # -------------------------------------------------------------------------

    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    # -------------------------------------------------------------------------
    # Temporary clone directory
    # -------------------------------------------------------------------------

    GITOPS_WORKDIR: "/tmp/chasse-backend-gitops"

    # -------------------------------------------------------------------------
    # Absolute source path in chasse_immobiliere repository
    #
    # Using CI_PROJECT_DIR prevents failures after Git operations or cwd changes.
    # -------------------------------------------------------------------------

    BACKEND_SOURCE_PATH: "$CI_PROJECT_DIR/deploy/kubernetes/backend"

    # -------------------------------------------------------------------------
    # Destination paths inside lab-gitops
    # -------------------------------------------------------------------------

    GITOPS_BACKEND_PATH: "workloads/real-estate/backend"
    GITOPS_APP_PATH: "apps/real-estate-backend"

    # -------------------------------------------------------------------------
    # Existing runtime Secret name used by the Deployment
    # -------------------------------------------------------------------------

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate shell runner tooling
    # -------------------------------------------------------------------------

    - git --version
    - kubectl version --client

    # -------------------------------------------------------------------------
    # 2. Validate original Backend source repository
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND SOURCE VALIDATION"
      echo "============================================================"

      echo
      echo "CI project directory:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "Backend source path:"
      echo "$BACKEND_SOURCE_PATH"

      test -d "$BACKEND_SOURCE_PATH"

      test -f "$BACKEND_SOURCE_PATH/deployment.yaml"
      test -f "$BACKEND_SOURCE_PATH/service.yaml"
      test -f "$BACKEND_SOURCE_PATH/kustomization.yaml"
      test -f "$BACKEND_SOURCE_PATH/application.yaml"

      echo
      echo "Backend source manifests found."

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes namespace
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        real-estate

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        real-estate-postgresql-secret

    # -------------------------------------------------------------------------
    # 5. Validate existing GitOps/PAT Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials

    # -------------------------------------------------------------------------
    # 6. Clean previous temporary files
    # -------------------------------------------------------------------------

    - rm -rf "$GITOPS_WORKDIR"
    - rm -f /tmp/.netrc
    - rm -f /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 7. Load GitOps credentials from existing Kubernetes Secret
    #
    # Credentials are kept in environment only for this job.
    # They are never committed to Git.
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "$LAB_GITOPS_GIT_USER"
      test -n "$LAB_GITOPS_GIT_TOKEN"

      echo "GitOps/PAT credentials loaded."

    # -------------------------------------------------------------------------
    # 8. Create/update GitLab Registry pull Secret
    #
    # The same existing PAT is reused.
    # It must have read_registry permission.
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        create secret docker-registry \
        "$REGISTRY_PULL_SECRET" \
        --docker-server="gitlab.local:4567" \
        --docker-username="$LAB_GITOPS_GIT_USER" \
        --docker-password="$LAB_GITOPS_GIT_TOKEN" \
        --dry-run=client \
        -o yaml |
      kubectl apply -f -

    # -------------------------------------------------------------------------
    # 9. Verify Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        "$REGISTRY_PULL_SECRET"

    # -------------------------------------------------------------------------
    # 10. Verify Deployment source references expected Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$BACKEND_SOURCE_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 11. Build temporary Git authentication file
    # -------------------------------------------------------------------------

    - |
      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc

    # -------------------------------------------------------------------------
    # 12. Clone exact branch used by Argo CD
    #
    # Verified root-app configuration:
    #
    # repoURL: https://gitlab.local/root/lab-gitops.git
    # targetRevision: main
    # path: apps
    # directory.recurse: true
    #
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CLONING LAB-GITOPS"
      echo "============================================================"

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"

    # -------------------------------------------------------------------------
    # 13. Validate exact GitOps branch and revision
    #
    # Uses git -C instead of cd so the job working directory never changes.
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "GITOPS REPOSITORY DIAGNOSTICS"
      echo "============================================================"

      echo
      echo "Current branch:"
      git -C "$GITOPS_WORKDIR" branch --show-current

      echo
      echo "Current revision:"
      git -C "$GITOPS_WORKDIR" rev-parse --short HEAD

      echo
      echo "Repository root:"
      ls -la "$GITOPS_WORKDIR"

      echo
      echo "Top-level directories:"
      find "$GITOPS_WORKDIR" \
        -maxdepth 1 \
        -mindepth 1 \
        -type d \
        -print

      test "$(
        git -C "$GITOPS_WORKDIR" branch --show-current
      )" = "$GITOPS_BRANCH"

    # -------------------------------------------------------------------------
    # 14. Validate real GitOps architecture
    #
    # root-app recursively scans apps/.
    #
    # There is intentionally NO:
    #
    #   apps/kustomization.yaml
    #
    # -------------------------------------------------------------------------

    - |
      test -d "$GITOPS_WORKDIR/apps"
      test -d "$GITOPS_WORKDIR/workloads"

      echo
      echo "GitOps structure validated:"
      echo "  $GITOPS_WORKDIR/apps"
      echo "  $GITOPS_WORKDIR/workloads"

    # -------------------------------------------------------------------------
    # 15. Create Backend destination directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"

    # -------------------------------------------------------------------------
    # 16. Copy Backend Deployment
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/deployment.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 17. Copy Backend Service
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/service.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

     #17.1 Copy Backend ServiceMonitor
    - |
      cp \
        "$BACKEND_SOURCE_PATH/servicemonitor.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/servicemonitor.yaml"
    # -------------------------------------------------------------------------
    # 18. Copy Backend workload Kustomization
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/kustomization.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/kustomization.yaml"
   
    
    # -------------------------------------------------------------------------
    # 19. Copy Argo CD Application
    #
    # root-app recursively discovers this file automatically.
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/application.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 20. Inject immutable image tag into GitOps Deployment
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Injecting Backend image tag:"
      echo "$CI_COMMIT_SHORT_SHA"

      sed -i \
        "s/__BACKEND_IMAGE_TAG__/${CI_COMMIT_SHORT_SHA}/g" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 21. Ensure placeholder has disappeared
    # -------------------------------------------------------------------------

    - |
      if grep -q \
        "__BACKEND_IMAGE_TAG__" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"; then

        echo
        echo "ERROR:"
        echo "Backend image placeholder remains in deployment.yaml."

        exit 1

      fi

      echo "Image placeholder replaced successfully."

    # -------------------------------------------------------------------------
    # 22. Validate immutable image reference
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Expected Backend image:"
      echo "$EXPECTED_IMAGE"

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 23. Validate Registry Secret reference after copy
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 24. Validate Backend workload Kustomization
    #
    # workloads/real-estate/backend DOES use Kustomize.
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        > /tmp/real-estate-backend-rendered.yaml

      test -s \
        /tmp/real-estate-backend-rendered.yaml

      echo
      echo "Backend Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 25. Validate rendered workload contains Deployment
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: Deployment" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 26. Validate rendered workload contains Service
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: Service" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 27. Validate rendered resource name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 28. Validate rendered immutable image
    # -------------------------------------------------------------------------

    - |
      grep \
        "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 29. Validate rendered Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "$REGISTRY_PULL_SECRET" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 30. Validate Argo CD Application name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 31. Validate Argo CD Application workload path
    # -------------------------------------------------------------------------

    - |
      grep \
        "path: workloads/real-estate/backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 32. Validate Argo CD Application repository
    # -------------------------------------------------------------------------

    - |
      grep \
        "repoURL: https://gitlab.local/root/lab-gitops.git" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 33. Validate Argo CD Application branch
    # -------------------------------------------------------------------------

    - |
      grep \
        "targetRevision: main" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      echo
      echo "Backend Argo CD Application validation successful."

    # -------------------------------------------------------------------------
    # 34. Client-side Kubernetes validation
    #
    # DRY RUN ONLY.
    #
    # We DO NOT directly deploy workload resources here.
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      echo
      echo "Kubernetes client-side manifest validation successful."

    # -------------------------------------------------------------------------
    # 35. Display final desired-state locations
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND GITOPS DESIRED STATE"
      echo "============================================================"

      echo
      echo "Workload directory:"
      echo "$GITOPS_BACKEND_PATH"

      echo
      echo "Application directory:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "Files:"
      find "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        -maxdepth 1 \
        -type f \
        -print

      find "$GITOPS_WORKDIR/$GITOPS_APP_PATH" \
        -maxdepth 1 \
        -type f \
        -print

    # -------------------------------------------------------------------------
    # 36. Display deployed image desired state
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Backend Deployment image:"

      grep \
        "image:" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 37. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" config \
        user.name \
        "chasse-immobiliere-ci"

      git -C "$GITOPS_WORKDIR" config \
        user.email \
        "gitlab-ci@lab.local"

    # -------------------------------------------------------------------------
    # 38. Stage Backend GitOps resources
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" add \
        "$GITOPS_BACKEND_PATH" \
        "$GITOPS_APP_PATH"

      echo
      echo "GitOps staged changes:"

      git -C "$GITOPS_WORKDIR" status \
        --short

    # -------------------------------------------------------------------------
    # 39. Commit and push only when desired state changed
    # -------------------------------------------------------------------------

    - |
      if git -C "$GITOPS_WORKDIR" diff --cached --quiet; then

        echo
        echo "No Backend GitOps changes detected."

      else

        echo
        echo "Creating Backend GitOps commit..."

        git -C "$GITOPS_WORKDIR" commit \
          -m "deploy: publish real-estate backend ${CI_COMMIT_SHORT_SHA}"

        echo
        echo "Pushing Backend GitOps commit to main..."

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git -C "$GITOPS_WORKDIR" push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "Backend GitOps publication completed."

      fi

    # -------------------------------------------------------------------------
    # 40. Final summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Application source repository:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "Backend source manifests:"
      echo "$BACKEND_SOURCE_PATH"

      echo
      echo "Container image:"
      echo "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Registry pull Secret:"
      echo "real-estate/${REGISTRY_PULL_SECRET}"

      echo
      echo "GitOps repository:"
      echo "$GITOPS_REPOSITORY"

      echo
      echo "GitOps branch:"
      echo "$GITOPS_BRANCH"

      echo
      echo "GitOps workload:"
      echo "$GITOPS_BACKEND_PATH"

      echo
      echo "Argo CD Application:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "Argo root discovery:"
      echo "apps/ -> recursive directory discovery"

      echo
      echo "Permanent deployment:"
      echo "GitOps / Argo CD"

  after_script:
    # -------------------------------------------------------------------------
    # Remove temporary credentials and working files
    # -------------------------------------------------------------------------

    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-backend-gitops
    - rm -f /tmp/real-estate-backend-rendered.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*
        - tests/**/*
        - requirements-backend.txt
        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml