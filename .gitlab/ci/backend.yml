# =============================================================================
# REAL ESTATE BACKEND / API + AI MATCHING
# =============================================================================
#
# CI/CD FLOW
#
#   backend:validate
#          |
#          v
#   backend:build-image
#          |
#          v
#   GitLab Container Registry
#          |
#          v
#   backend:publish-gitops
#          |
#          +--> real-estate/gitlab-registry-auth
#          |
#          +--> lab-gitops/workloads/real-estate/backend
#          |
#          +--> lab-gitops/apps/real-estate-backend/application.yaml
#          |
#          v
#   Argo CD root-app
#     repo: https://gitlab.local/root/lab-gitops.git
#     branch: main
#     path: apps
#     directory.recurse: true
#          |
#          v
#   Argo CD Application real-estate-backend
#          |
#          v
#   Kubernetes namespace real-estate
#
# DEPENDENCY ARCHITECTURE
#
#   requirements-backend.txt
#       Backend / API runtime
#
#   requirements-ai.txt
#       -r requirements-backend.txt
#       + NumPy
#       + Pandas
#       Deterministic matching / AI runtime
#
#   requirements-ai-training.txt
#       -r requirements-ai.txt
#       + scikit-learn
#       + MLflow
#       + PyTorch
#       Dedicated ML training environment only
#
# VALIDATION RESPONSIBILITY
#
#   backend:validate
#       Backend syntax
#       Backend runtime compatibility
#       Matching runtime import compatibility
#       FastAPI/OpenAPI contract
#
#   backend:tests
#       Backend/API automated tests
#       Coverage validation
#
#   ai:validate
#       Pure deterministic matching unit tests
#
#   ai-mlops:evaluate
#       Real Kubernetes integration
#       Real PostgreSQL repository
#       Real DemandeVersion
#       Real candidates
#       Real ground-truth lineage
#       MLflow tracking
#
# IMPORTANT:
#
# - apps/ is NOT managed through a kustomization.yaml.
# - root-app recursively discovers apps/*/application.yaml.
# - workload manifests under workloads/real-estate/backend DO use Kustomize.
# - permanent workload deployment is GitOps-driven.
# - kubectl is used only for validation and Secret bootstrap here.
# - requirements-ai.txt extends requirements-backend.txt.
# - requirements-ai-training.txt is NOT installed in Backend CI.
# - src/ai is packaged inside the Backend image.
# - PostgreSQL repository behavior is NOT mocked in backend:validate.
#
# =============================================================================


# =============================================================================
# 1. VALIDATE BACKEND + AI MATCHING RUNTIME
# =============================================================================

backend:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    POSTGRES_PASSWORD: "ci-validation-only"
    JWT_SECRET_KEY: "ci-validation-jwt-secret-only"

  before_script:
    - python --version
    - pip --version

    # -------------------------------------------------------------------------
    # Install Backend + lightweight AI matching runtime dependencies.
    #
    # requirements-ai.txt contains:
    #
    #   -r requirements-backend.txt
    #
    # Therefore this installs:
    #
    #   Backend dependencies
    #   + NumPy
    #   + Pandas
    #
    # Training-only dependencies such as scikit-learn, MLflow and PyTorch
    # are intentionally NOT installed here.
    # -------------------------------------------------------------------------

    - |
      pip install \
        --no-cache-dir \
        -r requirements-ai.txt

  script:
    # -------------------------------------------------------------------------
    # 1. Validate dependency files
    # -------------------------------------------------------------------------

    - test -f requirements-backend.txt
    - test -f requirements-ai.txt
    - test -f requirements-backend-test.txt
    - test -f requirements-ai-training.txt

    # -------------------------------------------------------------------------
    # 2. Validate expected Backend source files
    # -------------------------------------------------------------------------

    - test -f src/api/main.py
    - test -f src/api/core/config.py
    - test -f src/api/core/security.py
    - test -f src/api/db/session.py
    - test -f src/api/db/models/utilisateur.py
    - test -f src/api/repositories/utilisateur.py
    - test -f src/api/services/auth.py
    - test -f src/api/schemas/auth.py
    - test -f src/api/api/v1/router.py
    - test -f src/api/api/v1/endpoints/health.py
    - test -f src/api/api/v1/endpoints/auth.py
    - test -f src/api/db/models/audit_log.py
    - test -f src/api/repositories/audit_log.py
    - test -f src/api/services/audit_log.py
    - test -f src/api/services/presentation.py
    - test -f src/api/api/v1/endpoints/presentations.py

    # -------------------------------------------------------------------------
    # 3. Validate matching runtime source files required by Backend
    # -------------------------------------------------------------------------

    - test -f src/ai/matching/features.py
    - test -f src/ai/matching/repository.py
    - test -f src/ai/matching/evaluate.py

    # -------------------------------------------------------------------------
    # 4. Validate deployment files
    # -------------------------------------------------------------------------

    - test -f deploy/docker/Dockerfile.backend

    - test -f deploy/kubernetes/backend/deployment.yaml
    - test -f deploy/kubernetes/backend/service.yaml
    - test -f deploy/kubernetes/backend/servicemonitor.yaml
    - test -f deploy/kubernetes/backend/kustomization.yaml
    - test -f deploy/kubernetes/backend/application.yaml

    # -------------------------------------------------------------------------
    # 5. Python syntax validation
    # -------------------------------------------------------------------------

    - |
      python -m py_compile \
        src/api/main.py \
        src/api/core/config.py \
        src/api/core/security.py \
        src/api/db/session.py \
        src/api/db/models/utilisateur.py \
        src/api/repositories/utilisateur.py \
        src/api/services/auth.py \
        src/api/schemas/auth.py \
        src/api/api/v1/router.py \
        src/api/api/v1/endpoints/health.py \
        src/api/api/v1/endpoints/auth.py \
        src/ai/matching/features.py \
        src/ai/matching/repository.py \
        src/ai/matching/evaluate.py   \
        src/api/db/models/audit_log.py \
        src/api/repositories/audit_log.py \
        src/api/services/audit_log.py \
        src/api/services/presentation.py \
        src/api/api/v1/endpoints/presentations.py \

    # -------------------------------------------------------------------------
    # 6. Validate lightweight runtime dependency imports
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      import jwt
      import numpy
      import pandas
      import psycopg

      from pwdlib import PasswordHash

      print("Runtime dependency validation:")
      print(" - NumPy:", numpy.__version__)
      print(" - Pandas:", pandas.__version__)
      print(" - psycopg:", psycopg.__version__)
      print(" - PyJWT:", jwt.__version__)
      print(" - pwdlib: OK")

      PasswordHash.recommended()

      print("Backend + matching + authentication runtime dependencies imported successfully.")
      PY

    # -------------------------------------------------------------------------
    # 7. Validate AI matching module compatibility
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.ai.matching.features import (
          MatchingWeights,
          build_matching_features,
          compute_matching_score,
          filter_candidates,
      )

      from src.ai.matching.repository import (
          load_candidate_biens,
          load_demande_version,
          load_ground_truth_references,
          load_matching_input,
      )

      from src.ai.matching.evaluate import (
          evaluate_demande_version,
      )

      weights = MatchingWeights()

      print("Backend-compatible matching modules imported successfully.")
      print("Matching weights:", weights)
      PY

    # -------------------------------------------------------------------------
    # 8. Validate authentication primitives
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.core.security import (
          create_access_token,
          decode_access_token,
          hash_password,
          verify_password,
      )

      password = "ci-validation-password"
      hashed = hash_password(password)

      assert hashed != password
      assert verify_password(password, hashed)
      assert not verify_password("wrong-password", hashed)

      token = create_access_token(
          subject="ci-validation@example.test",
          role="ADMIN",
          utilisateur_id=1,
      )

      payload = decode_access_token(token)

      assert payload["sub"] == "ci-validation@example.test"
      assert payload["uid"] == 1
      assert payload["role"] == "ADMIN"

      print("Authentication primitives validation successful.")
      PY

    # -------------------------------------------------------------------------
    # 9. Validate FastAPI/OpenAPI
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      schema = app.openapi()
      paths = sorted(schema.get("paths", {}).keys())

      print("OpenAPI routes:")

      for path in paths:
          print(f" - {path}")

      required_routes = {
          "/health",
          "/ready",
          "/api/v1/health",
          "/api/v1/ready",
          "/api/v1/auth/login",
      }

      missing_routes = required_routes.difference(paths)

      if missing_routes:
          raise RuntimeError(
              f"Missing required API routes: {sorted(missing_routes)}"
          )

      print("Backend OpenAPI validation successful.")
      PY

    # -------------------------------------------------------------------------
    # 10. Validation responsibility summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND VALIDATION COMPLETED"
      echo "============================================================"

      echo
      echo "Validated here:"
      echo "- Backend dependency compatibility"
      echo "- Backend Python syntax"
      echo "- Authentication dependency compatibility"
      echo "- Password hashing primitives"
      echo "- JWT encode/decode primitives"
      echo "- Authentication OpenAPI route"
      echo "- AI matching runtime import compatibility"
      echo "- Backend deployment structure"
      echo "- FastAPI/OpenAPI contract"

      echo
      echo "Not validated here:"
      echo "- real authentication against PostgreSQL"
      echo "- authorization / RBAC"
      echo "- deterministic AI scoring unit tests"
      echo "- PostgreSQL matching repository behavior"
      echo "- real candidate eligibility"
      echo "- ground-truth lineage"
      echo "- MLflow integration"

      echo
      echo "Those responsibilities belong to:"
      echo "- backend integration/runtime tests"
      echo "- ai:validate"
      echo "- ai-mlops:evaluate"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'


# =============================================================================
# 2. BUILD AND PUBLISH BACKEND + AI MATCHING IMAGE
# =============================================================================

backend:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: backend:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    - docker version

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # 1. Build Backend image
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BUILDING REAL ESTATE BACKEND + AI MATCHING"
      echo "============================================================"

      echo
      echo "Image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker build \
        -f deploy/docker/Dockerfile.backend \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # 2. Validate Python inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # 3. Validate lightweight runtime dependencies inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "import jwt; import numpy; import pandas; import psycopg; from pwdlib import PasswordHash; PasswordHash.recommended(); print('Backend + AI + auth runtime dependencies OK')"

    # -------------------------------------------------------------------------
    # 4. Validate AI matching modules inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.ai.matching.features import MatchingWeights, build_matching_features, compute_matching_score, filter_candidates; from src.ai.matching.repository import load_demande_version, load_candidate_biens, load_matching_input; print('AI matching modules OK'); print(MatchingWeights())"

    # -------------------------------------------------------------------------
    # 5. Validate FastAPI import inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        -e JWT_SECRET_KEY=ci-image-validation-jwt-secret-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; print('Application:', app.title); print('Version:', app.version)"

    # -------------------------------------------------------------------------
    # 6. Validate required OpenAPI routes inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        -e JWT_SECRET_KEY=ci-image-validation-jwt-secret-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; paths=set(app.openapi().get('paths', {}).keys()); required={'/health','/ready','/api/v1/health','/api/v1/ready','/api/v1/auth/login'}; missing=required-paths; print('OpenAPI paths:', sorted(paths)); assert not missing, f'Missing routes: {sorted(missing)}'"

    # -------------------------------------------------------------------------
    # 7. Push immutable commit tag
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Publishing immutable Backend image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # 8. Push latest convenience tag
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    # -------------------------------------------------------------------------
    # 9. Build summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND + AI MATCHING IMAGE PUBLISHED"
      echo "============================================================"

      echo
      echo "Immutable image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      echo
      echo "Latest image:"
      echo "$IMAGE_NAME:latest"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =============================================================================
# 3. PUBLISH BACKEND DESIRED STATE TO LAB-GITOPS
# =============================================================================

backend:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: backend:build-image
      artifacts: false

  variables:
    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    GITOPS_WORKDIR: "/tmp/chasse-backend-gitops"

    BACKEND_SOURCE_PATH: "$CI_PROJECT_DIR/deploy/kubernetes/backend"

    GITOPS_BACKEND_PATH: "workloads/real-estate/backend"
    GITOPS_APP_PATH: "apps/real-estate-backend"

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate shell runner tooling
    # -------------------------------------------------------------------------

    - git --version
    - kubectl version --client

    # -------------------------------------------------------------------------
    # 2. Validate original Backend source repository
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND SOURCE VALIDATION"
      echo "============================================================"

      echo
      echo "CI project directory:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "Backend source path:"
      echo "$BACKEND_SOURCE_PATH"

      test -d "$BACKEND_SOURCE_PATH"

      test -f "$BACKEND_SOURCE_PATH/deployment.yaml"
      test -f "$BACKEND_SOURCE_PATH/service.yaml"
      test -f "$BACKEND_SOURCE_PATH/servicemonitor.yaml"
      test -f "$BACKEND_SOURCE_PATH/kustomization.yaml"
      test -f "$BACKEND_SOURCE_PATH/application.yaml"

      echo
      echo "Backend source manifests found."

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes namespace
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        real-estate

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        real-estate-postgresql-secret

    # -------------------------------------------------------------------------
    # 5. Validate existing GitOps/PAT Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials

    # -------------------------------------------------------------------------
    # 6. Clean previous temporary files
    # -------------------------------------------------------------------------

    - rm -rf "$GITOPS_WORKDIR"
    - rm -f /tmp/.netrc
    - rm -f /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 7. Load GitOps credentials from existing Kubernetes Secret
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "$LAB_GITOPS_GIT_USER"
      test -n "$LAB_GITOPS_GIT_TOKEN"

      echo "GitOps/PAT credentials loaded."

    # -------------------------------------------------------------------------
    # 8. Create/update GitLab Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        create secret docker-registry \
        "$REGISTRY_PULL_SECRET" \
        --docker-server="gitlab.local:4567" \
        --docker-username="$LAB_GITOPS_GIT_USER" \
        --docker-password="$LAB_GITOPS_GIT_TOKEN" \
        --dry-run=client \
        -o yaml |
      kubectl apply -f -

    # -------------------------------------------------------------------------
    # 9. Verify Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        "$REGISTRY_PULL_SECRET"

    # -------------------------------------------------------------------------
    # 10. Verify Deployment source references expected Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$BACKEND_SOURCE_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 11. Build temporary Git authentication file
    # -------------------------------------------------------------------------

    - |
      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc

    # -------------------------------------------------------------------------
    # 12. Clone exact branch used by Argo CD
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CLONING LAB-GITOPS"
      echo "============================================================"

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"

    # -------------------------------------------------------------------------
    # 13. Validate exact GitOps branch and revision
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "GITOPS REPOSITORY DIAGNOSTICS"
      echo "============================================================"

      echo
      echo "Current branch:"
      git -C "$GITOPS_WORKDIR" branch --show-current

      echo
      echo "Current revision:"
      git -C "$GITOPS_WORKDIR" rev-parse --short HEAD

      echo
      echo "Repository root:"
      ls -la "$GITOPS_WORKDIR"

      echo
      echo "Top-level directories:"
      find "$GITOPS_WORKDIR" \
        -maxdepth 1 \
        -mindepth 1 \
        -type d \
        -print

      test "$(
        git -C "$GITOPS_WORKDIR" branch --show-current
      )" = "$GITOPS_BRANCH"

    # -------------------------------------------------------------------------
    # 14. Validate real GitOps architecture
    # -------------------------------------------------------------------------

    - |
      test -d "$GITOPS_WORKDIR/apps"
      test -d "$GITOPS_WORKDIR/workloads"

      echo
      echo "GitOps structure validated:"
      echo "  $GITOPS_WORKDIR/apps"
      echo "  $GITOPS_WORKDIR/workloads"

    # -------------------------------------------------------------------------
    # 15. Create Backend destination directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"

    # -------------------------------------------------------------------------
    # 16. Copy Backend Deployment
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/deployment.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 17. Copy Backend Service
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/service.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

    # -------------------------------------------------------------------------
    # 18. Copy Backend ServiceMonitor
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/servicemonitor.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/servicemonitor.yaml"

    # -------------------------------------------------------------------------
    # 19. Copy Backend workload Kustomization
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/kustomization.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 20. Copy Argo CD Application
    # -------------------------------------------------------------------------

    - |
      cp \
        "$BACKEND_SOURCE_PATH/application.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 21. Inject immutable image tag into GitOps Deployment
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Injecting Backend image tag:"
      echo "$CI_COMMIT_SHORT_SHA"

      sed -i \
        "s/__BACKEND_IMAGE_TAG__/${CI_COMMIT_SHORT_SHA}/g" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 22. Ensure placeholder has disappeared
    # -------------------------------------------------------------------------

    - |
      if grep -q \
        "__BACKEND_IMAGE_TAG__" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"; then

        echo
        echo "ERROR:"
        echo "Backend image placeholder remains in deployment.yaml."

        exit 1

      fi

      echo "Image placeholder replaced successfully."

    # -------------------------------------------------------------------------
    # 23. Validate immutable image reference
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Expected Backend image:"
      echo "$EXPECTED_IMAGE"

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 24. Validate Registry Secret reference after copy
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 25. Validate Backend workload Kustomization
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        > /tmp/real-estate-backend-rendered.yaml

      test -s \
        /tmp/real-estate-backend-rendered.yaml

      echo
      echo "Backend Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 26. Validate rendered workload contains Deployment
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: Deployment" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 27. Validate rendered workload contains Service
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: Service" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 28. Validate rendered workload contains ServiceMonitor
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: ServiceMonitor" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 29. Validate rendered resource name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 30. Validate rendered immutable image
    # -------------------------------------------------------------------------

    - |
      grep \
        "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 31. Validate rendered Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "$REGISTRY_PULL_SECRET" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 32. Validate Argo CD Application name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 33. Validate Argo CD Application workload path
    # -------------------------------------------------------------------------

    - |
      grep \
        "path: workloads/real-estate/backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 34. Validate Argo CD Application repository
    # -------------------------------------------------------------------------

    - |
      grep \
        "repoURL: https://gitlab.local/root/lab-gitops.git" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 35. Validate Argo CD Application branch
    # -------------------------------------------------------------------------

    - |
      grep \
        "targetRevision: main" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      echo
      echo "Backend Argo CD Application validation successful."

    # -------------------------------------------------------------------------
    # 36. Client-side Kubernetes validation
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/servicemonitor.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      echo
      echo "Kubernetes client-side manifest validation successful."

    # -------------------------------------------------------------------------
    # 37. Display final desired-state locations
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND GITOPS DESIRED STATE"
      echo "============================================================"

      echo
      echo "Workload directory:"
      echo "$GITOPS_BACKEND_PATH"

      echo
      echo "Application directory:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "Files:"
      find "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        -maxdepth 1 \
        -type f \
        -print

      find "$GITOPS_WORKDIR/$GITOPS_APP_PATH" \
        -maxdepth 1 \
        -type f \
        -print

    # -------------------------------------------------------------------------
    # 38. Display deployed image desired state
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Backend Deployment image:"

      grep \
        "image:" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 39. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" config \
        user.name \
        "chasse-immobiliere-ci"

      git -C "$GITOPS_WORKDIR" config \
        user.email \
        "gitlab-ci@lab.local"

    # -------------------------------------------------------------------------
    # 40. Stage Backend GitOps resources
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" add \
        "$GITOPS_BACKEND_PATH" \
        "$GITOPS_APP_PATH"

      echo
      echo "GitOps staged changes:"

      git -C "$GITOPS_WORKDIR" status \
        --short

    # -------------------------------------------------------------------------
    # 41. Commit and push only when desired state changed
    # -------------------------------------------------------------------------

    - |
      if git -C "$GITOPS_WORKDIR" diff --cached --quiet; then

        echo
        echo "No Backend GitOps changes detected."

      else

        echo
        echo "Creating Backend GitOps commit..."

        git -C "$GITOPS_WORKDIR" commit \
          -m "deploy: publish real-estate backend ${CI_COMMIT_SHORT_SHA}"

        echo
        echo "Pushing Backend GitOps commit to main..."

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git -C "$GITOPS_WORKDIR" push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "Backend GitOps publication completed."

      fi

    # -------------------------------------------------------------------------
    # 42. Final summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND + AI MATCHING PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Application source repository:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "Backend source manifests:"
      echo "$BACKEND_SOURCE_PATH"

      echo
      echo "Container image:"
      echo "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "AI runtime:"
      echo "src/ai deterministic matching packaged in Backend image"

      echo
      echo "Training runtime:"
      echo "requirements-ai-training.txt intentionally excluded from Backend image"

      echo
      echo "Registry pull Secret:"
      echo "real-estate/${REGISTRY_PULL_SECRET}"

      echo
      echo "GitOps repository:"
      echo "$GITOPS_REPOSITORY"

      echo
      echo "GitOps branch:"
      echo "$GITOPS_BRANCH"

      echo
      echo "GitOps workload:"
      echo "$GITOPS_BACKEND_PATH"

      echo
      echo "Argo CD Application:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "Argo root discovery:"
      echo "apps/ -> recursive directory discovery"

      echo
      echo "Permanent deployment:"
      echo "GitOps / Argo CD"

  after_script:
    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-backend-gitops
    - rm -f /tmp/real-estate-backend-rendered.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*

        - src/ai/**/*
        - tests/ai/**/*
        - requirements-ai.txt

        - tests/**/*
        - requirements-backend.txt

        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml