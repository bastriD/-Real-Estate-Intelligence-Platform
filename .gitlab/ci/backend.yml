# =============================================================================
# REAL ESTATE BACKEND / API
# =============================================================================
#
# Pipeline:
#
#   backend:validate
#          |
#          v
#   backend:build-image
#          |
#          v
#   GitLab Container Registry
#          |
#          v
#   backend:publish-gitops
#          |
#          +--> creates/updates registry pull secret from existing PAT
#          |
#          +--> workloads/real-estate/backend
#          |
#          +--> apps/real-estate-backend
#          |
#          v
#      lab-gitops
#          |
#          v
#       Argo CD
#          |
#          v
#   Kubernetes / real-estate
#
# Runtime image:
#
#   gitlab.local:4567/root/chasse_immobiliere/backend:<COMMIT_SHA>
#
# Permanent workload deployment is GitOps-driven.
# kubectl is used only for:
#
#   - validation
#   - Secret bootstrap/update
#
# The Deployment itself is NOT kubectl-applied by this pipeline.
# =============================================================================


# =============================================================================
# 1. VALIDATE BACKEND
# =============================================================================

backend:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    # Required only so Pydantic Settings can be instantiated during CI.
    # This is not a production credential.
    POSTGRES_PASSWORD: "ci-validation-only"

  before_script:
    - "python --version"
    - "pip --version"

    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend.txt

  script:
    # -------------------------------------------------------------------------
    # Validate expected project files
    # -------------------------------------------------------------------------

    - "test -f requirements-backend.txt"

    - "test -f src/api/main.py"
    - "test -f src/api/core/config.py"
    - "test -f src/api/db/session.py"
    - "test -f src/api/api/v1/router.py"
    - "test -f src/api/api/v1/endpoints/health.py"

    - "test -f deploy/docker/Dockerfile.backend"

    # -------------------------------------------------------------------------
    # Python syntax
    # -------------------------------------------------------------------------

    - |
      python -m py_compile \
        src/api/main.py \
        src/api/core/config.py \
        src/api/db/session.py \
        src/api/api/v1/router.py \
        src/api/api/v1/endpoints/health.py

    # -------------------------------------------------------------------------
    # Validate FastAPI application and generated OpenAPI contract
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      schema = app.openapi()

      paths = sorted(
          schema.get("paths", {}).keys()
      )

      print("OpenAPI routes:")

      for path in paths:
          print(f" - {path}")

      required_routes = {
          "/health",
          "/ready",
          "/api/v1/health",
          "/api/v1/ready",
      }

      missing_routes = required_routes.difference(paths)

      if missing_routes:
          raise RuntimeError(
              f"Missing required API routes: {sorted(missing_routes)}"
          )

      print("Backend OpenAPI validation successful.")
      PY

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'


# =============================================================================
# 2. BUILD BACKEND CONTAINER IMAGE
# =============================================================================

backend:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: backend:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    # -------------------------------------------------------------------------
    # Validate Docker runner
    # -------------------------------------------------------------------------

    - "docker version"

    # -------------------------------------------------------------------------
    # Authenticate to GitLab Registry
    # -------------------------------------------------------------------------

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # Build immutable + latest image
    # -------------------------------------------------------------------------

    - |
      echo "Building backend image..."

      docker build \
        -f deploy/docker/Dockerfile.backend \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # Validate actual Python version inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # Validate FastAPI import inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      print(
          "OpenAPI paths:",
          sorted(app.openapi().get("paths", {}).keys())
      )
      PY

    # -------------------------------------------------------------------------
    # Push immutable image
    # -------------------------------------------------------------------------

    - |
      echo "Publishing immutable backend image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # Push convenience latest tag
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    - |
      echo
      echo "Backend image publication completed."
      echo
      echo "Image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =============================================================================
# 3. PUBLISH BACKEND TO LAB-GITOPS
# =============================================================================

backend:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: backend:build-image
      artifacts: false

  variables:
    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"

    GITOPS_WORKDIR: "/tmp/chasse-backend-gitops"

    GITOPS_BACKEND_PATH: "workloads/real-estate/backend"

    GITOPS_APP_PATH: "apps/real-estate-backend"

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate required tools
    # -------------------------------------------------------------------------

    - "git --version"
    - "kubectl version --client"

    # -------------------------------------------------------------------------
    # 2. Validate Backend Kubernetes source manifests
    # -------------------------------------------------------------------------

    - "test -d deploy/kubernetes/backend"

    - "test -f deploy/kubernetes/backend/deployment.yaml"
    - "test -f deploy/kubernetes/backend/service.yaml"
    - "test -f deploy/kubernetes/backend/kustomization.yaml"
    - "test -f deploy/kubernetes/backend/application.yaml"

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes access
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        real-estate

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl -n real-estate get secret \
        real-estate-postgresql-secret

    # -------------------------------------------------------------------------
    # 5. Verify existing GitOps/PAT credentials
    #
    # Existing project Secret:
    #
    #   namespace: openmetadata
    #   secret:    lab-gitops-git-credentials
    #
    # Keys:
    #
    #   GIT_USERNAME
    #   GIT_TOKEN
    # -------------------------------------------------------------------------

    - |
      kubectl -n openmetadata get secret \
        lab-gitops-git-credentials

    # -------------------------------------------------------------------------
    # 6. Prepare temporary workspace
    # -------------------------------------------------------------------------

    - "rm -rf /tmp/chasse-backend-gitops"
    - "rm -f /tmp/.netrc"
    - "rm -f /tmp/real-estate-backend-rendered.yaml"

    # -------------------------------------------------------------------------
    # 7. Load PAT from existing Kubernetes Secret
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' \
        | base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' \
        | base64 -d
      )"

      test -n "${LAB_GITOPS_GIT_USER}"
      test -n "${LAB_GITOPS_GIT_TOKEN}"

      echo "GitOps/PAT credentials loaded."

    # -------------------------------------------------------------------------
    # 8. Create/update Registry pull Secret in real-estate namespace
    #
    # The PAT already used for GitOps is reused here.
    #
    # It therefore needs GitLab read_registry permission.
    #
    # No token is stored in the chasse_immobiliere repository.
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' \
        | base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' \
        | base64 -d
      )"

      kubectl \
        -n real-estate \
        create secret docker-registry \
        "${REGISTRY_PULL_SECRET}" \
        --docker-server="gitlab.local:4567" \
        --docker-username="${LAB_GITOPS_GIT_USER}" \
        --docker-password="${LAB_GITOPS_GIT_TOKEN}" \
        --dry-run=client \
        -o yaml |
      kubectl apply -f -

    # -------------------------------------------------------------------------
    # 9. Verify Registry Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        "${REGISTRY_PULL_SECRET}"

    # -------------------------------------------------------------------------
    # 10. Verify Deployment references the correct pull Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        deploy/kubernetes/backend/deployment.yaml

    # -------------------------------------------------------------------------
    # 11. Create .netrc for lab-gitops repository authentication
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' \
        | base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl -n openmetadata get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' \
        | base64 -d
      )"

      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc

    # -------------------------------------------------------------------------
    # 12. Clone lab-gitops
    # -------------------------------------------------------------------------

    - |
      echo "Cloning lab-gitops repository..."

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        "${GITOPS_REPOSITORY}" \
        "${GITOPS_WORKDIR}"

    # -------------------------------------------------------------------------
    # 13. Create GitOps workload directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}"

      mkdir -p \
        "${GITOPS_WORKDIR}/${GITOPS_APP_PATH}"

    # -------------------------------------------------------------------------
    # 14. Publish Backend Kubernetes workload
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/deployment.yaml \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"

      cp \
        deploy/kubernetes/backend/service.yaml \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/service.yaml"

      cp \
        deploy/kubernetes/backend/kustomization.yaml \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 15. Publish Backend Argo CD Application
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/application.yaml \
        "${GITOPS_WORKDIR}/${GITOPS_APP_PATH}/application.yaml"

    # -------------------------------------------------------------------------
    # 16. Inject immutable image tag
    #
    # Source manifest:
    #
    #   backend:__BACKEND_IMAGE_TAG__
    #
    # GitOps manifest:
    #
    #   backend:<CI_COMMIT_SHORT_SHA>
    # -------------------------------------------------------------------------

    - |
      echo "Injecting immutable Backend image tag:"
      echo "${CI_COMMIT_SHORT_SHA}"

      sed -i \
        "s/__BACKEND_IMAGE_TAG__/${CI_COMMIT_SHORT_SHA}/g" \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"

    # -------------------------------------------------------------------------
    # 17. Ensure placeholder no longer exists
    # -------------------------------------------------------------------------

    - |
      if grep -q \
        "__BACKEND_IMAGE_TAG__" \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"; then

        echo "ERROR: Backend image placeholder remains."

        exit 1
      fi

    # -------------------------------------------------------------------------
    # 18. Validate immutable image
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo "Expected Backend image:"
      echo "${EXPECTED_IMAGE}"

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"

    # -------------------------------------------------------------------------
    # 19. Validate Registry Secret reference
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"

    # -------------------------------------------------------------------------
    # 20. Validate Kubernetes manifests
    #
    # These commands are DRY RUNS.
    # They do NOT deploy Backend resources.
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/service.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "${GITOPS_WORKDIR}/${GITOPS_APP_PATH}/application.yaml" \
        > /dev/null

      echo "Backend Kubernetes manifest validation successful."

    # -------------------------------------------------------------------------
    # 21. Validate Kustomize rendering
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}" \
        > /tmp/real-estate-backend-rendered.yaml

      test -s \
        /tmp/real-estate-backend-rendered.yaml

      echo "Backend Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 22. Validate rendered objects
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "${REGISTRY_PULL_SECRET}" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 23. Display resulting Backend Deployment
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND DEPLOYMENT"
      echo "============================================================"

      cat \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/deployment.yaml"

    # -------------------------------------------------------------------------
    # 24. Display Backend Service
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND SERVICE"
      echo "============================================================"

      cat \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/service.yaml"

    # -------------------------------------------------------------------------
    # 25. Display Backend Kustomization
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND KUSTOMIZATION"
      echo "============================================================"

      cat \
        "${GITOPS_WORKDIR}/${GITOPS_BACKEND_PATH}/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 26. Display Argo CD Application
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "ARGO CD APPLICATION"
      echo "============================================================"

      cat \
        "${GITOPS_WORKDIR}/${GITOPS_APP_PATH}/application.yaml"

    # -------------------------------------------------------------------------
    # 27. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      cd "${GITOPS_WORKDIR}"

      git config \
        user.name \
        "chasse-immobiliere-ci"

      git config \
        user.email \
        "gitlab-ci@lab.local"

    # -------------------------------------------------------------------------
    # 28. Stage Backend GitOps resources
    # -------------------------------------------------------------------------

    - |
      cd "${GITOPS_WORKDIR}"

      git add \
        "${GITOPS_BACKEND_PATH}" \
        "${GITOPS_APP_PATH}"

      echo "GitOps status:"

      git status \
        --short

    # -------------------------------------------------------------------------
    # 29. Commit only when desired state changed
    # -------------------------------------------------------------------------

    - |
      cd "${GITOPS_WORKDIR}"

      if git diff --cached --quiet; then

        echo "No Backend GitOps changes detected."

      else

        git commit \
          -m "deploy: publish real-estate backend ${CI_COMMIT_SHORT_SHA}"

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git push \
          origin \
          main

        echo "Backend GitOps publication completed."

      fi

    # -------------------------------------------------------------------------
    # 30. Final summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Image:"
      echo "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Registry pull Secret:"
      echo "real-estate/${REGISTRY_PULL_SECRET}"

      echo
      echo "GitOps workload:"
      echo "${GITOPS_BACKEND_PATH}"

      echo
      echo "Argo CD application:"
      echo "${GITOPS_APP_PATH}"

  after_script:
    # -------------------------------------------------------------------------
    # Never leave PAT on the shell runner
    # -------------------------------------------------------------------------

    - "rm -f /tmp/.netrc"

    - "rm -rf /tmp/chasse-backend-gitops"

    - "rm -f /tmp/real-estate-backend-rendered.yaml"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*
        - tests/**/*
        - requirements-backend.txt
        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml