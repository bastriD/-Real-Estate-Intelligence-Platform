# =============================================================================
# REAL ESTATE BACKEND / API
# =============================================================================
#
# Architecture:
#
#   chasse_immobiliere repository
#          |
#          v
#   backend:validate
#          |
#          v
#   backend:build-image
#          |
#          v
#   GitLab Container Registry
#          |
#          v
#   backend:publish-gitops
#          |
#          +--> creates/updates:
#          |      real-estate/gitlab-registry-auth
#          |
#          +--> publishes:
#                 workloads/real-estate/backend/
#                 apps/real-estate-backend/application.yaml
#          |
#          v
#   lab-gitops/main
#          |
#          v
#   root-app
#     path: apps
#     directory.recurse: true
#          |
#          v
#   Argo CD Application:
#     real-estate-backend
#          |
#          v
#   workloads/real-estate/backend
#          |
#          v
#   Kubernetes namespace:
#     real-estate
#
# IMPORTANT:
#
# - apps/ is NOT Kustomize-based.
# - There is NO apps/kustomization.yaml.
# - root-app recursively discovers application manifests under apps/.
# - Backend workload deployment remains GitOps-driven.
# - kubectl is NOT used to directly deploy the Backend Deployment/Service.
#
# =============================================================================


# =============================================================================
# 1. VALIDATE BACKEND
# =============================================================================

backend:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    # Required only so Pydantic Settings can initialize during CI validation.
    # This is NOT a production credential.
    POSTGRES_PASSWORD: "ci-validation-only"

  before_script:
    - python --version
    - pip --version

    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend.txt

  script:
    # -------------------------------------------------------------------------
    # Validate expected project files
    # -------------------------------------------------------------------------

    - test -f requirements-backend.txt

    - test -f src/api/main.py
    - test -f src/api/core/config.py
    - test -f src/api/db/session.py
    - test -f src/api/api/v1/router.py
    - test -f src/api/api/v1/endpoints/health.py

    - test -f deploy/docker/Dockerfile.backend

    - test -f deploy/kubernetes/backend/deployment.yaml
    - test -f deploy/kubernetes/backend/service.yaml
    - test -f deploy/kubernetes/backend/kustomization.yaml
    - test -f deploy/kubernetes/backend/application.yaml

    # -------------------------------------------------------------------------
    # Python syntax validation
    # -------------------------------------------------------------------------

    - |
      python -m py_compile \
        src/api/main.py \
        src/api/core/config.py \
        src/api/db/session.py \
        src/api/api/v1/router.py \
        src/api/api/v1/endpoints/health.py

    # -------------------------------------------------------------------------
    # Validate FastAPI application and OpenAPI contract
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      schema = app.openapi()
      paths = sorted(schema.get("paths", {}).keys())

      print("OpenAPI routes:")

      for path in paths:
          print(f" - {path}")

      required_routes = {
          "/health",
          "/ready",
          "/api/v1/health",
          "/api/v1/ready",
      }

      missing_routes = required_routes.difference(paths)

      if missing_routes:
          raise RuntimeError(
              f"Missing required API routes: {sorted(missing_routes)}"
          )

      print("Backend OpenAPI validation successful.")
      PY

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'


# =============================================================================
# 2. BUILD AND PUBLISH BACKEND IMAGE
# =============================================================================

backend:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: backend:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    # -------------------------------------------------------------------------
    # Validate Docker runner
    # -------------------------------------------------------------------------

    - docker version

    # -------------------------------------------------------------------------
    # Authenticate to GitLab Container Registry
    # -------------------------------------------------------------------------

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # Build immutable Backend image + latest convenience tag
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BUILDING REAL ESTATE BACKEND"
      echo "============================================================"

      docker build \
        -f deploy/docker/Dockerfile.backend \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # Validate Python runtime inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # Validate FastAPI application import inside image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; print('Application:', app.title); print('Version:', app.version)"

    # -------------------------------------------------------------------------
    # Validate expected API routes inside final image
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; paths=set(app.openapi().get('paths', {}).keys()); required={'/health','/ready','/api/v1/health','/api/v1/ready'}; missing=required-paths; print('OpenAPI paths:', sorted(paths)); assert not missing, f'Missing routes: {sorted(missing)}'"

    # -------------------------------------------------------------------------
    # Push immutable commit image
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Publishing immutable Backend image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # Push latest convenience tag
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    # -------------------------------------------------------------------------
    # Image publication summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND IMAGE PUBLISHED"
      echo "============================================================"
      echo
      echo "Image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =============================================================================
# 3. PUBLISH BACKEND DESIRED STATE TO LAB-GITOPS
# =============================================================================

backend:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: backend:build-image
      artifacts: false

  variables:
    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    GITOPS_WORKDIR: "/tmp/chasse-backend-gitops"

    GITOPS_BACKEND_PATH: "workloads/real-estate/backend"
    GITOPS_APP_PATH: "apps/real-estate-backend"

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate shell runner tools
    # -------------------------------------------------------------------------

    - git --version
    - kubectl version --client

    # -------------------------------------------------------------------------
    # 2. Validate source manifests
    # -------------------------------------------------------------------------

    - test -f deploy/kubernetes/backend/deployment.yaml
    - test -f deploy/kubernetes/backend/service.yaml
    - test -f deploy/kubernetes/backend/kustomization.yaml
    - test -f deploy/kubernetes/backend/application.yaml

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes namespace
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        real-estate

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL runtime Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        real-estate-postgresql-secret

    # -------------------------------------------------------------------------
    # 5. Validate existing GitOps credentials Secret
    #
    # Existing project Secret:
    #
    #   namespace: openmetadata
    #   name:      lab-gitops-git-credentials
    #
    # Keys:
    #
    #   GIT_USERNAME
    #   GIT_TOKEN
    #
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials

    # -------------------------------------------------------------------------
    # 6. Clean temporary workspace
    # -------------------------------------------------------------------------

    - rm -rf "$GITOPS_WORKDIR"
    - rm -f /tmp/.netrc
    - rm -f /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 7. Load GitOps PAT
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "$LAB_GITOPS_GIT_USER"
      test -n "$LAB_GITOPS_GIT_TOKEN"

      echo "GitOps/PAT credentials loaded."

    # -------------------------------------------------------------------------
    # 8. Create/update private Registry pull Secret
    #
    # This is operational Secret bootstrap.
    #
    # The PAT is NEVER committed to Git.
    #
    # PAT requires read_registry permission.
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        create secret docker-registry \
        "$REGISTRY_PULL_SECRET" \
        --docker-server="gitlab.local:4567" \
        --docker-username="$LAB_GITOPS_GIT_USER" \
        --docker-password="$LAB_GITOPS_GIT_TOKEN" \
        --dry-run=client \
        -o yaml |
      kubectl apply -f -

    # -------------------------------------------------------------------------
    # 9. Verify Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        "$REGISTRY_PULL_SECRET"

    # -------------------------------------------------------------------------
    # 10. Verify Backend Deployment references correct pull Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        deploy/kubernetes/backend/deployment.yaml

    # -------------------------------------------------------------------------
    # 11. Create temporary .netrc
    #
    # Same authentication mechanism already used by the project.
    # -------------------------------------------------------------------------

    - |
      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc

    # -------------------------------------------------------------------------
    # 12. Clone EXACT GitOps branch used by Argo CD
    #
    # Verified runtime configuration:
    #
    #   repoURL:        https://gitlab.local/root/lab-gitops.git
    #   targetRevision: main
    #   root path:      apps
    #   recurse:        true
    #
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Cloning lab-gitops repository..."

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"

    # -------------------------------------------------------------------------
    # 13. Verify GitOps checkout
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      echo
      echo "============================================================"
      echo "GITOPS REPOSITORY"
      echo "============================================================"

      echo
      echo "Branch:"
      git branch --show-current

      echo
      echo "Revision:"
      git rev-parse --short HEAD

      test "$(git branch --show-current)" = "$GITOPS_BRANCH"

    # -------------------------------------------------------------------------
    # 14. Validate actual GitOps repository structure
    #
    # apps/ is recursively scanned by root-app.
    #
    # DO NOT require apps/kustomization.yaml.
    # It intentionally does not exist.
    # -------------------------------------------------------------------------

    - |
      test -d "$GITOPS_WORKDIR/apps"
      test -d "$GITOPS_WORKDIR/workloads"

      echo
      echo "GitOps structure validated:"
      echo "  apps/"
      echo "  workloads/"

    # -------------------------------------------------------------------------
    # 15. Create Backend desired-state directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"

    # -------------------------------------------------------------------------
    # 16. Publish Backend workload manifests
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/deployment.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

      cp \
        deploy/kubernetes/backend/service.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

      cp \
        deploy/kubernetes/backend/kustomization.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 17. Publish Backend Argo CD Application
    #
    # root-app recursively discovers this file automatically:
    #
    #   apps/real-estate-backend/application.yaml
    #
    # No parent Kustomization registration is required.
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/application.yaml \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 18. Inject immutable Backend image tag
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Injecting immutable Backend image tag:"
      echo "$CI_COMMIT_SHORT_SHA"

      sed -i \
        "s/__BACKEND_IMAGE_TAG__/${CI_COMMIT_SHORT_SHA}/g" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 19. Ensure image placeholder no longer exists
    # -------------------------------------------------------------------------

    - |
      if grep -q \
        "__BACKEND_IMAGE_TAG__" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"; then

        echo "ERROR: Backend image placeholder remains."

        exit 1

      fi

    # -------------------------------------------------------------------------
    # 20. Validate immutable image reference
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Expected Backend image:"
      echo "$EXPECTED_IMAGE"

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 21. Validate Registry Secret reference
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 22. Validate Backend workload using Kustomize
    #
    # ONLY workload path uses Kustomize.
    #
    # apps/ does NOT.
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        > /tmp/real-estate-backend-rendered.yaml

      test -s \
        /tmp/real-estate-backend-rendered.yaml

      echo "Backend Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 23. Validate rendered Backend resources
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: Deployment" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "kind: Service" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "$REGISTRY_PULL_SECRET" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 24. Validate Argo CD Application definition
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "path: workloads/real-estate/backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "repoURL: https://gitlab.local/root/lab-gitops.git" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "targetRevision: main" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      echo "Backend Argo CD Application validation successful."

    # -------------------------------------------------------------------------
    # 25. Kubernetes client-side manifest validation
    #
    # DRY RUN ONLY.
    #
    # Backend deployment remains managed by Argo CD.
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      echo "Backend Kubernetes manifests validated."

    # -------------------------------------------------------------------------
    # 26. Display desired-state summary before commit
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND GITOPS DESIRED STATE"
      echo "============================================================"

      echo
      echo "Deployment:"
      grep \
        -E "name: real-estate-backend|image:" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

      echo
      echo "Service:"
      grep \
        -E "name: real-estate-backend|port: 8000" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

      echo
      echo "Application:"
      grep \
        -E "name: real-estate-backend|path: workloads/real-estate/backend" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 27. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      git config \
        user.name \
        "chasse-immobiliere-ci"

      git config \
        user.email \
        "gitlab-ci@lab.local"

    # -------------------------------------------------------------------------
    # 28. Stage only Backend desired-state resources
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      git add \
        "$GITOPS_BACKEND_PATH" \
        "$GITOPS_APP_PATH"

      echo
      echo "GitOps status:"

      git status \
        --short

    # -------------------------------------------------------------------------
    # 29. Commit and push only if desired state changed
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      if git diff --cached --quiet; then

        echo
        echo "No Backend GitOps changes detected."

      else

        git commit \
          -m "deploy: publish real-estate backend ${CI_COMMIT_SHORT_SHA}"

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "Backend GitOps publication completed."

      fi

    # -------------------------------------------------------------------------
    # 30. Final publication summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Image:"
      echo "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Registry pull Secret:"
      echo "real-estate/${REGISTRY_PULL_SECRET}"

      echo
      echo "GitOps repository:"
      echo "${GITOPS_REPOSITORY}"

      echo
      echo "GitOps branch:"
      echo "${GITOPS_BRANCH}"

      echo
      echo "GitOps workload:"
      echo "${GITOPS_BACKEND_PATH}"

      echo
      echo "Argo CD Application:"
      echo "${GITOPS_APP_PATH}"

      echo
      echo "Discovery model:"
      echo "root-app -> apps/ -> recursive directory discovery"

  after_script:
    # -------------------------------------------------------------------------
    # Remove temporary credentials and working files
    # -------------------------------------------------------------------------

    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-backend-gitops
    - rm -f /tmp/real-estate-backend-rendered.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*
        - tests/**/*
        - requirements-backend.txt
        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml