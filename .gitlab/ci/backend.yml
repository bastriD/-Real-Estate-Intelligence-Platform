# =============================================================================
# REAL ESTATE BACKEND / API
# =============================================================================
#
# CI/CD flow:
#
#   backend:validate
#          |
#          v
#   backend:build-image
#          |
#          v
#   GitLab Container Registry
#          |
#          v
#   backend:publish-gitops
#          |
#          +--> real-estate/gitlab-registry-auth
#          |
#          +--> lab-gitops/workloads/real-estate/backend
#          |
#          +--> lab-gitops/apps/real-estate-backend
#          |
#          +--> apps/kustomization.yaml registration
#          |
#          v
#       root-app
#          |
#          v
#   real-estate-backend Argo CD Application
#          |
#          v
#   Kubernetes namespace real-estate
#
# =============================================================================


# =============================================================================
# 1. VALIDATE BACKEND
# =============================================================================

backend:validate:
  stage: validate

  tags:
    - docker

  image: python:3.12-slim

  variables:
    POSTGRES_PASSWORD: "ci-validation-only"

  before_script:
    - python --version
    - pip --version

    - |
      pip install \
        --no-cache-dir \
        -r requirements-backend.txt

  script:
    # -------------------------------------------------------------------------
    # Validate expected files
    # -------------------------------------------------------------------------

    - test -f requirements-backend.txt

    - test -f src/api/main.py
    - test -f src/api/core/config.py
    - test -f src/api/db/session.py
    - test -f src/api/api/v1/router.py
    - test -f src/api/api/v1/endpoints/health.py

    - test -f deploy/docker/Dockerfile.backend

    # -------------------------------------------------------------------------
    # Python syntax
    # -------------------------------------------------------------------------

    - |
      python -m py_compile \
        src/api/main.py \
        src/api/core/config.py \
        src/api/db/session.py \
        src/api/api/v1/router.py \
        src/api/api/v1/endpoints/health.py

    # -------------------------------------------------------------------------
    # Validate FastAPI/OpenAPI
    # -------------------------------------------------------------------------

    - |
      python - <<'PY'
      from src.api.main import app

      print("Application:", app.title)
      print("Version:", app.version)

      schema = app.openapi()
      paths = sorted(schema.get("paths", {}).keys())

      print("OpenAPI routes:")

      for path in paths:
          print(f" - {path}")

      required_routes = {
          "/health",
          "/ready",
          "/api/v1/health",
          "/api/v1/ready",
      }

      missing_routes = required_routes.difference(paths)

      if missing_routes:
          raise RuntimeError(
              f"Missing required API routes: {sorted(missing_routes)}"
          )

      print("Backend OpenAPI validation successful.")
      PY

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'


# =============================================================================
# 2. BUILD BACKEND IMAGE
# =============================================================================

backend:build-image:
  stage: build

  tags:
    - docker

  needs:
    - job: backend:validate
      artifacts: false

  image: docker:27.5.1

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

    IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    # -------------------------------------------------------------------------
    # Validate Docker
    # -------------------------------------------------------------------------

    - docker version

    # -------------------------------------------------------------------------
    # Login to GitLab Container Registry
    # -------------------------------------------------------------------------

    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

  script:
    # -------------------------------------------------------------------------
    # Build image
    # -------------------------------------------------------------------------

    - |
      echo "Building Real Estate Backend image..."

      docker build \
        -f deploy/docker/Dockerfile.backend \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        -t "$IMAGE_NAME:latest" \
        .

    # -------------------------------------------------------------------------
    # Validate runtime Python
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python --version

    # -------------------------------------------------------------------------
    # Validate FastAPI application inside container
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; print('Application:', app.title); print('Version:', app.version)"

    # -------------------------------------------------------------------------
    # Validate routes inside container
    # -------------------------------------------------------------------------

    - |
      docker run \
        --rm \
        -e POSTGRES_PASSWORD=ci-image-validation-only \
        "$IMAGE_NAME:$IMAGE_TAG" \
        python -c \
        "from src.api.main import app; print('OpenAPI paths:', sorted(app.openapi().get('paths', {}).keys()))"

    # -------------------------------------------------------------------------
    # Push immutable image
    # -------------------------------------------------------------------------

    - |
      echo "Publishing Backend image:"
      echo "$IMAGE_NAME:$IMAGE_TAG"

      docker push \
        "$IMAGE_NAME:$IMAGE_TAG"

    # -------------------------------------------------------------------------
    # Push latest
    # -------------------------------------------------------------------------

    - |
      docker push \
        "$IMAGE_NAME:latest"

    # -------------------------------------------------------------------------
    # Summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND IMAGE PUBLISHED"
      echo "============================================================"
      echo
      echo "$IMAGE_NAME:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# =============================================================================
# 3. PUBLISH BACKEND TO LAB-GITOPS
# =============================================================================

backend:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: backend:build-image
      artifacts: false

  variables:
    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    GITOPS_WORKDIR: "/tmp/chasse-backend-gitops"

    GITOPS_BACKEND_PATH: "workloads/real-estate/backend"
    GITOPS_APP_PATH: "apps/real-estate-backend"

    REGISTRY_PULL_SECRET: "gitlab-registry-auth"

  script:
    # -------------------------------------------------------------------------
    # 1. Validate shell runner
    # -------------------------------------------------------------------------

    - git --version
    - kubectl version --client

    # -------------------------------------------------------------------------
    # 2. Validate source manifests
    # -------------------------------------------------------------------------

    - test -d deploy/kubernetes/backend

    - test -f deploy/kubernetes/backend/deployment.yaml
    - test -f deploy/kubernetes/backend/service.yaml
    - test -f deploy/kubernetes/backend/kustomization.yaml
    - test -f deploy/kubernetes/backend/application.yaml

    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes access
    # -------------------------------------------------------------------------

    - |
      kubectl get namespace \
        real-estate

    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        real-estate-postgresql-secret

    # -------------------------------------------------------------------------
    # 5. Validate existing GitOps PAT Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials

    # -------------------------------------------------------------------------
    # 6. Clean temporary workspace
    # -------------------------------------------------------------------------

    - rm -rf "$GITOPS_WORKDIR"
    - rm -f /tmp/.netrc
    - rm -f /tmp/real-estate-backend-rendered.yaml
    - rm -f /tmp/real-estate-apps-rendered.yaml

    # -------------------------------------------------------------------------
    # 7. Read PAT from existing Kubernetes Secret
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "${LAB_GITOPS_GIT_USER}"
      test -n "${LAB_GITOPS_GIT_TOKEN}"

      echo "GitOps/PAT credentials loaded."

    # -------------------------------------------------------------------------
    # 8. Create/update GitLab Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      kubectl \
        -n real-estate \
        create secret docker-registry \
        "${REGISTRY_PULL_SECRET}" \
        --docker-server="gitlab.local:4567" \
        --docker-username="${LAB_GITOPS_GIT_USER}" \
        --docker-password="${LAB_GITOPS_GIT_TOKEN}" \
        --dry-run=client \
        -o yaml |
      kubectl apply -f -

    # -------------------------------------------------------------------------
    # 9. Verify Registry pull Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n real-estate \
        get secret \
        "${REGISTRY_PULL_SECRET}"

    # -------------------------------------------------------------------------
    # 10. Verify source Deployment uses correct Registry Secret
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        deploy/kubernetes/backend/deployment.yaml

    # -------------------------------------------------------------------------
    # 11. Create temporary .netrc
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc

    # -------------------------------------------------------------------------
    # 12. Clone EXACT Argo CD branch
    #
    # root-app is configured with:
    #
    #   repoURL:        https://gitlab.local/root/lab-gitops.git
    #   targetRevision: main
    #   path:           apps
    #
    # So CI must explicitly work against main.
    # -------------------------------------------------------------------------

    - |
      echo "Cloning lab-gitops repository..."

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"

    # -------------------------------------------------------------------------
    # 13. Diagnose cloned repository
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      echo
      echo "============================================================"
      echo "GITOPS REPOSITORY DIAGNOSTICS"
      echo "============================================================"

      echo
      echo "Current branch:"
      git branch --show-current

      echo
      echo "Current revision:"
      git rev-parse --short HEAD

      echo
      echo "Repository root:"
      ls -la

      echo
      echo "Top-level directories:"
      find . \
        -maxdepth 1 \
        -mindepth 1 \
        -type d \
        -print

    # -------------------------------------------------------------------------
    # 14. Validate apps path used by root-app
    # -------------------------------------------------------------------------

    - |
      if [ ! -d "$GITOPS_WORKDIR/apps" ]; then

        echo
        echo "ERROR:"
        echo "The main branch of lab-gitops does not contain apps/."
        echo
        echo "Argo CD root-app is configured with:"
        echo "  repoURL: $GITOPS_REPOSITORY"
        echo "  targetRevision: $GITOPS_BRANCH"
        echo "  path: apps"
        echo
        echo "Repository contents:"
        find "$GITOPS_WORKDIR" \
          -maxdepth 2 \
          -type f \
          -o -type d

        exit 1

      fi

      echo "apps/ directory exists."

    # -------------------------------------------------------------------------
    # 15. Display apps contents
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CURRENT APPS DIRECTORY"
      echo "============================================================"

      find "$GITOPS_WORKDIR/apps" \
        -maxdepth 2 \
        -print

    # -------------------------------------------------------------------------
    # 16. Validate/create root apps Kustomization
    #
    # Normally it should already exist because root-app is Synced/Healthy.
    # We do not silently invent a different GitOps structure.
    # -------------------------------------------------------------------------

    - |
      if [ ! -f "$GITOPS_WORKDIR/apps/kustomization.yaml" ]; then

        echo
        echo "ERROR:"
        echo "apps/kustomization.yaml does not exist."
        echo
        echo "The existing root-app GitOps structure must be inspected before"
        echo "publishing the Backend Application."

        exit 1

      fi

      echo
      echo "Current apps/kustomization.yaml:"
      cat "$GITOPS_WORKDIR/apps/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 17. Create Backend GitOps directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"

    # -------------------------------------------------------------------------
    # 18. Copy Backend workload manifests
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/deployment.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

      cp \
        deploy/kubernetes/backend/service.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

      cp \
        deploy/kubernetes/backend/kustomization.yaml \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 19. Copy Backend Argo CD Application
    # -------------------------------------------------------------------------

    - |
      cp \
        deploy/kubernetes/backend/application.yaml \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 20. Register Backend Application in apps/kustomization.yaml
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      if ! grep -qE \
        '^[[:space:]]*-[[:space:]]*real-estate-backend/?[[:space:]]*$' \
        apps/kustomization.yaml; then

        echo "Registering real-estate-backend in apps/kustomization.yaml..."

        printf '\n  - real-estate-backend\n' \
          >> apps/kustomization.yaml

      else

        echo "real-estate-backend already registered."

      fi

      echo
      echo "Updated apps/kustomization.yaml:"
      cat apps/kustomization.yaml

    # -------------------------------------------------------------------------
    # 21. Inject immutable image tag
    # -------------------------------------------------------------------------

    - |
      echo "Injecting Backend image tag:"
      echo "${CI_COMMIT_SHORT_SHA}"

      sed -i \
        "s/__BACKEND_IMAGE_TAG__/${CI_COMMIT_SHORT_SHA}/g" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 22. Ensure placeholder has disappeared
    # -------------------------------------------------------------------------

    - |
      if grep -q \
        "__BACKEND_IMAGE_TAG__" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"; then

        echo "ERROR: Backend image placeholder remains."

        exit 1

      fi

    # -------------------------------------------------------------------------
    # 23. Validate immutable image reference
    # -------------------------------------------------------------------------

    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo "Expected Backend image:"
      echo "$EXPECTED_IMAGE"

      grep \
        "image: ${EXPECTED_IMAGE}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 24. Validate pull Secret reference
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${REGISTRY_PULL_SECRET}" \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 25. Render Backend workload Kustomization
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH" \
        > /tmp/real-estate-backend-rendered.yaml

      test -s \
        /tmp/real-estate-backend-rendered.yaml

      echo "Backend Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 26. Render root apps Kustomization
    # -------------------------------------------------------------------------

    - |
      kubectl kustomize \
        "$GITOPS_WORKDIR/apps" \
        > /tmp/real-estate-apps-rendered.yaml

      test -s \
        /tmp/real-estate-apps-rendered.yaml

      echo "Root apps Kustomize rendering successful."

    # -------------------------------------------------------------------------
    # 27. Validate rendered Backend workload
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
        /tmp/real-estate-backend-rendered.yaml

      grep \
        "${REGISTRY_PULL_SECRET}" \
        /tmp/real-estate-backend-rendered.yaml

    # -------------------------------------------------------------------------
    # 28. Validate rendered Argo CD Application
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-backend" \
        /tmp/real-estate-apps-rendered.yaml

      grep \
        "workloads/real-estate/backend" \
        /tmp/real-estate-apps-rendered.yaml

      echo "Backend Argo CD Application rendering successful."

    # -------------------------------------------------------------------------
    # 29. Kubernetes client-side validation
    #
    # DRY RUN ONLY.
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml" \
        > /dev/null

      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      echo "Backend Kubernetes manifest validation successful."

    # -------------------------------------------------------------------------
    # 30. Display resulting Backend Deployment
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND DEPLOYMENT"
      echo "============================================================"

      cat \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/deployment.yaml"

    # -------------------------------------------------------------------------
    # 31. Display Backend Service
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND SERVICE"
      echo "============================================================"

      cat \
        "$GITOPS_WORKDIR/$GITOPS_BACKEND_PATH/service.yaml"

    # -------------------------------------------------------------------------
    # 32. Display Backend Argo CD Application
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND ARGO CD APPLICATION"
      echo "============================================================"

      cat \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

    # -------------------------------------------------------------------------
    # 33. Display final root apps Kustomization
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "ROOT APPS KUSTOMIZATION"
      echo "============================================================"

      cat \
        "$GITOPS_WORKDIR/apps/kustomization.yaml"

    # -------------------------------------------------------------------------
    # 34. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      git config \
        user.name \
        "chasse-immobiliere-ci"

      git config \
        user.email \
        "gitlab-ci@lab.local"

    # -------------------------------------------------------------------------
    # 35. Stage Backend resources
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      git add \
        "$GITOPS_BACKEND_PATH" \
        "$GITOPS_APP_PATH" \
        apps/kustomization.yaml

      echo
      echo "GitOps status:"

      git status \
        --short

    # -------------------------------------------------------------------------
    # 36. Commit and push only when changed
    # -------------------------------------------------------------------------

    - |
      cd "$GITOPS_WORKDIR"

      if git diff --cached --quiet; then

        echo "No Backend GitOps changes detected."

      else

        git commit \
          -m "deploy: publish real-estate backend ${CI_COMMIT_SHORT_SHA}"

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "Backend GitOps publication completed."

      fi

    # -------------------------------------------------------------------------
    # 37. Final summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "BACKEND PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Image:"
      echo "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"

      echo
      echo "Registry pull Secret:"
      echo "real-estate/${REGISTRY_PULL_SECRET}"

      echo
      echo "GitOps repository:"
      echo "${GITOPS_REPOSITORY}"

      echo
      echo "GitOps branch:"
      echo "${GITOPS_BRANCH}"

      echo
      echo "GitOps workload:"
      echo "${GITOPS_BACKEND_PATH}"

      echo
      echo "Argo CD application:"
      echo "${GITOPS_APP_PATH}"

      echo
      echo "Root registration:"
      echo "apps/kustomization.yaml -> real-estate-backend"

  after_script:
    # -------------------------------------------------------------------------
    # Remove credentials and temporary files
    # -------------------------------------------------------------------------

    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-backend-gitops
    - rm -f /tmp/real-estate-backend-rendered.yaml
    - rm -f /tmp/real-estate-apps-rendered.yaml

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*
        - tests/**/*
        - requirements-backend.txt
        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab-ci.yml