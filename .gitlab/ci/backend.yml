# Job configuration only; implementation lives in scripts/ci/.
backend:validate:
  stage: validate
  tags:
    - docker
  image: python:3.12-slim
  variables:
    POSTGRES_PASSWORD: ci-validation-only
    JWT_SECRET_KEY: ci-validation-jwt-secret-only
  before_script:
    - python --version
    - pip --version
    - |
      pip install \
        --no-cache-dir \
        -r requirements-ai.txt
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/backend/validate.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID

backend:build-image:
  resource_group: backend-build-image
  stage: build
  tags:
    - docker
  needs:
    - job: backend:validate
      artifacts: false
    - job: backend:tests
      artifacts: false
    - job: ai:validate
      artifacts: false
    - job: pipeline:validate
      artifacts: false
      optional: true
  image: docker:27.5.1
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    IMAGE_NAME: $CI_REGISTRY_IMAGE/backend
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - docker version
    - |
      echo "$CI_REGISTRY_PASSWORD" |
        docker login \
          "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/backend/build-image.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend:publish-gitops:
  resource_group: lab-gitops-main
  stage: deploy
  tags:
    - shell
  needs:
    - job: backend:build-image
      artifacts: false
  variables:
    GITOPS_REPOSITORY: https://gitlab.local/root/lab-gitops.git
    GITOPS_BRANCH: main
    GITOPS_WORKDIR: ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-backend-gitops
    BACKEND_SOURCE_PATH: $CI_PROJECT_DIR/deploy/kubernetes/backend
    GITOPS_BACKEND_PATH: workloads/real-estate/backend
    GITOPS_APP_PATH: apps/real-estate-backend
    REGISTRY_PULL_SECRET: gitlab-registry-auth
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/backend/publish-gitops.sh"
  after_script:
    - rm -rf ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-backend-gitops
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-backend-rendered.yaml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/api/**/*
        - src/domain/**/*
        - src/services/**/*
        - src/ai/**/*
        - tests/ai/**/*
        - requirements-ai.txt
        - tests/**/*
        - requirements-backend.txt
        - requirements-backend-test.txt
        - deploy/docker/Dockerfile.backend
        - deploy/kubernetes/backend/**/*
        - .gitlab/ci/backend.yml
        - .gitlab/ci/backend-tests.yml
        - scripts/ci/**/*
        - .gitlab-ci.yml
