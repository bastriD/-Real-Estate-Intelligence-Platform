# Job configuration only; implementation lives in scripts/ci/.
airflow:publish-dags:
  resource_group: airflow-dags-main
  stage: deploy
  tags:
    - shell
  needs:
    - job: data-pipeline:build-image
      artifacts: true
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/airflow/publish-dags.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
