# =============================================================================
# REAL ESTATE PCA / PRA - POSTGRESQL BACKUP
# =============================================================================
#
# PURPOSE
#
#   - Validate PostgreSQL backup CronJob manifests.
#   - Validate required PostgreSQL and MinIO backup Secrets.
#   - Publish permanent PRA desired state to lab-gitops.
#   - Let Argo CD deploy and reconcile the backup CronJob asynchronously.
#
# DEPLOYMENT FLOW
#
#   deploy/kubernetes/pra/
#          |
#          v
#   pra:publish-gitops
#          |
#          v
#   lab-gitops
#     workloads/real-estate/pra
#     apps/real-estate-pra
#          |
#          v
#   Argo CD root-app
#     repo: https://gitlab.local/root/lab-gitops.git
#     branch: main
#     path: apps
#     directory.recurse: true
#          |
#          v
#   Argo CD Application real-estate-pra
#          |
#          v
#   Kubernetes namespace real-estate
#          |
#          v
#   CronJob real-estate-postgresql-backup
#
# IMPORTANT
#
# - This is a PERMANENT workload.
# - Deployment is GitOps-driven.
# - GitLab CI does NOT directly apply the CronJob.
# - GitLab CI does NOT wait for Argo CD reconciliation.
# - Argo CD reconciliation is asynchronous.
# - kubectl is used here only for validation and dependency checks.
# - PostgreSQL credentials remain in:
#       real-estate-postgresql-secret
# - MinIO credentials remain in:
#       real-estate-backup-s3
# - Secret values are NOT committed to Git.
#
# =============================================================================


# =============================================================================
# 1. PUBLISH PRA DESIRED STATE TO LAB-GITOPS
# =============================================================================

pra:publish-gitops:
  stage: deploy

  tags:
    - shell

  needs:
    - job: database:validate
      artifacts: false

  variables:
    # -------------------------------------------------------------------------
    # Kubernetes
    # -------------------------------------------------------------------------

    K8S_NAMESPACE: "real-estate"

    POSTGRES_SECRET: "real-estate-postgresql-secret"
    BACKUP_S3_SECRET: "real-estate-backup-s3"

    CRONJOB_NAME: "real-estate-postgresql-backup"

    # -------------------------------------------------------------------------
    # Source repository
    # -------------------------------------------------------------------------

    PRA_SOURCE_PATH: "$CI_PROJECT_DIR/deploy/kubernetes/pra"

    # -------------------------------------------------------------------------
    # GitOps repository
    # -------------------------------------------------------------------------

    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    GITOPS_WORKDIR: "/tmp/chasse-pra-gitops"

    GITOPS_PRA_PATH: "workloads/real-estate/pra"
    GITOPS_APP_PATH: "apps/real-estate-pra"

    # -------------------------------------------------------------------------
    # Temporary validation file
    # -------------------------------------------------------------------------

    PRA_RENDERED_PATH: "/tmp/real-estate-pra-rendered.yaml"

  script:

    # -------------------------------------------------------------------------
    # 1. Validate shell runner tooling
    # -------------------------------------------------------------------------

    - git --version
    - kubectl version --client


    # -------------------------------------------------------------------------
    # 2. Validate PRA source repository
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "PRA SOURCE VALIDATION"
      echo "============================================================"

      echo
      echo "CI project directory:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "PRA source path:"
      echo "$PRA_SOURCE_PATH"

      test -d "$PRA_SOURCE_PATH"

      test -f "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"
      test -f "$PRA_SOURCE_PATH/kustomization.yaml"
      test -f "$PRA_SOURCE_PATH/application.yaml"

      echo
      echo "PRA source manifests found."

      find "$PRA_SOURCE_PATH" \
        -maxdepth 1 \
        -type f \
        -print


    # -------------------------------------------------------------------------
    # 3. Validate Kubernetes namespace
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "KUBERNETES DEPENDENCY VALIDATION"
      echo "============================================================"

      kubectl get namespace \
        "$K8S_NAMESPACE"


    # -------------------------------------------------------------------------
    # 4. Validate PostgreSQL Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$POSTGRES_SECRET"

      echo
      echo "PostgreSQL Secret exists."


    # -------------------------------------------------------------------------
    # 5. Validate MinIO backup Secret
    # -------------------------------------------------------------------------

    - |
      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$BACKUP_S3_SECRET"

      echo
      echo "MinIO backup Secret exists."


    # -------------------------------------------------------------------------
    # 6. Validate required PostgreSQL Secret keys
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Validating PostgreSQL Secret keys..."

      for KEY in \
        POSTGRES_DB \
        POSTGRES_HOST \
        POSTGRES_PASSWORD \
        POSTGRES_PORT \
        POSTGRES_USER
      do

        VALUE="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get secret \
            "$POSTGRES_SECRET" \
            -o "jsonpath={.data.${KEY}}" \
            2>/dev/null || true
        )"

        if [ -z "$VALUE" ]; then
          echo "ERROR: missing PostgreSQL Secret key: $KEY"
          exit 1
        fi

        echo " - $KEY: present"

      done

      echo
      echo "PostgreSQL Secret key validation successful."


    # -------------------------------------------------------------------------
    # 7. Validate required MinIO Secret keys
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Validating backup S3 Secret keys..."

      for KEY in \
        AWS_ACCESS_KEY_ID \
        AWS_ENDPOINT_URL \
        AWS_SECRET_ACCESS_KEY \
        S3_BUCKET
      do

        VALUE="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get secret \
            "$BACKUP_S3_SECRET" \
            -o "jsonpath={.data.${KEY}}" \
            2>/dev/null || true
        )"

        if [ -z "$VALUE" ]; then
          echo "ERROR: missing backup S3 Secret key: $KEY"
          exit 1
        fi

        echo " - $KEY: present"

      done

      echo
      echo "Backup S3 Secret key validation successful."


    # -------------------------------------------------------------------------
    # 8. Validate CronJob Secret references
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "PRA CRONJOB SOURCE CHECKS"
      echo "============================================================"

      grep \
        "name: ${POSTGRES_SECRET}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "name: ${BACKUP_S3_SECRET}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "Expected Secret references found."


    # -------------------------------------------------------------------------
    # 9. Validate CronJob resource name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "CronJob name validated."


    # -------------------------------------------------------------------------
    # 10. Validate PostgreSQL image
    # -------------------------------------------------------------------------

    - |
      grep \
        "image: postgres:16" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "PostgreSQL image validated."


    # -------------------------------------------------------------------------
    # 11. Validate MinIO client image
    # -------------------------------------------------------------------------

    - |
      grep \
        "image: minio/mc:" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "MinIO client image validated."


    # -------------------------------------------------------------------------
    # 12. Validate backup implementation
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Validating backup implementation..."

      grep \
        "pg_dump" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "pg_restore" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "sha256sum" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "mc cp" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "mc stat" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "Backup implementation validation successful."


    # -------------------------------------------------------------------------
    # 13. Validate CronJob schedule
    # -------------------------------------------------------------------------

    - |
      echo
      echo "Validating CronJob schedule..."

      grep \
        'schedule: "0 2 \* \* \*"' \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "CronJob schedule validated."


    # -------------------------------------------------------------------------
    # 14. Validate concurrency policy
    # -------------------------------------------------------------------------

    - |
      grep \
        "concurrencyPolicy: Forbid" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "CronJob concurrency policy validated."


    # -------------------------------------------------------------------------
    # 15. Render PRA source through Kustomize
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "SOURCE PRA KUSTOMIZE VALIDATION"
      echo "============================================================"

      rm -f "$PRA_RENDERED_PATH"

      kubectl kustomize \
        "$PRA_SOURCE_PATH" \
        > "$PRA_RENDERED_PATH"

      test -s "$PRA_RENDERED_PATH"

      echo
      echo "PRA source Kustomize rendering successful."


    # -------------------------------------------------------------------------
    # 16. Validate rendered CronJob
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: CronJob" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_RENDERED_PATH"

      echo
      echo "Rendered PRA CronJob validated."


    # -------------------------------------------------------------------------
    # 17. Client-side validation of rendered workload
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_RENDERED_PATH" \
        > /dev/null

      echo
      echo "PRA workload Kubernetes validation successful."


    # -------------------------------------------------------------------------
    # 18. Client-side validation of Argo CD Application
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_SOURCE_PATH/application.yaml" \
        > /dev/null

      echo
      echo "PRA Argo CD Application manifest validation successful."


    # -------------------------------------------------------------------------
    # 19. Validate GitOps credentials Secret
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "GITOPS CREDENTIAL VALIDATION"
      echo "============================================================"

      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials


    # -------------------------------------------------------------------------
    # 20. Clean previous temporary files
    # -------------------------------------------------------------------------

    - rm -rf "$GITOPS_WORKDIR"
    - rm -f /tmp/.netrc
    - rm -f "$PRA_RENDERED_PATH"


    # -------------------------------------------------------------------------
    # 21. Load GitOps credentials
    # -------------------------------------------------------------------------

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "$LAB_GITOPS_GIT_USER"
      test -n "$LAB_GITOPS_GIT_TOKEN"

      echo
      echo "GitOps credentials loaded."


    # -------------------------------------------------------------------------
    # 22. Create temporary Git authentication file
    # -------------------------------------------------------------------------

    - |
      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc


    # -------------------------------------------------------------------------
    # 23. Clone lab-gitops
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "CLONING LAB-GITOPS"
      echo "============================================================"

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"


    # -------------------------------------------------------------------------
    # 24. Validate GitOps branch and revision
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "GITOPS REPOSITORY DIAGNOSTICS"
      echo "============================================================"

      echo
      echo "Current branch:"
      git -C "$GITOPS_WORKDIR" branch --show-current

      echo
      echo "Current revision:"
      git -C "$GITOPS_WORKDIR" rev-parse --short HEAD

      test "$(
        git -C "$GITOPS_WORKDIR" branch --show-current
      )" = "$GITOPS_BRANCH"


    # -------------------------------------------------------------------------
    # 25. Validate GitOps repository structure
    # -------------------------------------------------------------------------

    - |
      test -d "$GITOPS_WORKDIR/apps"
      test -d "$GITOPS_WORKDIR/workloads"

      echo
      echo "GitOps structure validated:"
      echo "  $GITOPS_WORKDIR/apps"
      echo "  $GITOPS_WORKDIR/workloads"


    # -------------------------------------------------------------------------
    # 26. Create PRA GitOps destination directories
    # -------------------------------------------------------------------------

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"


    # -------------------------------------------------------------------------
    # 27. Copy PostgreSQL backup CronJob
    # -------------------------------------------------------------------------

    - |
      cp \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH/postgresql-backup-cronjob.yaml"


    # -------------------------------------------------------------------------
    # 28. Copy Kustomization
    # -------------------------------------------------------------------------

    - |
      cp \
        "$PRA_SOURCE_PATH/kustomization.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH/kustomization.yaml"


    # -------------------------------------------------------------------------
    # 29. Copy Argo CD Application
    # -------------------------------------------------------------------------

    - |
      cp \
        "$PRA_SOURCE_PATH/application.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"


    # -------------------------------------------------------------------------
    # 30. Render copied GitOps workload
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "GITOPS PRA KUSTOMIZE VALIDATION"
      echo "============================================================"

      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH" \
        > "$PRA_RENDERED_PATH"

      test -s "$PRA_RENDERED_PATH"

      echo
      echo "GitOps PRA Kustomize rendering successful."


    # -------------------------------------------------------------------------
    # 31. Validate rendered GitOps workload
    # -------------------------------------------------------------------------

    - |
      grep \
        "kind: CronJob" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${POSTGRES_SECRET}" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${BACKUP_S3_SECRET}" \
        "$PRA_RENDERED_PATH"

      echo
      echo "Rendered GitOps PRA workload validated."


    # -------------------------------------------------------------------------
    # 32. Client-side Kubernetes validation
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_RENDERED_PATH" \
        > /dev/null

      echo
      echo "GitOps PRA CronJob client validation successful."


    # -------------------------------------------------------------------------
    # 33. Validate Argo CD Application name
    # -------------------------------------------------------------------------

    - |
      grep \
        "name: real-estate-pra" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"


    # -------------------------------------------------------------------------
    # 34. Validate Argo CD Application workload path
    # -------------------------------------------------------------------------

    - |
      grep \
        "path: workloads/real-estate/pra" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"


    # -------------------------------------------------------------------------
    # 35. Validate Argo CD Application repository
    # -------------------------------------------------------------------------

    - |
      grep \
        "repoURL: https://gitlab.local/root/lab-gitops.git" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"


    # -------------------------------------------------------------------------
    # 36. Validate Argo CD Application branch
    # -------------------------------------------------------------------------

    - |
      grep \
        "targetRevision: main" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      echo
      echo "PRA Argo CD Application validated."


    # -------------------------------------------------------------------------
    # 37. Client-side Application validation after copy
    # -------------------------------------------------------------------------

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      echo
      echo "PRA Argo CD Application client validation successful."


    # -------------------------------------------------------------------------
    # 38. Display GitOps desired-state locations
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "PRA GITOPS DESIRED STATE"
      echo "============================================================"

      echo
      echo "Workload directory:"
      echo "$GITOPS_PRA_PATH"

      echo
      echo "Application directory:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "Files:"

      find \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH" \
        -maxdepth 1 \
        -type f \
        -print

      find \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH" \
        -maxdepth 1 \
        -type f \
        -print


    # -------------------------------------------------------------------------
    # 39. Configure Git identity
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" config \
        user.name \
        "chasse-immobiliere-ci"

      git -C "$GITOPS_WORKDIR" config \
        user.email \
        "gitlab-ci@lab.local"


    # -------------------------------------------------------------------------
    # 40. Stage only PRA GitOps resources
    # -------------------------------------------------------------------------

    - |
      git -C "$GITOPS_WORKDIR" add \
        "$GITOPS_PRA_PATH" \
        "$GITOPS_APP_PATH"

      echo
      echo "GitOps staged PRA changes:"

      git -C "$GITOPS_WORKDIR" status \
        --short


    # -------------------------------------------------------------------------
    # 41. Commit and push only when desired state changed
    # -------------------------------------------------------------------------

    - |
      if git -C "$GITOPS_WORKDIR" diff --cached --quiet; then

        echo
        echo "No PRA GitOps changes detected."

      else

        echo
        echo "Creating PRA GitOps commit..."

        git -C "$GITOPS_WORKDIR" commit \
          -m "deploy: publish real-estate postgresql PRA backup ${CI_COMMIT_SHORT_SHA}"

        echo
        echo "Pushing PRA GitOps desired state..."

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git -C "$GITOPS_WORKDIR" push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "PRA GitOps publication completed."

      fi


    # -------------------------------------------------------------------------
    # 42. Final publication summary
    # -------------------------------------------------------------------------

    - |
      echo
      echo "============================================================"
      echo "REAL ESTATE PCA / PRA GITOPS PUBLICATION SUMMARY"
      echo "============================================================"

      echo
      echo "Application source repository:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "PRA source manifests:"
      echo "$PRA_SOURCE_PATH"

      echo
      echo "GitOps repository:"
      echo "$GITOPS_REPOSITORY"

      echo
      echo "GitOps branch:"
      echo "$GITOPS_BRANCH"

      echo
      echo "GitOps workload:"
      echo "$GITOPS_PRA_PATH"

      echo
      echo "Argo CD Application:"
      echo "$GITOPS_APP_PATH"

      echo
      echo "CronJob:"
      echo "$CRONJOB_NAME"

      echo
      echo "Backup schedule:"
      echo "0 2 * * *"

      echo
      echo "Backup format:"
      echo "PostgreSQL pg_dump custom format"

      echo
      echo "Backup target:"
      echo "MinIO real-estate-backups/postgresql/"

      echo
      echo "Credential model:"
      echo "Kubernetes Secrets - no credential values stored in Git"

      echo
      echo "Argo root discovery:"
      echo "apps/ -> recursive directory discovery"

      echo
      echo "Deployment model:"
      echo "GitLab CI -> lab-gitops -> Argo CD -> Kubernetes"

      echo
      echo "Argo CD reconciliation:"
      echo "asynchronous - intentionally not awaited by this CI job"

      echo
      echo "PRA GitOps desired state published successfully."


  # =============================================================================
  # CLEANUP
  # =============================================================================

  after_script:
    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-pra-gitops
    - rm -f /tmp/real-estate-pra-rendered.yaml


  # =============================================================================
  # EXECUTION RULES
  # =============================================================================

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/kubernetes/pra/**/*
        - .gitlab/ci/pra.yml
        - .gitlab-ci.yml