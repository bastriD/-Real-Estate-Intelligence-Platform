# =============================================================================
# REAL ESTATE PCA / PRA - POSTGRESQL BACKUP
# =============================================================================
#
# PURPOSE
#
#   - Validate the PostgreSQL backup CronJob source manifests.
#   - Publish the permanent PRA desired state to lab-gitops.
#   - Let Argo CD deploy and continuously reconcile the backup CronJob.
#   - Validate required PostgreSQL and MinIO backup Secrets.
#   - Keep backup credentials outside Git.
#
# DEPLOYMENT FLOW
#
#   chasse_immobiliere
#     deploy/kubernetes/pra/
#       postgresql-backup-cronjob.yaml
#       kustomization.yaml
#       application.yaml
#              |
#              v
#       pra:publish-gitops
#              |
#              v
#   lab-gitops
#     workloads/real-estate/pra/
#     apps/real-estate-pra/
#              |
#              v
#       Argo CD root-app
#              |
#              v
#       real-estate-pra
#              |
#              v
#   Kubernetes namespace real-estate
#              |
#              v
#   CronJob real-estate-postgresql-backup
#
# IMPORTANT
#
# - This is a PERMANENT workload.
# - Deployment is GitOps-driven.
# - GitLab CI does NOT directly create the CronJob.
# - kubectl is used only for validation and runtime evidence.
# - PostgreSQL credentials remain in:
#       real-estate-postgresql-secret
# - MinIO backup credentials remain in:
#       real-estate-backup-s3
# - No credential value is committed to Git.
# - Backup target:
#       real-estate-backups/postgresql/
#
# PRA EVIDENCE ALREADY ESTABLISHED BEFORE AUTOMATION
#
# - PostgreSQL database size: approximately 47 MB.
# - pg_dump custom format successfully tested.
# - Backup uploaded to MinIO successfully.
# - Backup structural validation successfully tested.
# - Backup restored into isolated PostgreSQL 16.
# - Restore duration observed: 6 seconds.
# - Business row counts matched the pre-backup baseline.
#
# =============================================================================


# =============================================================================
# 1. PUBLISH PRA DESIRED STATE TO LAB-GITOPS
# =============================================================================

pra:publish-gitops:
  stage: deploy

  tags:
    - shell

  variables:
    # -------------------------------------------------------------------------
    # Kubernetes
    # -------------------------------------------------------------------------

    K8S_NAMESPACE: "real-estate"

    POSTGRES_SECRET: "real-estate-postgresql-secret"
    BACKUP_S3_SECRET: "real-estate-backup-s3"

    CRONJOB_NAME: "real-estate-postgresql-backup"

    # -------------------------------------------------------------------------
    # Source repository
    # -------------------------------------------------------------------------

    PRA_SOURCE_PATH: "$CI_PROJECT_DIR/deploy/kubernetes/pra"

    # -------------------------------------------------------------------------
    # GitOps
    # -------------------------------------------------------------------------

    GITOPS_REPOSITORY: "https://gitlab.local/root/lab-gitops.git"
    GITOPS_BRANCH: "main"

    GITOPS_WORKDIR: "/tmp/chasse-pra-gitops"

    GITOPS_PRA_PATH: "workloads/real-estate/pra"
    GITOPS_APP_PATH: "apps/real-estate-pra"

    # -------------------------------------------------------------------------
    # Temporary validation files
    # -------------------------------------------------------------------------

    PRA_RENDERED_PATH: "/tmp/real-estate-pra-rendered.yaml"

  script:

    # =========================================================================
    # 1.1 Validate shell runner tooling
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "PRA RUNNER TOOLING"
      echo "============================================================"

      git --version
      kubectl version --client


    # =========================================================================
    # 1.2 Validate PRA source directory
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "PRA SOURCE VALIDATION"
      echo "============================================================"

      echo
      echo "CI project directory:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "PRA source path:"
      echo "$PRA_SOURCE_PATH"

      test -d "$PRA_SOURCE_PATH"

      test -f "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"
      test -f "$PRA_SOURCE_PATH/kustomization.yaml"
      test -f "$PRA_SOURCE_PATH/application.yaml"

      echo
      echo "PRA source manifests found."

      find "$PRA_SOURCE_PATH" \
        -maxdepth 1 \
        -type f \
        -print


    # =========================================================================
    # 1.3 Validate Kubernetes namespace
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "KUBERNETES DEPENDENCY VALIDATION"
      echo "============================================================"

      kubectl get namespace \
        "$K8S_NAMESPACE"


    # =========================================================================
    # 1.4 Validate PostgreSQL Secret
    # =========================================================================

    - |
      echo
      echo "Validating PostgreSQL Secret..."

      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$POSTGRES_SECRET"

      echo "PostgreSQL Secret exists."


    # =========================================================================
    # 1.5 Validate dedicated MinIO backup Secret
    # =========================================================================

    - |
      echo
      echo "Validating MinIO backup Secret..."

      kubectl \
        -n "$K8S_NAMESPACE" \
        get secret \
        "$BACKUP_S3_SECRET"

      echo "MinIO backup Secret exists."


    # =========================================================================
    # 1.6 Validate required PostgreSQL Secret keys
    # =========================================================================

    - |
      echo
      echo "Validating PostgreSQL Secret keys..."

      for KEY in \
        POSTGRES_DB \
        POSTGRES_HOST \
        POSTGRES_PASSWORD \
        POSTGRES_PORT \
        POSTGRES_USER
      do

        VALUE="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get secret \
            "$POSTGRES_SECRET" \
            -o "jsonpath={.data.${KEY}}" \
            2>/dev/null || true
        )"

        if [ -z "$VALUE" ]; then
          echo "ERROR: missing PostgreSQL Secret key: $KEY"
          exit 1
        fi

        echo " - $KEY: present"

      done

      echo "PostgreSQL Secret key validation successful."


    # =========================================================================
    # 1.7 Validate required backup S3 Secret keys
    # =========================================================================

    - |
      echo
      echo "Validating backup S3 Secret keys..."

      for KEY in \
        AWS_ACCESS_KEY_ID \
        AWS_ENDPOINT_URL \
        AWS_SECRET_ACCESS_KEY \
        S3_BUCKET
      do

        VALUE="$(
          kubectl \
            -n "$K8S_NAMESPACE" \
            get secret \
            "$BACKUP_S3_SECRET" \
            -o "jsonpath={.data.${KEY}}" \
            2>/dev/null || true
        )"

        if [ -z "$VALUE" ]; then
          echo "ERROR: missing backup S3 Secret key: $KEY"
          exit 1
        fi

        echo " - $KEY: present"

      done

      echo "Backup S3 Secret key validation successful."


    # =========================================================================
    # 1.8 Validate source CronJob references expected Secrets
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "PRA CRONJOB SOURCE CHECKS"
      echo "============================================================"

      grep \
        "name: ${POSTGRES_SECRET}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "name: ${BACKUP_S3_SECRET}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "Expected Secret references found."


    # =========================================================================
    # 1.9 Validate expected CronJob name
    # =========================================================================

    - |
      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo "CronJob name validated."


    # =========================================================================
    # 1.10 Validate expected workload images
    # =========================================================================

    - |
      echo
      echo "Validating backup runtime images..."

      grep \
        "image: postgres:16" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "image: minio/mc:" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo "Backup runtime images validated."


    # =========================================================================
    # 1.11 Validate critical backup commands
    # =========================================================================

    - |
      echo
      echo "Validating backup implementation..."

      grep \
        "pg_dump" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "pg_restore" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "sha256sum" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "mc cp" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "mc stat" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo
      echo "Backup implementation checks successful."


    # =========================================================================
    # 1.12 Validate scheduling and concurrency policy
    # =========================================================================

    - |
      echo
      echo "Validating CronJob scheduling policy..."

      grep \
        'schedule: "0 2 \* \* \*"' \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      grep \
        "concurrencyPolicy: Forbid" \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml"

      echo "CronJob scheduling policy validated."


    # =========================================================================
    # 1.13 Render source Kustomization
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "SOURCE KUSTOMIZE VALIDATION"
      echo "============================================================"

      rm -f "$PRA_RENDERED_PATH"

      kubectl kustomize \
        "$PRA_SOURCE_PATH" \
        > "$PRA_RENDERED_PATH"

      test -s "$PRA_RENDERED_PATH"

      echo
      echo "PRA source Kustomize rendering successful."


    # =========================================================================
    # 1.14 Validate rendered CronJob
    # =========================================================================

    - |
      grep \
        "kind: CronJob" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_RENDERED_PATH"

      echo "Rendered PRA CronJob validated."


    # =========================================================================
    # 1.15 Client-side validation of source workload
    # =========================================================================

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_RENDERED_PATH" \
        > /dev/null

      echo
      echo "PRA workload Kubernetes manifest validation successful."


    # =========================================================================
    # 1.16 Client-side validation of Argo CD Application source
    # =========================================================================

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_SOURCE_PATH/application.yaml" \
        > /dev/null

      echo
      echo "PRA Argo CD Application manifest validation successful."


    # =========================================================================
    # 1.17 Validate existing GitOps credential Secret
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "GITOPS CREDENTIAL VALIDATION"
      echo "============================================================"

      kubectl \
        -n openmetadata \
        get secret \
        lab-gitops-git-credentials


    # =========================================================================
    # 1.18 Clean previous temporary GitOps files
    # =========================================================================

    - |
      rm -rf "$GITOPS_WORKDIR"
      rm -f /tmp/.netrc


    # =========================================================================
    # 1.19 Load GitOps credentials
    # =========================================================================

    - |
      export LAB_GITOPS_GIT_USER="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_USERNAME}' |
        base64 -d
      )"

      export LAB_GITOPS_GIT_TOKEN="$(
        kubectl \
          -n openmetadata \
          get secret \
          lab-gitops-git-credentials \
          -o jsonpath='{.data.GIT_TOKEN}' |
        base64 -d
      )"

      test -n "$LAB_GITOPS_GIT_USER"
      test -n "$LAB_GITOPS_GIT_TOKEN"

      echo "GitOps credentials loaded."


    # =========================================================================
    # 1.20 Create temporary Git authentication file
    # =========================================================================

    - |
      cat > /tmp/.netrc <<EOF_NETRC
      machine gitlab.local
      login ${LAB_GITOPS_GIT_USER}
      password ${LAB_GITOPS_GIT_TOKEN}
      EOF_NETRC

      chmod 600 /tmp/.netrc


    # =========================================================================
    # 1.21 Clone lab-gitops
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "CLONING LAB-GITOPS"
      echo "============================================================"

      HOME=/tmp \
      GIT_SSL_NO_VERIFY=true \
      git clone \
        --branch "$GITOPS_BRANCH" \
        --single-branch \
        "$GITOPS_REPOSITORY" \
        "$GITOPS_WORKDIR"


    # =========================================================================
    # 1.22 Validate GitOps branch
    # =========================================================================

    - |
      echo
      echo "Current GitOps branch:"

      git -C "$GITOPS_WORKDIR" \
        branch --show-current

      echo
      echo "Current GitOps revision:"

      git -C "$GITOPS_WORKDIR" \
        rev-parse --short HEAD

      test "$(
        git -C "$GITOPS_WORKDIR" \
          branch --show-current
      )" = "$GITOPS_BRANCH"


    # =========================================================================
    # 1.23 Validate GitOps architecture
    # =========================================================================

    - |
      test -d "$GITOPS_WORKDIR/apps"
      test -d "$GITOPS_WORKDIR/workloads"

      echo
      echo "GitOps structure validated:"
      echo " - apps/"
      echo " - workloads/"


    # =========================================================================
    # 1.24 Create PRA GitOps destination directories
    # =========================================================================

    - |
      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH"

      mkdir -p \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH"


    # =========================================================================
    # 1.25 Copy PRA workload CronJob
    # =========================================================================

    - |
      cp \
        "$PRA_SOURCE_PATH/postgresql-backup-cronjob.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH/postgresql-backup-cronjob.yaml"


    # =========================================================================
    # 1.26 Copy PRA workload Kustomization
    # =========================================================================

    - |
      cp \
        "$PRA_SOURCE_PATH/kustomization.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH/kustomization.yaml"


    # =========================================================================
    # 1.27 Copy PRA Argo CD Application
    # =========================================================================

    - |
      cp \
        "$PRA_SOURCE_PATH/application.yaml" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"


    # =========================================================================
    # 1.28 Render copied GitOps workload
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "GITOPS PRA KUSTOMIZE VALIDATION"
      echo "============================================================"

      kubectl kustomize \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH" \
        > "$PRA_RENDERED_PATH"

      test -s "$PRA_RENDERED_PATH"

      echo "GitOps PRA Kustomize rendering successful."


    # =========================================================================
    # 1.29 Validate rendered GitOps workload
    # =========================================================================

    - |
      grep \
        "kind: CronJob" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${CRONJOB_NAME}" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${POSTGRES_SECRET}" \
        "$PRA_RENDERED_PATH"

      grep \
        "name: ${BACKUP_S3_SECRET}" \
        "$PRA_RENDERED_PATH"

      echo
      echo "Rendered GitOps PRA workload validated."


    # =========================================================================
    # 1.30 Validate GitOps CronJob with Kubernetes client
    # =========================================================================

    - |
      kubectl apply \
        --dry-run=client \
        -f "$PRA_RENDERED_PATH" \
        > /dev/null

      echo "GitOps PRA CronJob client validation successful."


    # =========================================================================
    # 1.31 Validate copied Argo CD Application
    # =========================================================================

    - |
      kubectl apply \
        --dry-run=client \
        -f "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml" \
        > /dev/null

      grep \
        "name: real-estate-pra" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "path: workloads/real-estate/pra" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "repoURL: https://gitlab.local/root/lab-gitops.git" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      grep \
        "targetRevision: main" \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH/application.yaml"

      echo
      echo "PRA Argo CD Application validated."


    # =========================================================================
    # 1.32 Display desired-state files
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "PRA GITOPS DESIRED STATE"
      echo "============================================================"

      echo
      echo "Workload:"
      echo "$GITOPS_PRA_PATH"

      find \
        "$GITOPS_WORKDIR/$GITOPS_PRA_PATH" \
        -maxdepth 1 \
        -type f \
        -print

      echo
      echo "Argo CD Application:"
      echo "$GITOPS_APP_PATH"

      find \
        "$GITOPS_WORKDIR/$GITOPS_APP_PATH" \
        -maxdepth 1 \
        -type f \
        -print


    # =========================================================================
    # 1.33 Configure Git identity
    # =========================================================================

    - |
      git -C "$GITOPS_WORKDIR" config \
        user.name \
        "chasse-immobiliere-ci"

      git -C "$GITOPS_WORKDIR" config \
        user.email \
        "gitlab-ci@lab.local"


    # =========================================================================
    # 1.34 Stage only PRA GitOps resources
    # =========================================================================

    - |
      git -C "$GITOPS_WORKDIR" add \
        "$GITOPS_PRA_PATH" \
        "$GITOPS_APP_PATH"

      echo
      echo "GitOps staged PRA changes:"

      git -C "$GITOPS_WORKDIR" \
        status --short


    # =========================================================================
    # 1.35 Commit and push only if desired state changed
    # =========================================================================

    - |
      if git -C "$GITOPS_WORKDIR" diff --cached --quiet; then

        echo
        echo "No PRA GitOps changes detected."

      else

        echo
        echo "Creating PRA GitOps commit..."

        git -C "$GITOPS_WORKDIR" commit \
          -m "deploy: publish real-estate postgresql PRA backup ${CI_COMMIT_SHORT_SHA}"

        echo
        echo "Pushing PRA GitOps desired state..."

        HOME=/tmp \
        GIT_SSL_NO_VERIFY=true \
        git -C "$GITOPS_WORKDIR" push \
          origin \
          "$GITOPS_BRANCH"

        echo
        echo "PRA GitOps publication completed."

      fi


    # =========================================================================
    # 1.36 Wait for Argo CD Application discovery
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "WAITING FOR ARGO CD PRA APPLICATION"
      echo "============================================================"

      FOUND="false"

      for i in $(seq 1 60); do

        if kubectl \
          -n argocd \
          get application \
          real-estate-pra \
          > /dev/null 2>&1
        then

          FOUND="true"

          echo
          echo "Argo CD Application discovered."

          break
        fi

        echo "Waiting for real-estate-pra Application..."
        sleep 2

      done

      if [ "$FOUND" != "true" ]; then

        echo
        echo "ERROR:"
        echo "Argo CD Application real-estate-pra was not discovered."

        exit 1

      fi


    # =========================================================================
    # 1.37 Wait for CronJob reconciliation
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "WAITING FOR PRA CRONJOB"
      echo "============================================================"

      FOUND="false"

      for i in $(seq 1 60); do

        if kubectl \
          -n "$K8S_NAMESPACE" \
          get cronjob \
          "$CRONJOB_NAME" \
          > /dev/null 2>&1
        then

          FOUND="true"

          echo
          echo "PRA CronJob discovered."

          break
        fi

        echo "Waiting for ${CRONJOB_NAME}..."
        sleep 2

      done

      if [ "$FOUND" != "true" ]; then

        echo
        echo "ERROR:"
        echo "PRA CronJob was not reconciled by Argo CD."

        kubectl \
          -n argocd \
          get application \
          real-estate-pra \
          -o wide || true

        exit 1

      fi


    # =========================================================================
    # 1.38 Display Argo CD Application status
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "ARGO CD PRA STATUS"
      echo "============================================================"

      kubectl \
        -n argocd \
        get application \
        real-estate-pra \
        -o wide


    # =========================================================================
    # 1.39 Display deployed CronJob
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "DEPLOYED PRA CRONJOB"
      echo "============================================================"

      kubectl \
        -n "$K8S_NAMESPACE" \
        get cronjob \
        "$CRONJOB_NAME" \
        -o wide


    # =========================================================================
    # 1.40 Validate deployed schedule
    # =========================================================================

    - |
      DEPLOYED_SCHEDULE="$(
        kubectl \
          -n "$K8S_NAMESPACE" \
          get cronjob \
          "$CRONJOB_NAME" \
          -o jsonpath='{.spec.schedule}'
      )"

      echo
      echo "Deployed schedule:"
      echo "$DEPLOYED_SCHEDULE"

      test "$DEPLOYED_SCHEDULE" = "0 2 * * *"

      echo "Deployed schedule validated."


    # =========================================================================
    # 1.41 Validate deployed concurrency policy
    # =========================================================================

    - |
      DEPLOYED_CONCURRENCY="$(
        kubectl \
          -n "$K8S_NAMESPACE" \
          get cronjob \
          "$CRONJOB_NAME" \
          -o jsonpath='{.spec.concurrencyPolicy}'
      )"

      echo
      echo "Deployed concurrency policy:"
      echo "$DEPLOYED_CONCURRENCY"

      test "$DEPLOYED_CONCURRENCY" = "Forbid"

      echo "Concurrency policy validated."


    # =========================================================================
    # 1.42 Final summary
    # =========================================================================

    - |
      echo
      echo "============================================================"
      echo "REAL ESTATE PCA / PRA PUBLICATION COMPLETED"
      echo "============================================================"

      echo
      echo "Source repository:"
      echo "$CI_PROJECT_DIR"

      echo
      echo "Source manifests:"
      echo "$PRA_SOURCE_PATH"

      echo
      echo "GitOps repository:"
      echo "$GITOPS_REPOSITORY"

      echo
      echo "GitOps workload:"
      echo "$GITOPS_PRA_PATH"

      echo
      echo "Argo CD Application:"
      echo "real-estate-pra"

      echo
      echo "Kubernetes namespace:"
      echo "$K8S_NAMESPACE"

      echo
      echo "CronJob:"
      echo "$CRONJOB_NAME"

      echo
      echo "Schedule:"
      echo "0 2 * * *"

      echo
      echo "Backup format:"
      echo "PostgreSQL pg_dump custom format"

      echo
      echo "Backup target:"
      echo "MinIO real-estate-backups/postgresql/"

      echo
      echo "Credential model:"
      echo "Kubernetes Secrets only - no values stored in Git"

      echo
      echo "Deployment model:"
      echo "GitLab CI -> lab-gitops -> Argo CD -> Kubernetes"

      echo
      echo "Previously proven PRA restore:"
      echo "isolated PostgreSQL restore successful"

      echo
      echo "Measured restore duration:"
      echo "6 seconds"


  # =============================================================================
  # CLEANUP
  # =============================================================================

  after_script:

    - rm -f /tmp/.netrc
    - rm -rf /tmp/chasse-pra-gitops
    - rm -f /tmp/real-estate-pra-rendered.yaml


  # =============================================================================
  # EXECUTION RULES
  # =============================================================================

  rules:

    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/kubernetes/pra/**/*
        - .gitlab/ci/pra.yml
        - .gitlab-ci.yml