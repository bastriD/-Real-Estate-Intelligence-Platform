# Job configuration only; implementation lives in scripts/ci/.
pra:publish-gitops:
  resource_group: lab-gitops-main
  stage: deploy
  tags:
    - shell
  needs:
    - job: database:validate
      artifacts: false
    - job: pipeline:validate
      artifacts: false
      optional: true
  variables:
    K8S_NAMESPACE: real-estate
    POSTGRES_SECRET: real-estate-postgresql-secret
    BACKUP_S3_SECRET: real-estate-backup-s3
    CRONJOB_NAME: real-estate-postgresql-backup
    PRA_SOURCE_PATH: $CI_PROJECT_DIR/deploy/kubernetes/pra
    GITOPS_REPOSITORY: https://gitlab.local/root/lab-gitops.git
    GITOPS_BRANCH: main
    GITOPS_WORKDIR: ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-pra-gitops
    GITOPS_PRA_PATH: workloads/real-estate/pra
    GITOPS_APP_PATH: apps/real-estate-pra
    PRA_RENDERED_PATH: ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-pra-rendered.yaml
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
  script:
    - . "$CI_PROJECT_DIR/scripts/ci/pra/publish-gitops.sh"
  after_script:
    - rm -rf ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/chasse-pra-gitops
    - rm -f ${CI_PROJECT_DIR}/.ci-tmp/${CI_JOB_ID}/real-estate-pra-rendered.yaml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - deploy/kubernetes/pra/**/*
        - .gitlab/ci/pra.yml
        - scripts/ci/**/*
        - .gitlab-ci.yml
